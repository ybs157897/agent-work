openapi: 3.1.0
info:
  title: Agent Team Workbench Web API
  version: 0.2.0
  description: |
    浏览器 ↔ Go Control Plane 协议（协议文档 §5）。
    约定：/api/v1 前缀；资源 ID 带类型前缀（ws_/agent_/wi_/run_/approval_/artifact_）；
    JSON 字段 snake_case；写命令要求 Idempotency-Key；可变资源带 version/ETag；
    错误一律 application/problem+json。
servers:
  - url: /api/v1

security:
  - cookieAuth: []

tags:
  - name: workspace
  - name: agent-profiles
  - name: work-items
  - name: plans
  - name: runs
  - name: approvals
  - name: artifacts
  - name: runtime-bindings
  - name: execution-hosts
  - name: workspace-locations
  - name: events
  - name: models
  - name: coordinator

paths:
  /me:
    get:
      tags: [workspace]
      operationId: getCurrentUser
      summary: 当前用户、Workspace 权限与功能标记
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/CurrentUser" } } } }

  /workspaces:
    get:
      tags: [workspace]
      operationId: listWorkspaces
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceList" } } } }

  /workspaces/{workspace_id}:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    patch:
      tags: [workspace]
      operationId: updateWorkspace
      description: 更新名称、时区和策略；Owner/Admin。
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/WorkspacePatch" } } } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/Workspace" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /workspaces/{workspace_id}/bootstrap:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [workspace]
      operationId: bootstrapWorkspace
      summary: 首屏 dashboard、agents、board、health 与 event_cursor 一次返回
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/Bootstrap" } } } }

  /workspaces/{workspace_id}/dashboard:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [workspace]
      operationId: getDashboard
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/Dashboard" } } } }

  /workspaces/{workspace_id}/events:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [events]
      operationId: subscribeEvents
      summary: SSE 事件流；Last-Event-ID 补发；cursor 过期返回 410
      responses:
        "200":
          description: text/event-stream
          content: { text/event-stream: { schema: { type: string } } }
        "410": { $ref: "#/components/responses/CursorExpired" }

  /workspaces/{workspace_id}/coordinator:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [coordinator]
      operationId: getTaskCoordinatorConfig
      summary: 获取 Workspace 唯一系统 Task Coordinator 配置
      description: 只返回 runtime/model/reasoning；系统提示词仅暴露不可变版本，不返回正文。
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/CoordinatorConfig" } } } }
    patch:
      tags: [coordinator]
      operationId: updateTaskCoordinatorConfig
      summary: 更新 Coordinator 可配置底座
      description: 只允许 Codex/Kimi runtime、model、reasoning_effort 与备用配置；instructions/prompt 修改一律拒绝。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CoordinatorConfigPatch" } } } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/CoordinatorConfig" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { description: prompt/runtime/model 校验失败, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /workspaces/{workspace_id}/agent-profiles:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [agent-profiles]
      operationId: listAgentProfiles
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/AgentProfileList" } } } }
    post:
      tags: [agent-profiles]
      operationId: createAgentProfile
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AgentProfileCreate" } } } }
      responses:
        "201": { content: { application/json: { schema: { $ref: "#/components/schemas/AgentProfile" } } } }

  /agent-profiles/{agent_profile_id}:
    parameters: [{ $ref: "#/components/parameters/AgentProfileId" }]
    get:
      tags: [agent-profiles]
      operationId: getAgentProfile
      parameters:
        - name: include
          in: query
          schema: { type: string, example: "presence,current_run" }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/AgentProfile" } } } }
    patch:
      tags: [agent-profiles]
      operationId: updateAgentProfile
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AgentProfilePatch" } } } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/AgentProfile" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /agent-profiles/{agent_profile_id}/commands/enable:
    parameters: [{ $ref: "#/components/parameters/AgentProfileId" }]
    post:
      tags: [agent-profiles]
      operationId: enableAgentProfile
      description: 允许被调度；不等于立刻运行。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/AgentProfile" } } } }

  /agent-profiles/{agent_profile_id}/commands/disable:
    parameters: [{ $ref: "#/components/parameters/AgentProfileId" }]
    post:
      tags: [agent-profiles]
      operationId: disableAgentProfile
      description: 停止新调度；活动 Run 按策略 interrupt（默认）。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: "#/components/schemas/DisableOptions" } } } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/AgentProfile" } } } }

  /workspaces/{workspace_id}/work-items:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [work-items]
      operationId: listWorkItems
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: priority, in: query, schema: { type: string } }
        - { name: assignee, in: query, schema: { type: string } }
        - name: record_kind
          in: query
          required: false
          schema: { type: string, enum: [chat, task] }
          description: 缺省为 task；Chat 与 Task 列表不得混读，Chat 调用方必须显式传 chat。
        - name: parent_id
          in: query
          required: false
          schema: { type: string }
          description: 缺省不过滤；值 `none` 只看根任务（无父链接）。
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkItemList" } } } }
    post:
      tags: [work-items]
      operationId: createWorkItem
      description: |
        创建工作项。公开调用省略 record_kind 时按 Task 处理，并由系统 Task
        Coordinator 自动接取根 Task；调用方不得关闭该交接或指定 Worker。
        根 Task 的初始 status 只能省略或为 todo，in_progress/blocked/completed/cancelled
        均返回 422，避免绕过 Coordinator 与人工验收。Chat 必须显式传 record_kind=chat，
        并保留其独立记录语义。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/WorkItemCreate" } } } }
      responses:
        "201": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkItem" } } } }
        "422": { description: record_kind/Task assignment/根 Task 初始状态校验失败, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /work-items/{work_item_id}:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    get:
      tags: [work-items]
      operationId: getWorkItem
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkItem" } } } }
    patch:
      tags: [work-items]
      operationId: updateWorkItem
      description: 普通字段修改；status 不允许任意 PATCH。
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/WorkItemPatch" } } } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkItem" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /work-items/{work_item_id}/commands/assign:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    post:
      tags: [work-items]
      operationId: assignWorkItem
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_profile_id, expected_version]
              properties:
                agent_profile_id: { type: string }
                expected_version: { type: integer }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkItem" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /work-items/{work_item_id}/commands/move:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    post:
      tags: [work-items]
      operationId: moveWorkItem
      description: 看板移动、排序与状态机校验。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, expected_version]
              properties:
                status: { $ref: "#/components/schemas/WorkItemStatus" }
                expected_version: { type: integer }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkItem" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /work-items/{work_item_id}/commands/claim:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    post:
      tags: [work-items]
      operationId: claimWorkItem
      description: |
        M4 认领命令（发布 → 领取）：仅 todo 且当前无 assignee 可认领。
        认领 = 指派 + 按目标 agent WakeOnAssignment 入队 assignment 唤醒；
        同 agent 重复认领幂等返回现状；已有 assignee 或非 todo → 409。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, expected_version]
              properties:
                agent_id: { type: string, description: 认领者 agent profile id }
                expected_version: { type: integer }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkItem" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /work-items/{work_item_id}/commands/return:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    post:
      tags: [work-items]
      operationId: returnWorkItem
      description: |
        手动打回（验收回流人工半环）：in_progress 且 phase=acceptance/review
        时合法 → phase=execution；其余 phase → 409。reason 必填（trim 后为空返回
        422 review_feedback_required），并生成不可变 review_feedback TaskComment：
        coordinated root 在同一事务完成 WorkItem BeginExecution + Coordinator
        waiting_user→queued；coordinated child 拒绝（409 child_review_not_supported），
        历史非 Coordinator Task 保留旧回流行为但不创建 TaskComment。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, expected_version]
              properties:
                reason: { type: string, minLength: 1, description: 打回原因（必填；生成不可变 review_feedback comment 并落 activity） }
                expected_version: { type: integer }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkItem" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /work-items/{work_item_id}/commands/block:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    post:
      tags: [work-items]
      operationId: blockWorkItem
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, message, expected_version]
              properties:
                code: { type: string }
                message: { type: string }
                source: { type: string }
                expected_version: { type: integer }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkItem" } } } }

  /work-items/{work_item_id}/commands/unblock:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    post:
      tags: [work-items]
      operationId: unblockWorkItem
      description: 解除阻塞回到 in_progress；恢复执行由用户显式创建新 Run。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version]
              properties:
                expected_version: { type: integer }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkItem" } } } }

  /work-items/{work_item_id}/tree:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    get:
      tags: [plans]
      operationId: getWorkItemTree
      summary: 以该任务为根的整棵子树（先序；DTO 带 parent_id）
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkItemTree" } } } }

  /work-items/{work_item_id}/plan:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    get:
      tags: [plans]
      operationId: getWorkItemPlan
      summary: 该主任务最新一份 plan（created_at 最新，不限状态）；无 plan 404
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/Plan" } } } }
        "404": { description: 该任务尚无 plan, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /work-items/{work_item_id}/coordinator:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    get:
      tags: [coordinator]
      operationId: getTaskCoordinatorSnapshot
      summary: Task Coordinator 控制线快照
      description: 仅 Task 可见；Chat 记录返回 validation_failed，不泄漏任务控制线。
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/CoordinatorSnapshot" } } } }
        "404": { description: 尚未创建 Coordinator state, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: Chat 不属于任务控制线, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /work-items/{work_item_id}/coordinator/events:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    get:
      tags: [coordinator]
      operationId: listTaskCoordinatorEvents
      summary: Task Coordinator 因果时间线
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/CoordinatorTimelineList" } } } }
        "422": { description: Chat 不属于任务控制线, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /workspaces/{workspace_id}/plans:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    post:
      tags: [plans]
      operationId: createPlan
      description: |
        提交并同步执行一份 plan（dispatch/defer/finish）。同一 work item 唯一
        active/waiting plan：active 拒绝、waiting 同事务 supersede。
        verb 未知 / defer 非法 / 校验失败 → 400 problem+json（plan 不落库）。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PlanSubmit" } } } }
      responses:
        "201": { content: { application/json: { schema: { $ref: "#/components/schemas/Plan" } } } }
        "400": { description: verb 未知 / defer 无出口 / 字段校验失败, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /plans/{plan_id}:
    parameters: [{ $ref: "#/components/parameters/PlanId" }]
    get:
      tags: [plans]
      operationId: getPlan
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/Plan" } } } }

  /work-items/{work_item_id}/runs:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    get:
      tags: [runs]
      operationId: listWorkItemRuns
      summary: 一个任务的全部 Run（对话轮次历史；不可覆盖的执行尝试）
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ExecutionRunList" } } } }
    post:
      tags: [runs]
      operationId: createRun
      description: 创建 ExecutionRun；立即 202，真正开始执行由 SSE 事件确认。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }, { $ref: "#/components/parameters/IfMatch" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RunCreate" } } } }
      responses:
        "202": { content: { application/json: { schema: { $ref: "#/components/schemas/RunAccepted" } } } }

  /work-items/{work_item_id}/dispatches:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    get:
      tags: [work-items]
      operationId: listWorkItemDispatches
      summary: 派发卡片时间线（批次 + 成员 runs 摘要 + 触发消息摘录；新→旧）
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/DispatchCardList" } } } }

  /work-items/{work_item_id}/decisions:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    get:
      tags: [work-items]
      operationId: listWorkItemDecisions
      summary: 决策台账（用户原话引文；创建时间升序；只读投影）
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/DecisionList" } } } }
    post:
      tags: [work-items]
      operationId: recordWorkItemDecision
      description: 决策原话落台账（S2）。quote 必填且 trim 后非空；source_run_id 可选但必须属于该 work item。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DecisionCreate" } } } }
      responses:
        "201": { content: { application/json: { schema: { $ref: "#/components/schemas/DecisionEntry" } } } }
        "422": { description: quote 为空 / source_run_id 不存在或不属于该任务, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { description: 任务不存在, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /runs/{run_id}:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    get:
      tags: [runs]
      operationId: getRun
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ExecutionRun" } } } }

  /runs/{run_id}/events:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    get:
      tags: [runs]
      operationId: listRunEvents
      summary: 回放 Run 事件历史（对话页消息重建；只读投影，按 run_seq 排序）
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/RunEventList" } } } }

  /runs/{run_id}/commands/input:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    post:
      tags: [runs]
      operationId: sendRunInput
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instruction]
              properties:
                instruction: { type: string }
      responses:
        "202": { description: 命令已接受 }

  /runs/{run_id}/commands/interrupt:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    post:
      tags: [runs]
      operationId: interruptRun
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses: { "202": { description: 命令已接受 } }

  /runs/{run_id}/commands/cancel:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    post:
      tags: [runs]
      operationId: cancelRun
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses: { "202": { description: 命令已接受 } }

  /runs/{run_id}/commands/retry:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    post:
      tags: [runs]
      operationId: retryRun
      description: 总是创建新 Run（retry_of=当前 run），不覆盖终态；返回完整 ExecutionRun。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "202": { content: { application/json: { schema: { $ref: "#/components/schemas/ExecutionRun" } } } }

  /runs/{run_id}/commands/resume:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    post:
      tags: [runs]
      operationId: resumeRun
      description: 仅在能力声明 resume 时可用，否则 422。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "202": { description: 命令已接受 }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /runs/{run_id}/approvals:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    get:
      tags: [approvals]
      operationId: listApprovals
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalList" } } } }

  /runs/{run_id}/approvals/{approval_id}/commands/resolve:
    parameters: [{ $ref: "#/components/parameters/RunId" }, { $ref: "#/components/parameters/ApprovalId" }]
    post:
      tags: [approvals]
      operationId: resolveApproval
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approved, rejected] }
                reason: { type: string }
                scope:
                  type: string
                  enum: [once, thread, workspace]
                  default: once
                  description: >-
                    决议作用域。approved 且 scope=thread/workspace 时创建「总是允许」
                    授权：后续同 workspace/agent/kind（thread 另要求同 work item）
                    且摘要前缀命中的审批请求自动代答批准（activity 可追溯）。
                    仅 command/file_change/permissions 支持（其余 kind 返回 422）；
                    拒绝忽略 scope，缺省等价 once。
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/Approval" } } } }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /runs/{run_id}/artifacts:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    get:
      tags: [artifacts]
      operationId: listArtifacts
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ArtifactList" } } } }

  /runs/{run_id}/changes:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    get:
      tags: [runs]
      operationId: getRunChanges
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/RunChanges" } } } }

  /runs/{run_id}/changes/diff:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    get:
      tags: [runs]
      operationId: getRunChangeDiff
      parameters: [{ name: path, in: query, required: true, schema: { type: string } }]
      responses: { "200": { content: { application/json: { schema: { type: object, required: [path, diff], properties: { path: { type: string }, diff: { type: string }, truncated: { type: boolean }, binary: { type: boolean } } } } } } }

  /runs/{run_id}/commands/revert-changes:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    post:
      tags: [runs]
      operationId: revertRunChanges
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotency_key]
              properties: { idempotency_key: { type: string } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/RunChanges" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /workspaces/{workspace_id}/activities:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [workspace]
      operationId: listActivities
      parameters: [{ $ref: "#/components/parameters/Cursor" }]
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ActivityList" } } } }

  /workspaces/{workspace_id}/search:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [workspace]
      operationId: searchWorkspace
      summary: FTS 检索（片段摘要/决策台账/产物标题；snippet 带 [] 高亮标记）
      description: 索引为派生存储（定点重写），q 为空或纯符号返回空 items；不发 SSE 事件。
      parameters:
        - { name: q, in: query, required: true, schema: { type: string }, description: 检索词（空格分词 AND 语义） }
        - { name: record_kind, in: query, required: false, schema: { type: string, enum: [task] }, description: 缺省或 task；Chat 记录不属于任务搜索面 }
        - { name: work_item_id, in: query, schema: { type: string }, description: 可选，限定单任务 }
        - { name: kind, in: query, schema: { type: string, enum: [segment_summary, decision, artifact] } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/SearchList" } } } }

  /workspaces/{workspace_id}/runtime-bindings:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [runtime-bindings]
      operationId: listRuntimeBindings
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/RuntimeBindingList" } } } }
    post:
      tags: [runtime-bindings]
      operationId: createRuntimeBinding
      description: 添加 Runtime 与模型配置（provider/model/CredentialRef）；凭据只存引用。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [runtime_label, adapter_id]
              properties:
                runtime_label: { type: string }
                adapter_id: { type: string }
                provider: { type: string }
                model: { type: string }
                credential_ref: { type: string }
      responses:
        "201": { content: { application/json: { schema: { $ref: "#/components/schemas/RuntimeBinding" } } } }

  /runtime-bindings/{runtime_binding_id}:
    parameters: [{ $ref: "#/components/parameters/RuntimeBindingId" }]
    patch:
      tags: [runtime-bindings]
      operationId: patchRuntimeBinding
      description: 修改模型配置（provider/model/credential_ref），乐观锁保护。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version]
              properties:
                provider: { type: string }
                model: { type: string }
                credential_ref: { type: string }
                expected_version: { type: integer }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/RuntimeBinding" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /runtime-bindings/{runtime_binding_id}/commands/probe:
    parameters: [{ $ref: "#/components/parameters/RuntimeBindingId" }]
    post:
      tags: [runtime-bindings]
      operationId: probeRuntimeBinding
      description: 探测版本、认证、协议与能力；不启动业务 Run。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "202": { content: { application/json: { schema: { $ref: "#/components/schemas/ProbeResult" } } } }

  /workspaces/{workspace_id}/agent-config/reload:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    post:
      tags: [agent-profiles]
      operationId: reloadAgentConfig
      summary: 重扫 agents/ 配置目录并导入 DB 投影（文件为真相源）
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/AgentConfigReloadResult" } } } }

  /models:
    get:
      tags: [models]
      operationId: listModels
      summary: 模型注册表列表（models/ 目录为真相源，全局共享不按 Workspace 隔离）
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ModelEntryList" } } } }
    post:
      tags: [models]
      operationId: createModel
      description: 新建模型条目；id 可空（由 display_name 生成 slug）。凭据只传环境变量名，绝不传密钥明文。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ModelUpsert" } } } }
      responses:
        "201": { content: { application/json: { schema: { $ref: "#/components/schemas/ModelEntry" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /models/{model_id}:
    parameters: [{ $ref: "#/components/parameters/ModelId" }]
    put:
      tags: [models]
      operationId: updateModel
      description: 全量替换模型条目（PUT 幂等语义；path id 为权威）。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ModelUpsert" } } } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ModelEntry" } } } }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [models]
      operationId: deleteModel
      description: 删除模型条目（幂等；引用它的 Agent 在下次创建 Run 时将收到 422）。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKeyOptional" }]
      responses:
        "204": { description: 已删除 }

  /health:
    get:
      tags: [workspace]
      operationId: getHealth
      summary: 分层健康投影（System Online 不是固定文案；含 runners 概览）
      security: []
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/HealthStatus" } } } }

  /agent-profiles/{agent_profile_id}/commands/wake:
    parameters: [{ $ref: "#/components/parameters/AgentProfileId" }]
    post:
      tags: [agent-profiles]
      operationId: wakeAgent
      summary: 手动唤醒（on_demand 源）；入队后由调度循环消费（≤一个 tick）并创建 run
      description: |
        agent 未开启 wake_on_demand 时返回 422。coalescing（活跃 run 期间合并）由
        调度循环统一判定；唤醒审计见 agent_wakeup_requests（consumed/coalesced）。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_key]
              properties:
                task_key: { type: string, description: 唤醒锚定的 work item id }
                instruction: { type: string, description: 显式指令；渲染时优先于 prompt_template }
                context:
                  type: object
                  additionalProperties: true
                  description: 附加唤醒上下文（合并进 wake context）
      responses:
        "202":
          content:
            application/json:
              schema:
                type: object
                required: [wakeup_id, status, wake_at]
                properties:
                  wakeup_id: { type: string }
                  status: { type: string, enum: [queued] }
                  wake_at: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /agent-profiles/{agent_profile_id}/task-sessions:
    parameters: [{ $ref: "#/components/parameters/AgentProfileId" }]
    get:
      tags: [agent-profiles]
      operationId: listTaskSessions
      summary: Agent 名下跨 Run 会话锚点（墓碑行不返回；session_params 保留 __ref/__fingerprint 供诊断）
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TaskSession" }

  /agent-profiles/{agent_profile_id}/task-sessions/reset:
    parameters: [{ $ref: "#/components/parameters/AgentProfileId" }]
    post:
      tags: [agent-profiles]
      operationId: resetTaskSession
      summary: 重置会话锚点（写墓碑；下一轮 Run 开新会话且不会被播种兜底复活）
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_key, adapter_id]
              properties:
                task_key: { type: string, description: 通常是 work item ID }
                adapter_id: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [reset] }
        "404": { $ref: "#/components/responses/Conflict" }

  /work-items/{work_item_id}/commands/accept:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    post:
      tags: [work-items]
      operationId: acceptWorkItem
      description: |
        验收根 Task（acceptance 决议；漂移检测后接受当前状态）。存在
        Coordinator 控制线时只有根 WorkItem 可验收并完成该控制线；协调子任务
        直接返回 422，不能单独完成根任务。无 Coordinator 的历史 Task 保留原有验收语义。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version]
              properties:
                expected_version: { type: integer }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkItem" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /models/provider-credentials:
    get:
      tags: [models]
      operationId: getProviderCredential
      summary: 读取 provider API Key 配置状态（写后不可读；需 runtime.manage 权限；模型注册表未启用时 404）
      parameters:
        - name: provider_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                description: |
                  凭据状态投影。写后不可读：任何分支都绝不返回 api_key 明文。
                  未配置：{"configured": false}；
                  已配置：{"configured": true, "masked_hint": "<末4位提示>", "length": <明文总长度>}。
                required: [configured]
                properties:
                  configured: { type: boolean }
                  masked_hint: { type: string, description: 仅已配置时携带；掩码提示（明文末 4 位） }
                  length: { type: integer, description: 仅已配置时携带；明文总长度 }
        "404": { $ref: "#/components/responses/Conflict" }
    put:
      tags: [models]
      operationId: putProviderCredential
      summary: 保存 provider API Key 到本地凭据存储
      parameters: [{ $ref: "#/components/parameters/IdempotencyKeyOptional" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider_id, api_key]
              properties:
                provider_id: { type: string }
                api_key: { type: string }
      responses:
        "204": { description: 已保存 }
        "404": { $ref: "#/components/responses/Conflict" }

  /runtimes/dsh/catalog:
    get:
      tags: [runtime-bindings]
      operationId: getDshCatalog
      summary: DSH harness 预设目录（agent_presets / permission_presets；本地仓库扫描）
      security: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [agent_presets, permission_presets]
                properties:
                  agent_presets:
                    type: array
                    items: { type: object, additionalProperties: true }
                  permission_presets:
                    type: array
                    items: { type: object, additionalProperties: true }

  # ── 任务控制面补全（task-control-surface RFC §9）──────────────────────
  # 执行上下文（ExecutionHost / WorkspaceLocation / DevelopmentContext /
  # ExecutionContextSnapshot）、任务反馈（TaskComment）与验收读模型
  #（Review Queue / Delivery Brief）。实现接线前 guard 测试保持红灯。

  /execution-hosts:
    get:
      tags: [execution-hosts]
      operationId: listExecutionHosts
      summary: 执行宿主列表（稳定 Host identity；含本机 host_local）
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ExecutionHostList" } } } }
    post:
      tags: [execution-hosts]
      operationId: createExecutionHost
      description: |
        Workspace admin 创建稳定远程 Host identity，一次性返回 enrollment credential；
        服务端只保存 credential ref/hash，绝不回显明文。`host_local` 由 Control Plane
        启动时确保存在，不可通过 API 创建。Runner bearer credential 的 subject 固定
        绑定该 host_id。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind]
              additionalProperties: false
              properties:
                name: { type: string }
                kind: { type: string, enum: [remote], description: 只允许 remote；local 由系统内置 }
      responses:
        "201": { content: { application/json: { schema: { $ref: "#/components/schemas/ExecutionHostEnrollment" } } } }

  /execution-hosts/{host_id}/commands/rotate-credential:
    parameters: [{ $ref: "#/components/parameters/ExecutionHostId" }]
    post:
      tags: [execution-hosts]
      operationId: rotateExecutionHostCredential
      description: 轮换 Runner enrollment credential；旧凭据与旧 connection epoch 立即失效。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ExecutionHostEnrollment" } } } }
        "404": { $ref: "#/components/responses/Conflict" }

  /execution-hosts/{host_id}/mounts:
    parameters: [{ $ref: "#/components/parameters/ExecutionHostId" }]
    get:
      tags: [execution-hosts]
      operationId: listExecutionHostMounts
      summary: Host 本地受信 registry 的广告投影
      description: 只含 alias/repository_identity/generation/checkouts；Host 本地绝对路径不是业务字段，永不返回。
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/HostMountList" } } } }
        "404": { $ref: "#/components/responses/Conflict" }

  /workspaces/{workspace_id}/locations:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [workspace-locations]
      operationId: listWorkspaceLocations
      summary: Workspace 的受信代码位置（含默认位置）
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceLocationList" } } } }
    post:
      tags: [workspace-locations]
      operationId: createWorkspaceLocation
      description: |
        把 Workspace 绑定到 Host 已广告且 repository identity 匹配的 mount。
        只接受 execution_host_id / mount_alias / repository_identity / is_default；
        不接受 path / cwd / root_path（schema additionalProperties: false，携带越权
        字段返回 403 workspace_path_forbidden）。mount 未广告 → 422
        workspace_mount_not_advertised；广告 generation 与预期不符 → 409
        workspace_mount_generation_changed；多默认冲突 → 409
        workspace_location_ambiguous。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceLocationCreate" }
      responses:
        "201": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceLocation" } } } }
        "403": { description: 请求含越权 path/cwd 字段, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /workspace-locations/{location_id}:
    parameters: [{ $ref: "#/components/parameters/WorkspaceLocationId" }]
    patch:
      tags: [workspace-locations]
      operationId: updateWorkspaceLocation
      description: |
        显式命令修改 identity/default；status 随 Host/Mount 健康投影自动变化，
        不经此命令。必须携带 expected_version 与预期 mount_generation；广告
        generation 已变化返回 409 workspace_mount_generation_changed。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceLocationPatch" }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceLocation" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /workspace-locations/{location_id}/commands/probe:
    parameters: [{ $ref: "#/components/parameters/WorkspaceLocationId" }]
    post:
      tags: [workspace-locations]
      operationId: probeWorkspaceLocation
      description: 触发 Host/Mount 可用性探测并刷新 status 投影；不创建 Run。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "202": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceLocationProbeResult" } } } }
        "404": { $ref: "#/components/responses/Conflict" }

  /work-items/{work_item_id}/development-context:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    get:
      tags: [work-items]
      operationId: getDevelopmentContext
      summary: WorkItem 的有效开发选择（逻辑 context，不是已解析 cwd）
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/DevelopmentContext" } } } }
        "404": { $ref: "#/components/responses/Conflict" }

  /work-items/{work_item_id}/commands/set-development-context:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    post:
      tags: [work-items]
      operationId: setDevelopmentContext
      description: |
        修改开发上下文并开启新 context generation；已有 Run/snapshot 不回写。
        根 Task 必须显式拥有 context；子 Task 第一版不能改变
        workspace_location_id，只能在根 Location 内覆盖 branch/worktree。
        存在非终态 Run → 409 development_context_busy；waiting_user 修改会触发
        Task BeginExecution + Coordinator queued；completed/cancelled 不可修改。
        不接受 path/cwd/absolute_path（403 workspace_path_forbidden）。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetDevelopmentContextCommand" }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/DevelopmentContext" } } } }
        "403": { description: 请求含越权 path/cwd 字段, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /runs/{run_id}/execution-context:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    get:
      tags: [runs]
      operationId: getRunExecutionContext
      summary: Run 创建时冻结的不可变 ExecutionContextSnapshot（只读）
      description: 返回逻辑 Snapshot 与 Host/Mount 状态；绝对 cwd 仅在本机 admin 视图按策略展示，不进入普通 DTO。
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ExecutionContextSnapshot" } } } }
        "404": { $ref: "#/components/responses/Conflict" }

  /work-items/{work_item_id}/comments:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    get:
      tags: [work-items]
      operationId: listWorkItemComments
      summary: 根 Task 维度的 append-only 评论流（revision 正序分页）
      parameters:
        - name: after_revision
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: 返回 revision 大于该值的评论；非法值返回 400 comment_cursor_invalid
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/TaskCommentList" } } } }
        "400": { description: after_revision 非法, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
    post:
      tags: [work-items]
      operationId: createTaskComment
      description: |
        追加任务反馈评论；kind 只接受 note|requirement（review_feedback 只能由
        return 命令生成）。note 不触发 Coordinator；requirement 是 actionable，
        waiting_user 到达时原子回 execution/queued。HTTP Idempotency-Key 防同一
        请求重复执行并重放原 comment/revision；client_key 防业务意图重复，同 key
        不同 body 返回 409 idempotency_conflict。历史非 Coordinator Task 返回
        409 comment_coordinator_required。本 API 取代并删除旧
        POST /work-items/{id}/coordinator/messages。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskCommentCreate" }
      responses:
        "201": { content: { application/json: { schema: { $ref: "#/components/schemas/TaskComment" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { description: body 超过 16 KiB（comment_body_too_large）, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /workspaces/{workspace_id}/review-queue:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [workspace]
      operationId: listReviewQueue
      summary: 服务端权威 Review Queue 投影
      description: |
        唯一派生条件：record_kind=task、status=in_progress、phase IN (review,
        acceptance)；排序固定 pending_since ASC, priority DESC, id ASC。
        total_count 是 badge 权威值，不得以当前页长度计算。
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, maximum: 200 }
        - name: priority
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Priority" }
        - name: phase
          in: query
          required: false
          schema: { type: string, enum: [review, acceptance] }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ReviewQueue" } } } }

  /work-items/{work_item_id}/delivery-brief:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    get:
      tags: [work-items]
      operationId: getDeliveryBrief
      summary: 确定性验收交付简报（服务端聚合，无 LLM 摘要）
      description: |
        整个 Brief 在同一数据库 read transaction 内聚合；freshness.as_of_event_seq
        取同一 snapshot 内 Workspace MAX(stream_seq)。来源读取失败返回可用部分并列出
        missing_sources（state=partial）；Task/Chat 边界或权限失败整体 fail closed。
        attempts/runs/evidence/files/artifacts/comments/risks 有服务端上限，
        超限返回 truncation=true 与完整总数，不静默截断。
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/DeliveryBrief" } } } }
        "404": { $ref: "#/components/responses/Conflict" }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session

  parameters:
    WorkspaceId: { name: workspace_id, in: path, required: true, schema: { type: string } }
    AgentProfileId: { name: agent_profile_id, in: path, required: true, schema: { type: string } }
    WorkItemId: { name: work_item_id, in: path, required: true, schema: { type: string } }
    RunId: { name: run_id, in: path, required: true, schema: { type: string } }
    PlanId: { name: plan_id, in: path, required: true, schema: { type: string } }
    ApprovalId: { name: approval_id, in: path, required: true, schema: { type: string } }
    RuntimeBindingId: { name: runtime_binding_id, in: path, required: true, schema: { type: string } }
    ModelId: { name: model_id, in: path, required: true, schema: { type: string } }
    ExecutionHostId: { name: host_id, in: path, required: true, schema: { type: string } }
    WorkspaceLocationId: { name: location_id, in: path, required: true, schema: { type: string } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
      description: |
        写命令幂等键。同 key 同请求体：已完成则重放原响应（Idempotent-Replayed: true），
        执行中返回 409 idempotency_in_progress（retryable，稍后重试）；
        同 key 不同请求体返回 409 idempotency_conflict；5xx 后占位释放，可同 key 重试。
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string }
      description: 可选（该操作天然幂等，不依赖此头）。
    IfMatch: { name: If-Match, in: header, required: false, schema: { type: string } }
    Cursor: { name: cursor, in: query, required: false, schema: { type: string } }

  responses:
    Conflict:
      description: 幂等冲突或乐观锁版本冲突
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Unprocessable:
      description: 领域校验失败（状态机非法迁移等）
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    CursorExpired:
      description: SSE cursor 已过保留窗口；客户端需重新 bootstrap
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        instance: { type: string }
        request_id: { type: string }
        retryable: { type: boolean }
        current_version: { type: integer }

    CurrentUser:
      type: object
      properties:
        user_id: { type: string }
        name: { type: string }
        role: { type: string, enum: [owner, admin, operator, approver, viewer] }
        workspace_ids: { type: array, items: { type: string } }
        feature_flags: { type: object, additionalProperties: { type: boolean } }

    WorkspaceList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Workspace" } }

    Workspace:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        timezone: { type: string }
        version: { type: integer }

    WorkspacePatch:
      type: object
      properties:
        name: { type: string }
        timezone: { type: string }
        expected_version: { type: integer }

    Bootstrap:
      type: object
      properties:
        workspace: { $ref: "#/components/schemas/Workspace" }
        dashboard: { $ref: "#/components/schemas/Dashboard" }
        agents: { $ref: "#/components/schemas/AgentProfileList" }
        work_items: { $ref: "#/components/schemas/WorkItemList" }
        health: { $ref: "#/components/schemas/SystemHealth" }
        event_cursor: { type: integer }

    Dashboard:
      type: object
      properties:
        active_agents: { type: integer }
        running_tasks: { type: integer }
        completed_today: { type: integer }
        board_counts:
          type: object
          properties:
            todo: { type: integer }
            in_progress: { type: integer }
            blocked: { type: integer }
            completed: { type: integer }
        recent_activities: { $ref: "#/components/schemas/ActivityList" }

    SystemHealth:
      type: object
      properties:
        control_plane: { type: string, enum: [healthy, degraded, down] }
        runners: { type: array, items: { type: object, properties: { runner_id: { type: string }, status: { type: string } } } }

    AgentProfileList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AgentProfile" } }

    AgentProfileCreate:
      type: object
      required: [name, role]
      properties:
        name: { type: string }
        role: { type: string, enum: [pm, architect, ui, developer, reviewer, custom] }
        skills: { type: array, items: { type: string } }
        runtime_preference: { $ref: "#/components/schemas/RuntimePreference" }
        avatar: { type: string }

    AgentProfilePatch:
      type: object
      properties:
        name: { type: string }
        role: { type: string }
        skills: { type: array, items: { type: string } }
        instructions: { type: string }
        runtime_preference: { $ref: "#/components/schemas/RuntimePreference" }
        model_override: { $ref: "#/components/schemas/ModelRef" }
        policy: { $ref: "#/components/schemas/AgentPolicy" }
        expected_version: { type: integer }

    DisableOptions:
      type: object
      properties:
        active_run_policy: { type: string, enum: [interrupt, continue, cancel], default: interrupt }

    AgentProfile:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [user, task_coordinator] }
        is_system: { type: boolean }
        name: { type: string }
        role: { type: string }
        skills: { type: array, items: { type: string } }
        instructions: { type: string }
        availability: { type: string, enum: [enabled, disabled] }
        presence: { type: string, enum: [idle, busy, degraded, offline] }
        current_run_summary:
          type: object
          nullable: true
          properties:
            run_id: { type: string }
            work_item_id: { type: string }
            title: { type: string }
            progress: { type: number }
        runtime_preference: { $ref: "#/components/schemas/RuntimePreference" }
        model_override: { $ref: "#/components/schemas/ModelRef" }
        policy: { $ref: "#/components/schemas/AgentPolicy" }
        instructions_editable: { type: boolean }
        version: { type: integer }

    CoordinatorConfig:
      type: object
      required: [workspace_id, kind, runtime_label, model_ref, reasoning_effort, prompt_version, prompt_locked, instructions_editable, version]
      properties:
        workspace_id: { type: string }
        kind: { type: string, enum: [task_coordinator] }
        runtime_label: { type: string, enum: [codex_local, kimi_local, mock] }
        model_ref: { type: string }
        reasoning_effort: { type: string, enum: [minimal, low, medium, high, xhigh] }
        fallback_runtime_label: { type: string, enum: [codex_local, kimi_local, mock] }
        fallback_model_ref: { type: string }
        prompt_version: { type: string, enum: [task-coordinator.v1] }
        prompt_locked: { type: boolean, enum: [true] }
        instructions_editable: { type: boolean, enum: [false] }
        version: { type: integer }

    CoordinatorConfigPatch:
      type: object
      required: [expected_version]
      properties:
        runtime_label: { type: string, enum: [codex_local, kimi_local] }
        model_ref: { type: string }
        reasoning_effort: { type: string, enum: [minimal, low, medium, high, xhigh] }
        fallback_runtime_label: { type: string, enum: [codex_local, kimi_local] }
        fallback_model_ref: { type: string }
        expected_version: { type: integer }
        instructions: { type: string, description: 始终拒绝；提示词由系统内置 }
        prompt: { type: string, description: 始终拒绝；提示词由系统内置 }

    CoordinatorFailure:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        retryable: { type: boolean }

    CoordinatorAgentRef:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string }
        runtime: { type: string }

    CoordinatorAttempt:
      type: object
      properties:
        id: { type: string }
        run_id: { type: string }
        agent: { $ref: "#/components/schemas/CoordinatorAgentRef" }
        status: { type: string }
        attempt: { type: integer }
        max_attempts: { type: integer }
        retry_of: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        failure: { $ref: "#/components/schemas/CoordinatorFailure" }
        next_action: { type: string }
        next_action_at: { type: string, format: date-time }

    CoordinatorTimelineEntry:
      type: object
      properties:
        id: { type: string }
        stage: { type: string, enum: [plan, dispatch, attempt, failure, retry, reassign, settlement, result, acceptance] }
        kind: { type: string }
        title: { type: string }
        message: { type: string }
        status: { type: string }
        occurred_at: { type: string, format: date-time }
        agent: { $ref: "#/components/schemas/CoordinatorAgentRef" }
        attempt: { type: integer }
        run_id: { type: string }
        retry_of: { type: string }
        failure: { $ref: "#/components/schemas/CoordinatorFailure" }
        next_action_at: { type: string, format: date-time }

    CoordinatorSnapshot:
      type: object
      required: [root_work_item_id, work_item_id, status, attempts, timeline, updated_at, version]
      properties:
        root_work_item_id: { type: string }
        work_item_id: { type: string }
        status: { type: string }
        stage: { type: string }
        progress: { type: number, nullable: true }
        completed_steps: { type: integer }
        total_steps: { type: integer }
        current_agent: { $ref: "#/components/schemas/CoordinatorAgentRef" }
        next_action: { type: string }
        next_action_at: { type: string, format: date-time }
        blocker: { $ref: "#/components/schemas/Blocker" }
        runtime_label: { type: string }
        model_ref: { type: string }
        reasoning_effort: { type: string }
        prompt_version: { type: string }
        prompt_locked: { type: boolean, enum: [true] }
        attempts: { type: array, items: { $ref: "#/components/schemas/CoordinatorAttempt" } }
        timeline: { type: array, items: { $ref: "#/components/schemas/CoordinatorTimelineEntry" } }
        updated_at: { type: string, format: date-time }
        version: { type: integer }

    CoordinatorTimelineList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/CoordinatorTimelineEntry" } }

    RuntimePreference:
      type: object
      properties:
        preferred: { type: string }
        fallbacks: { type: array, items: { type: string } }
        mode: { type: string, enum: [default, plan] }
        agent_preset: { type: string }

    ModelRef:
      type: object
      properties:
        ref: { type: string }
        provider: { type: string }
        model: { type: string }

    AgentPolicy:
      type: object
      properties:
        tools: { type: array, items: { type: string } }
        approval_policy: { type: string, enum: [auto, approve_high_risk, manual] }
        sandbox: { type: string, enum: [read-only, workspace-write, danger-full-access] }
        permission_preset: { type: string }

    WorkItemList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/WorkItem" } }
        next_cursor: { type: string, nullable: true }

    WorkItemTree:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/WorkItem" } }

    PlanStatus:
      type: string
      enum: [active, waiting, finished, cancelled, failed]
      description: finished/cancelled/failed 为终态；waiting 由同主任务新 plan 提交 supersede 收口（M4 审批放行可 waiting→active 续跑，为唯一回拨边）。

    PlanVerb:
      type: string
      enum: [dispatch, defer, join, finish, consult_knowledge]
      description: M4 词汇表；未知 verb 提交即 400。consult_knowledge 检索结果写 step payload.results，供 dispatch.knowledge_from 引用；join 为带显式等待集的 defer 变体。

    PlanSubmit:
      type: object
      required: [work_item_id, agent_profile_id, steps]
      properties:
        work_item_id: { type: string }
        agent_profile_id: { type: string, description: plan owner（提交者 / lead agent） }
        source_run_id: { type: string, nullable: true }
        guardrails:
          $ref: "#/components/schemas/PlanGuardrails"
        steps:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PlanStepSubmit" }

    PlanGuardrails:
      type: object
      description: M4 预算护栏（提交时固化进 plan）。max_dispatch 提交期整单校验（超限 400 不部分执行）；max_tokens 在子任务静默唤醒点核算（主任务树全部 run 的 input+output token 合计，超限 plan failed + 主任务 blocker）。
      properties:
        max_dispatch: { type: integer, description: dispatch 步数上限 }
        max_tokens: { type: integer, format: int64, description: 主任务树 token 总预算 }

    PlanStepSubmit:
      type: object
      required: [verb]
      properties:
        verb: { $ref: "#/components/schemas/PlanVerb" }
        agent_id: { type: string, description: dispatch 必填（目标执行 agent） }
        title: { type: string, description: dispatch 必填 }
        instruction: { type: string, description: dispatch 必填 }
        acceptance: { type: array, items: { type: string } }
        priority: { $ref: "#/components/schemas/Priority" }
        reason: { type: string, description: defer 挂起原因 }
        wake_at: { type: string, format: date-time, description: defer/join 可选出口；与等待集内活跃子任务至少居其一 }
        children:
          description: join 必填（defer 无此字段）。显式等待集："all" 或既有子任务 id 数组；非 "all" 目标必须是本 plan 主任务的子任务，否则 400。
          oneOf:
            - type: string
              enum: [all]
            - type: array
              items: { type: string }
              minItems: 1
        summary: { type: string, description: finish 收尾说明 }
        evaluation: { type: boolean, description: finish 后追加验收评估 run（instruction 含验收标准与子任务摘要，agent 为 plan owner） }
        corpus: { type: string, description: consult_knowledge 必填；单层目录名（拒绝路径分隔符与 `.`/`..`） }
        terms: { type: array, items: { type: string }, description: consult_knowledge 检索词 }
        limit: { type: integer, description: consult_knowledge 返回条数上限 }
        knowledge_from: { type: integer, description: dispatch 可选；引用更早的 consult_knowledge 步骤（0 基序号），检索条目注入 instruction 附录 }

    Plan:
      type: object
      properties:
        id: { type: string }
        workspace_id: { type: string }
        work_item_id: { type: string }
        agent_profile_id: { type: string }
        source_run_id: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/PlanStatus" }
        superseded_by: { type: string, nullable: true }
        guardrails: { $ref: "#/components/schemas/PlanGuardrails" }
        error: { type: string, nullable: true, description: plan 级失败码（budget_exceeded）；步骤级失败原因在 PlanStep.error }
        steps: { type: array, items: { $ref: "#/components/schemas/PlanStep" } }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PlanStep:
      type: object
      properties:
        seq: { type: integer }
        verb: { $ref: "#/components/schemas/PlanVerb" }
        status: { type: string, enum: [pending, executed, skipped, failed] }
        payload: { type: object, additionalProperties: true }
        result_work_item_id: { type: string, nullable: true }
        result_run_id: { type: string, nullable: true }
        error: { type: string, nullable: true }

    WorkItemCreate:
      type: object
      required: [title]
      properties:
        title: { type: string }
        record_kind: { type: string, enum: [chat, task], default: task, description: 新记录类型；公开创建省略时按 task 处理，Chat 必须显式传 chat }
        description: { type: string }
        status: { $ref: "#/components/schemas/WorkItemStatus", default: todo, description: 根 Task 只能省略或为 todo；其他初始状态返回 422。Chat 保留独立记录的旧语义 }
        priority: { $ref: "#/components/schemas/Priority", default: medium }
        due_date: { type: string, format: date }
        agent_profile_id: { type: string, nullable: true, description: Chat 可选；公开 Task（含省略 record_kind）禁止传入，返回 422，由系统 Coordinator 选择 Worker }
        parent_id: { type: string, nullable: true, description: 同类型父记录 id }
        client_key: { type: string, description: 实体级幂等键 }
        acceptance_criteria: { type: array, items: { type: string }, description: 根 Task 的验收标准，持久化在 Coordinator state 中 }

    WorkItemPatch:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        priority: { $ref: "#/components/schemas/Priority" }
        due_date: { type: string, format: date }
        expected_version: { type: integer }

    WorkItemStatus:
      type: string
      enum: [todo, in_progress, blocked, completed, cancelled]

    Priority:
      type: string
      enum: [low, medium, high, urgent]

    WorkItem:
      type: object
      properties:
        id: { type: string }
        workspace_id: { type: string }
        record_kind: { type: string, enum: [chat, task], description: 不可变记录类型 }
        parent_id: { type: string, nullable: true, description: 父任务 id；根任务缺省 }
        title: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/WorkItemStatus" }
        phase: { type: string, enum: [execution, review, acceptance], nullable: true }
        priority: { $ref: "#/components/schemas/Priority" }
        due_date: { type: string, format: date, nullable: true }
        agent_profile_id: { type: string, nullable: true }
        assignee_summary:
          type: object
          nullable: true
          properties:
            name: { type: string }
            avatar: { type: string }
        blocker:
          type: object
          nullable: true
          properties:
            code: { type: string }
            message: { type: string }
            source: { type: string }
            created_at: { type: string, format: date-time }
        runs_count: { type: integer }
        latest_run_id: { type: string, nullable: true }
        rolling_digest: { type: string, description: 任务台账滚动摘要（S2 确定性生成，无 LLM；仅详情响应携带，列表省略） }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DecisionCreate:
      type: object
      required: [quote]
      properties:
        quote: { type: string, description: 用户原话（必填，trim 后非空；禁止 LLM 转述进 quote） }
        source_run_id: { type: string, description: 可选钉出来源轮次；必须属于该 work item }
        source_ref: { type: string, description: 可选链回片段内位置（消息序号等） }

    DecisionEntry:
      type: object
      description: 决策台账行（S2）：任务级共享记忆的用户原话引文。
      properties:
        id: { type: string, description: "dec_ 前缀" }
        work_item_id: { type: string }
        quote: { type: string }
        source_run_id: { type: string, description: 缺省时未钉来源 }
        source_ref: { type: string }
        created_at: { type: string, format: date-time }

    DecisionList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DecisionEntry" } }

    SearchList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SearchItem" } }

    SearchItem:
      type: object
      description: 检索命中项（S4）；索引为派生存储，定点重写幂等，不发 SSE 事件。
      properties:
        kind: { type: string, enum: [segment_summary, decision, artifact] }
        work_item_id: { type: string }
        source_id: { type: string, description: 决策 id / work item id（segment_summary）/ artifact id }
        title: { type: string, description: 任务标题 / quote 前 80 字 / logical_path }
        snippet: { type: string, description: "正文命中摘录，[] 包裹命中词、… 省略号" }

    RunCreate:
      type: object
      required: [agent_profile_id, input]
      properties:
        agent_profile_id: { type: string }
        output_contract: { type: string, enum: [languagegui/v1] }
        runtime_preference: { $ref: "#/components/schemas/RuntimePreference" }
        requirements:
          type: object
          additionalProperties: { type: string, enum: [required, preferred, optional] }
        input:
          type: object
          required: [instruction]
          properties:
            instruction: { type: string }
            acceptance_criteria: { type: array, items: { type: string } }

    RunAccepted:
      type: object
      properties:
        run_id: { type: string }
        work_item_id: { type: string }
        status: { type: string }
        version: { type: integer }
        capability_snapshot_id: { type: string, nullable: true }

    ExecutionRun:
      type: object
      properties:
        id: { type: string }
        work_item_id: { type: string }
        agent_profile_id: { type: string }
        status: { $ref: "#/components/schemas/RunStatus" }
        provider: { type: string, nullable: true }
        runtime_label: { type: string, nullable: true }
        progress: { type: number, nullable: true }
        retry_of: { type: string, nullable: true }
        failure:
          type: object
          nullable: true
          properties:
            code: { type: string }
            message: { type: string }
            retryable: { type: boolean }
        usage_in: { type: integer, format: int64, description: 本轮输入 token（adapter 上报；零值省略） }
        usage_out: { type: integer, format: int64, description: 本轮输出 token（adapter 上报；零值省略） }
        usage_cached: { type: integer, format: int64, description: 本轮缓存命中 token（adapter 上报；零值省略） }
        usage_basis: { type: string, enum: [per_run, session_cumulative], description: 用量口径；per_run 为本轮增量，session_cumulative 为会话累计（消费方做差量） }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RunStatus:
      type: string
      enum: [queued, starting, running, waiting_approval, interrupting, cancelling, reconnecting, succeeding, succeeded, interrupted, cancelled, lost, failed]

    ApprovalList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Approval" } }

    Approval:
      type: object
      description: 以实现为准（httpapi approvalDTO）；不输出 requested_by/expires_at。run_id 为空（null）表示 M4 plan_dispatch 审批（不挂 run，经 approval.requested 事件的 data.plan_id 定位）。
      properties:
        id: { type: string }
        run_id: { type: string, nullable: true }
        work_item_id: { type: string }
        kind: { type: string, description: plan_dispatch 表示 M4 审批护栏的 dispatch 人工闸门 }
        risk: { type: string, enum: [low, medium, high] }
        status: { type: string, enum: [pending, approved, rejected, expired] }
        summary: { type: string }
        resolved_at: { type: string, format: date-time, nullable: true }
        resolved_by: { type: string, nullable: true }

    ArtifactList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Artifact" } }

    Artifact:
      type: object
      properties:
        id: { type: string }
        run_id: { type: string }
        logical_path: { type: string }
        mime: { type: string }
        size: { type: integer }
        sha256: { type: string }
        status: { type: string, enum: [draft, accepted] }
        created_at: { type: string, format: date-time }

    ActivityList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Activity" } }
        next_cursor: { type: string, nullable: true }

    Activity:
      type: object
      properties:
        id: { type: string }
        work_item_id: { type: string, nullable: true, description: 归因任务（M4；verdict/blocker 级 activity 非空；activity.appended 事件 data 同键） }
        kind: { type: string }
        message: { type: string }
        occurred_at: { type: string, format: date-time }

    RuntimeBindingList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/RuntimeBinding" } }

    RuntimeBinding:
      type: object
      properties:
        id: { type: string }
        runtime_label: { type: string }
        adapter_id: { type: string }
        adapter_version: { type: string }
        provider_version: { type: string, nullable: true }
        provider: { type: string, description: "模型提供方，如 deepseek / openai" }
        model: { type: string, description: "模型配置，如 deepseek-chat" }
        credential_ref: { type: string, description: "CredentialRef；绝不返回凭据明文" }
        capabilities: { type: object, additionalProperties: { type: string } }
        status: { type: string, enum: [ready, probing, degraded, unavailable] }
        version: { type: integer }

    ProbeResult:
      type: object
      properties:
        runtime_binding_id: { type: string }
        ok: { type: boolean }
        provider_version: { type: string, nullable: true }
        capabilities: { type: object, additionalProperties: { type: string } }
        error: { type: string, nullable: true }

    ExecutionRunList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ExecutionRun" } }

    DispatchCardList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DispatchCard" } }

    DispatchCard:
      type: object
      description: 派发卡片（会话元模型 S1）：一次发送形成的执行批次 + 成员会话组摘要。
      properties:
        id: { type: string, description: "disp_ 前缀" }
        work_item_id: { type: string }
        trigger: { type: string, enum: [user_message, lead_plan, wakeup] }
        lead_run_id: { type: string, description: 接诊 run / plan source run；@直达批次省略 }
        status: { type: string, enum: [running, collecting, completed, degraded, cancelled] }
        trigger_message:
          type: object
          description: 触发消息摘录（接诊/lead_plan 取 lead run 指令；@直达取最早成员 run）
          properties:
            run_id: { type: string }
            excerpt: { type: string }
        runs:
          type: array
          description: 成员 runs（会话组；created_at 升序）
          items:
            type: object
            properties:
              id: { type: string }
              work_item_id: { type: string }
              agent_profile_id: { type: string }
              agent_name: { type: string }
              status: { type: string }
              summary: { type: string, description: 一行摘要（S1 为 run 指令摘录，确定性生成） }
        created_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true }

    RunChanges:
      type: object
      required: [file_count, additions, deletions, files, state, can_revert, version]
      properties:
        file_count: { type: integer }
        additions: { type: integer }
        deletions: { type: integer }
        files: { type: array, items: { $ref: "#/components/schemas/RunChangeFile" } }
        state: { type: string, enum: [ready, unavailable, reverted] }
        can_revert: { type: boolean }
        reason: { type: string }
        version: { type: integer }
    RunChangeFile:
      type: object
      required: [path, kind, additions, deletions, write_count, last_turn_index]
      properties:
        path: { type: string }
        kind: { type: string, enum: [added, modified, deleted, renamed] }
        additions: { type: integer }
        deletions: { type: integer }
        write_count: { type: integer }
        last_turn_index: { type: integer }
        binary: { type: boolean }

    RunEventList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/RunEvent" } }

    RunEvent:
      type: object
      description: 与实现一致（ListRunEvents 投影；前端 TS 同形）。
      properties:
        run_seq: { type: integer }
        event_type: { type: string, description: "run.created/message.delta/message.completed/tool.*/approval.*/run.status_changed 等" }
        payload: { type: object, additionalProperties: true, nullable: true }
        occurred_at: { type: string, format: date-time }

    AgentConfigReloadResult:
      type: object
      properties:
        created: { type: integer }
        updated: { type: integer }
        skipped: { type: integer }

    ModelEntryList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ModelEntry" } }

    ModelEntry:
      type: object
      description: 模型注册表条目（models/<id>.yaml）；词汇对齐 pi-ai provider profile。
      properties:
        id: { type: string, description: 小写 slug，文件名 }
        display_name: { type: string }
        category: { type: string, description: "UI 展示分类，如 OpenCode Go / Kimi；不参与 runtime 路由" }
        provider: { type: string, description: "provider 路由名，如 deepseek-official / anthropic / 自定义网关" }
        api: { type: string, enum: ["", openai-completions, openai-responses, anthropic-messages], description: 线协议；空 = runtime 默认 }
        model: { type: string }
        api_key_env: { type: string, description: 凭据环境变量名（引用，绝不明文） }
        base_url: { type: string, description: OpenAI 兼容端点 }
        context_window: { type: integer }
        max_tokens: { type: integer }
        notes: { type: string }

    ModelUpsert:
      type: object
      required: [display_name, provider, model]
      properties:
        id: { type: string, description: "POST 可空（由 display_name 生成）；PUT 忽略（path 为权威）" }
        display_name: { type: string }
        category: { type: string, description: "UI 展示分类，如 OpenCode Go / Kimi；不参与 runtime 路由" }
        provider: { type: string }
        api: { type: string, enum: ["", openai-completions, openai-responses, anthropic-messages] }
        model: { type: string }
        api_key_env: { type: string }
        base_url: { type: string }
        context_window: { type: integer }
        max_tokens: { type: integer }
        notes: { type: string }

    TaskSession:
      type: object
      description: 跨 Run 会话锚点（Paperclip agent_task_sessions 对应物）；唯一键 (workspace, agent, adapter, task_key)。
      required: [id, agent_profile_id, adapter_id, task_key, runs_count, input_tokens_cum, created_at, updated_at]
      properties:
        id: { type: string }
        agent_profile_id: { type: string }
        adapter_id: { type: string }
        task_key: { type: string, description: 通常是 work item ID }
        session_ref: { type: string, description: "provider 会话句柄（如 codex://thread_x、dsh://session-y）" }
        session_params:
          type: object
          additionalProperties: true
          description: adapter 私有参数 + 保留键 __ref/__fingerprint/__from_run_id/__cleared_reason
        display_id: { type: string, description: provider 侧人类可读会话 id }
        runs_count: { type: integer, description: 本代会话已被多少 Run 使用（轮换阈值输入；轮换后清零重起） }
        input_tokens_cum: { type: integer, format: int64, description: 本代累计输入 token（轮换阈值输入） }
        segment_seq: { type: integer, description: 参与线片段序号——同一 task_key 下第 N 段会话（轮换代际 +1，缺省 1） }
        created_at: { type: string, format: date-time, description: 本代会话代际起点（72h 轮换阈值基准） }
        updated_at: { type: string, format: date-time }

    HealthStatus:
      type: object
      required: [health]
      properties:
        health:
          type: object
          properties:
            control_plane: { type: string, enum: [healthy] }
            runners:
              type: array
              items:
                type: object
                additionalProperties: true

    # ── 任务控制面补全（task-control-surface RFC §4/§9）──────────────────

    ExecutionHost:
      type: object
      description: 稳定宿主身份；不等于一次 Runner 连接或进程。status 是连接/健康投影，不是 Run 状态。
      required: [id, name, kind, status, version]
      properties:
        id: { type: string, description: "host_ 前缀；host_local 为受保护本机 Host" }
        name: { type: string }
        kind: { type: string, enum: [local, remote] }
        status: { type: string, enum: [ready, degraded, offline] }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ExecutionHostList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ExecutionHost" } }

    ExecutionHostEnrollment:
      type: object
      description: Host 创建/凭据轮换响应；credential 明文只在本次响应出现，服务端只保存 ref/hash。
      required: [host, enrollment_credential]
      properties:
        host: { $ref: "#/components/schemas/ExecutionHost" }
        enrollment_credential: { type: string, description: Runner bearer credential；subject 固定绑定 host_id }

    HostMount:
      type: object
      description: Host 本地受信 registry 的广告投影；绝对路径只存在 Host 本地配置。
      required: [execution_host_id, alias, repository_identity, registry_generation, status]
      properties:
        execution_host_id: { type: string }
        alias: { type: string }
        repository_identity: { type: string, description: 跨 Host 稳定逻辑 ID }
        display_label: { type: string }
        default_branch: { type: string }
        supported_ref_kinds: { type: array, items: { type: string, enum: [root, branch, worktree] } }
        checkouts:
          type: array
          description: opaque checkout refs（Host 本地受信发现生成）
          items:
            type: object
            required: [ref, kind, branch, head]
            properties:
              ref: { type: string }
              kind: { type: string, enum: [root, branch, worktree] }
              branch: { type: string, nullable: true }
              head: { type: string }
        registry_generation: { type: string }
        status: { type: string, enum: [ready, unavailable] }
        last_seen_at: { type: string, format: date-time }

    HostMountList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/HostMount" } }

    WorkspaceLocation:
      type: object
      description: 把业务 Workspace 绑定到一个 HostMount；Workspace 不等于路径。
      required: [id, workspace_id, execution_host_id, mount_alias, mount_generation, repository_identity, status, version]
      properties:
        id: { type: string, description: "wsloc_ 前缀" }
        workspace_id: { type: string }
        execution_host_id: { type: string }
        mount_alias: { type: string }
        mount_generation: { type: string }
        repository_identity: { type: string }
        is_default: { type: boolean, description: 每 Workspace 至多一个默认 Location }
        status: { type: string, enum: [ready, degraded, unavailable], description: 随 Host/Mount 健康变化；identity/version 只由显式命令修改 }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WorkspaceLocationList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/WorkspaceLocation" } }

    WorkspaceLocationCreate:
      type: object
      required: [execution_host_id, mount_alias, repository_identity]
      additionalProperties: false
      description: |
        不接受 path / cwd / root_path / absolute_path（additionalProperties: false，
        携带返回 403 workspace_path_forbidden）。创建必须携带预期 mount_generation。
      properties:
        execution_host_id: { type: string }
        mount_alias: { type: string }
        repository_identity: { type: string }
        mount_generation: { type: string, description: 预期广告 generation；不符返回 409 workspace_mount_generation_changed }
        is_default: { type: boolean, default: false }

    WorkspaceLocationPatch:
      type: object
      required: [expected_version]
      additionalProperties: false
      properties:
        repository_identity: { type: string }
        mount_generation: { type: string, description: 预期广告 generation }
        is_default: { type: boolean }
        expected_version: { type: integer }

    WorkspaceLocationProbeResult:
      type: object
      required: [location_id, status, checked_at]
      properties:
        location_id: { type: string }
        status: { type: string, enum: [ready, degraded, unavailable] }
        detail: { type: string, nullable: true }
        checked_at: { type: string, format: date-time }

    DevelopmentContext:
      type: object
      description: WorkItem 的逻辑开发选择，不是已解析 cwd；无 path/cwd/absolute_path 字段。
      required: [work_item_id, ref_kind, version]
      properties:
        work_item_id: { type: string }
        context_owner_id: { type: string, description: 默认根 Task }
        workspace_location_id: { type: string }
        ref_kind: { type: string, enum: [root, branch, worktree] }
        branch_name: { type: string, nullable: true }
        checkout_ref: { type: string, nullable: true }
        worktree_ref: { type: string, nullable: true, description: Host-local opaque ref }
        base_revision: { type: string, nullable: true }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SetDevelopmentContextCommand:
      type: object
      required: [ref_kind, expected_version]
      additionalProperties: false
      description: |
        root：branch/worktree 为空；branch：branch_name 与 checkout_ref 非空且
        checkout 必须唯一命中（0/多命中返回 409 workspace_branch_not_unique）；
        worktree：worktree_ref 非空且必须来自目标 Host registry 对该 repository
        的发现结果。非法组合返回 422 development_context_invalid。
      properties:
        workspace_location_id: { type: string, description: 子 Task 第一版不允许改变（禁止跨 Host/Location） }
        ref_kind: { type: string, enum: [root, branch, worktree] }
        branch_name: { type: string }
        checkout_ref: { type: string }
        worktree_ref: { type: string }
        base_revision: { type: string }
        expected_version: { type: integer }

    ExecutionContextSnapshot:
      type: object
      description: Run 创建时冻结的不可变快照；INSERT 后禁止 UPDATE/DELETE，Run 与 Snapshot 一对一。
      required: [id, run_id, schema_version, workspace_id, workspace_location_id, location_version, mount_generation, execution_host_id, mount_alias, repository_identity, ref_kind, context_generation, source, snapshot_digest, created_at]
      properties:
        id: { type: string, description: "ctxsnap_ 前缀" }
        run_id: { type: string }
        schema_version: { type: string, const: execution-context/v1 }
        workspace_id: { type: string }
        workspace_location_id: { type: string }
        location_version: { type: integer }
        mount_generation: { type: string }
        execution_host_id: { type: string }
        mount_alias: { type: string }
        repository_identity: { type: string }
        ref_kind: { type: string, enum: [root, branch, worktree] }
        branch_name: { type: string, nullable: true }
        checkout_ref: { type: string, nullable: true }
        worktree_ref: { type: string, nullable: true }
        base_revision: { type: string, nullable: true }
        context_generation: { type: integer }
        source: { type: string, enum: [current, inherited, retry, evaluation, recovery] }
        source_snapshot_id: { type: string, nullable: true }
        snapshot_digest:
          type: string
          description: |
            固定算法 sha256("execution-context/v1\n" + RFC8785CanonicalJSON(identity_fields))；
            identity_fields 只含执行身份字段。覆盖 mount_generation，alias 被重指向时
            旧 Location/Snapshot 不能静默继续。
        host_mount_status:
          type: object
          description: Host/Mount 当前健康投影（只读；不含绝对 cwd）
          properties:
            execution_host_status: { type: string, enum: [ready, degraded, offline] }
            mount_status: { type: string, enum: [ready, unavailable] }
        created_at: { type: string, format: date-time }

    TaskComment:
      type: object
      description: append-only 任务反馈评论；无 update/delete，revision 在根 Task 维度分配。
      required: [id, workspace_id, root_work_item_id, work_item_id, revision, kind, body, actor_kind, actor_id, created_at]
      properties:
        id: { type: string, description: "cmt_ 前缀" }
        workspace_id: { type: string }
        root_work_item_id: { type: string }
        work_item_id: { type: string, description: 评论落点的子 Task；根 Task 评论时等于 root }
        revision: { type: integer, format: int64, description: 根 Task 维度单调，UNIQUE(root_work_item_id, revision) }
        kind: { type: string, enum: [note, requirement, review_feedback] }
        body: { type: string, description: 1..16384 字节（trim 后）；进入模型前是不可信数据 }
        actor_kind: { type: string, enum: [user, system, runtime] }
        actor_id: { type: string }
        source_run_id: { type: string, nullable: true }
        source_ref: { type: string, nullable: true }
        client_key: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    TaskCommentCreate:
      type: object
      required: [kind, body]
      additionalProperties: false
      description: 只接受 note|requirement；review_feedback 只能由 return 命令生成（422 comment_kind_invalid）。
      properties:
        kind: { type: string, enum: [note, requirement] }
        body: { type: string, minLength: 1, maxLength: 16384 }
        source_run_id: { type: string, description: 可选；必须属于该 Task 树（422 comment_source_run_mismatch） }
        source_ref: { type: string }
        client_key: { type: string, description: 唯一域 (root_work_item_id, client_key)；同 key 不同 body 返回 409 idempotency_conflict }
        expected_work_item_version: { type: integer, description: note 可省略；requirement 推荐必填，防止基于终态/旧 phase 追加 }

    TaskCommentList:
      type: object
      required: [items, latest_revision]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/TaskComment" } }
        next_revision: { type: integer, format: int64, nullable: true, description: 下一页 after_revision 游标，等于本页最大 revision；comment cursor 与 Workspace SSE stream_seq 严格分离 }
        latest_revision: { type: integer, format: int64 }

    ReviewQueue:
      type: object
      description: 服务端权威投影；total_count 是 badge 权威值。
      required: [items, total_count, generated_at]
      properties:
        items:
          type: array
          items:
            type: object
            required: [work_item, pending_since, source_watermark]
            properties:
              work_item: { $ref: "#/components/schemas/WorkItem" }
              pending_since: { type: string, format: date-time, description: = phase_entered_at；review→execution→review 必须得到新时间 }
              coordinator:
                type: object
                nullable: true
                properties:
                  status: { type: string }
                  stage: { type: string }
                  updated_at: { type: string, format: date-time }
                  version: { type: integer }
              latest_run_id: { type: string, nullable: true }
              source_watermark: { $ref: "#/components/schemas/SourceWatermark" }
        total_count: { type: integer, description: 当前查询条件下的全量匹配数（badge 权威值；不得以当前页长度或前端已加载数量计算） }
        next_cursor: { type: string, nullable: true }
        generated_at: { type: string, format: date-time }

    SourceWatermark:
      type: object
      description: 各来源读模型版本水位（同一 read snapshot 内读取）。
      required: [as_of_event_seq]
      properties:
        as_of_event_seq: { type: integer, format: int64, description: 同一 snapshot 内 Workspace MAX(stream_seq) }
        work_item_version: { type: integer }
        coordinator_version: { type: integer }
        latest_run_version: { type: integer }
        comment_revision: { type: integer, format: int64 }

    DeliveryBriefConclusion:
      type: object
      required: [coordinator_status, version]
      properties:
        coordinator_status: { type: string }
        stage: { type: string }
        summary: { type: string }
        next_action: { type: string }
        version: { type: integer }

    AttemptSummary:
      type: object
      required: [attempt, role, run_id, status]
      properties:
        attempt: { type: integer }
        role: { type: string, enum: [coordinator, worker, evaluation] }
        run_id: { type: string }
        agent_id: { type: string }
        agent_name: { type: string }
        status: { type: string }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        retry_of: { type: string, nullable: true }
        failure:
          type: object
          nullable: true
          properties:
            code: { type: string }
            message: { type: string }
            retryable: { type: boolean }

    EvidenceItem:
      type: object
      required: [id, source_kind, source_id, status, trust, occurred_at]
      properties:
        id: { type: string }
        source_kind: { type: string, enum: [coordinator_event, run_status, evaluation_verdict, tool_result, artifact, change_set] }
        source_id: { type: string }
        label: { type: string }
        status: { type: string, enum: [passed, failed, warning, unknown] }
        trust: { type: string, enum: [control_plane, runtime_reported, model_reported], description: 普通 Markdown 只算 model_reported；白名单结构化 run event 才是 tool_result }
        occurred_at: { type: string, format: date-time }

    RunEvidence:
      type: object
      required: [run, evidence, truncated]
      properties:
        run: { $ref: "#/components/schemas/ExecutionRun" }
        summary: { type: string }
        evidence:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/EvidenceItem" }
        truncated: { type: boolean }

    BriefChangeSet:
      type: object
      description: 按 Run 分组的既有 run file-change read model；不把多个 Run 混成一个 diff。
      required: [run_id, files, total_files, total_added, total_deleted, truncated]
      properties:
        run_id: { type: string }
        files:
          type: array
          maxItems: 200
          items:
            type: object
            required: [path, added, deleted, status]
            properties:
              path: { type: string }
              added: { type: integer }
              deleted: { type: integer }
              status: { type: string, enum: [added, modified, deleted, renamed] }
        total_files: { type: integer }
        total_added: { type: integer }
        total_deleted: { type: integer }
        truncated: { type: boolean }

    RiskItem:
      type: object
      required: [source_kind, source_id, code, message, severity]
      properties:
        source_kind: { type: string, description: blocker / run_failure / coordinator_error / review_finding }
        source_id: { type: string }
        code: { type: string }
        message: { type: string }
        severity: { type: string, enum: [low, medium, high] }

    DeliveryBriefFreshness:
      type: object
      required: [generated_at, as_of_event_seq, state]
      properties:
        generated_at: { type: string, format: date-time }
        as_of_event_seq: { type: integer, format: int64 }
        source_versions: { type: object, additionalProperties: { type: integer }, description: 各来源 read model 版本水位 }
        state: { type: string, enum: [current, partial], description: 任一非权限来源读取失败为 partial 并列出 missing_sources }
        missing_sources: { type: array, items: { type: string } }

    DeliveryBriefTruncation:
      type: object
      description: 各段落是否超上限截断（attempts 50 / runs 100 / files 200 / artifacts 100 / comments 200）；超限同时返回完整总数。
      required: [attempts, runs, files, artifacts, comments]
      properties:
        attempts: { type: boolean }
        runs: { type: boolean }
        files: { type: boolean }
        artifacts: { type: boolean }
        comments: { type: boolean }

    DeliveryBrief:
      type: object
      description: 确定性服务端聚合；不能复用 rolling_digest 代替完整证据。
      required: [work_item, acceptance_criteria, conclusion, attempts, runs, artifacts, risks, comments, freshness, truncation]
      properties:
        work_item: { $ref: "#/components/schemas/WorkItem" }
        acceptance_criteria: { type: array, items: { type: string } }
        conclusion: { $ref: "#/components/schemas/DeliveryBriefConclusion" }
        attempts:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/AttemptSummary" }
        runs:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/RunEvidence" }
        changes: { $ref: "#/components/schemas/BriefChangeSet", nullable: true }
        artifacts:
          type: array
          maxItems: 100
          description: ArtifactRepo 按 classification 权限过滤后的产物
          items: { $ref: "#/components/schemas/Artifact" }
        blocker:
          type: object
          nullable: true
          properties:
            code: { type: string }
            message: { type: string }
            source: { type: string }
            run_id: { type: string, nullable: true }
            created_at: { type: string, format: date-time }
        risks:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/RiskItem" }
        comments:
          type: array
          maxItems: 200
          description: requirement/review_feedback 评论，按 root revision 排序
          items: { $ref: "#/components/schemas/TaskComment" }
        freshness: { $ref: "#/components/schemas/DeliveryBriefFreshness" }
        truncation: { $ref: "#/components/schemas/DeliveryBriefTruncation" }

    Blocker:
      type: object
      description: 任务阻塞事实（CoordinatorSnapshot.blocker 引用；WorkItem.blocker 为同形内联）。
      properties:
        code: { type: string }
        message: { type: string }
        source: { type: string }
        created_at: { type: string, format: date-time }

    TaskControlSurfaceErrorCode:
      type: string
      description: |
        任务控制面补全（RFC §9.7）新增错误码。HTTP 状态 / retryable 对照：
        422 非重试——workspace_location_required / workspace_mount_not_advertised /
        development_context_invalid / comment_kind_invalid / comment_body_empty /
        comment_source_run_mismatch / review_feedback_required；
        409 非重试——workspace_location_ambiguous / workspace_context_mismatch /
        workspace_branch_not_unique / comment_terminal_work_item /
        comment_coordinator_required / child_review_not_supported /
        review_state_conflict；
        409 可重试——workspace_mount_generation_changed / workspace_checkout_busy /
        execution_host_unavailable / development_context_busy；
        403 非重试——workspace_path_forbidden；
        413 非重试——comment_body_too_large；
        400 非重试——comment_cursor_invalid。
        既有 version_conflict / idempotency_conflict / idempotency_in_progress 继续复用。
      enum:
        - workspace_location_required
        - workspace_location_ambiguous
        - workspace_mount_not_advertised
        - workspace_context_mismatch
        - workspace_mount_generation_changed
        - workspace_branch_not_unique
        - workspace_checkout_busy
        - execution_host_unavailable
        - development_context_busy
        - development_context_invalid
        - workspace_path_forbidden
        - comment_kind_invalid
        - comment_body_empty
        - comment_body_too_large
        - comment_terminal_work_item
        - comment_source_run_mismatch
        - comment_cursor_invalid
        - comment_coordinator_required
        - review_feedback_required
        - child_review_not_supported
        - review_state_conflict
