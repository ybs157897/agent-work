        content: { type: string, minLength: 1, maxLength: 1048576 }
        text: { type: string, minLength: 1, maxLength: 1048576 }
        title: { type: string, maxLength: 400 }
        publish_intent:
          type: string
          enum: [confirmed_requirement]
          description: 仅表示调用 Agent 已取得用户对需求/约定的确认；不表示实现已验证。
        client_key: { type: string, minLength: 1, maxLength: 256, description: 可选；缺省使用 Idempotency-Key }
      oneOf:
        - required: [content]
        - required: [text]

