name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: agent-team-workbench/go.sum

      - name: gofmt
        working-directory: agent-team-workbench
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        working-directory: agent-team-workbench
        run: go vet ./...

      - name: build
        working-directory: agent-team-workbench
        run: go build ./...

      - name: test (race detector)
        working-directory: agent-team-workbench
        run: go test -race ./...

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate JSON contracts
        working-directory: agent-team-workbench
        run: |
          python3 -c "import json; [json.load(open(f)) for f in ['contracts/control/plan-decision-v2.schema.json','contracts/runner/v2/schema.json']]"
      - name: validate YAML contracts
        working-directory: agent-team-workbench
        run: |
          pip install --quiet pyyaml
          python3 -c "import yaml; [yaml.safe_load(open(f)) for f in ['contracts/web/openapi.yaml','contracts/events/asyncapi.yaml','../integrations/web-idea/contracts/openapi/gateway-v1.yaml']]"

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: agent-team-workbench/go.sum
      - name: SQLite migration tests
        working-directory: agent-team-workbench
        run: go test -count=1 ./cmd/migrate
      - name: apply migrations (fresh SQLite)
        working-directory: agent-team-workbench
        run: go run ./cmd/migrate -dsn "sqlite://$RUNNER_TEMP/workbench-ci.db"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: agent-team-workbench/web/pnpm-lock.yaml
      - name: install
        working-directory: agent-team-workbench/web
        run: pnpm install --frozen-lockfile
      - name: typecheck
        working-directory: agent-team-workbench/web
        run: pnpm tsc -b
      - name: test
        working-directory: agent-team-workbench/web
        run: pnpm test
      - name: lint
        working-directory: agent-team-workbench/web
        run: pnpm lint
      - name: build
        working-directory: agent-team-workbench/web
        run: pnpm build

  java-code-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: integrations/web-idea/apps/gateway/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: integrations/web-idea/apps/web/pnpm-lock.yaml
      - name: Gateway formatting, vet, build and race tests
        working-directory: integrations/web-idea/apps/gateway
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go build -o bin/web-idea-gateway .
          go test -race ./...
      - name: Java reader install, tests and build
        working-directory: integrations/web-idea/apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
