asyncapi: 3.0.0
info:
  title: Agent Team Workbench SSE Events
  version: 0.1.0
  description: |
    浏览器实时事件契约（协议文档 §6）。SSE 单向通道：
    GET /api/v1/workspaces/{workspace_id}/events，Last-Event-ID 补发，
    heartbeat 每 15s，慢客户端超缓冲上限主动断开走 replay。
    Envelope 中 stream_seq 为 Workspace 投影序号，run_seq 为 Run 内序号，
    均由控制平面分配，不复用 Provider id。游标过保留窗口返回 410 cursor_expired。

defaultContentType: application/json

channels:
  workspaceEvents:
    address: /api/v1/workspaces/{workspace_id}/events
    messages:
      canonicalEvent:
        $ref: "#/components/messages/CanonicalEvent"

operations:
  receiveWorkspaceEvents:
    action: receive
    channel:
      $ref: "#/channels/workspaceEvents"
    summary: 浏览器订阅 Workspace 事件流（SSE）

components:
  messages:
    CanonicalEvent:
      contentType: application/json
      payload:
        $ref: "#/components/schemas/CanonicalEventEnvelope"

  schemas:
    CanonicalEventEnvelope:
      type: object
      required: [contract_version, event_id, workspace_id, stream_seq, aggregate, type, occurred_at]
      properties:
        contract_version: { type: string, const: "events/v1" }
        event_id: { type: string, description: "evt_ 前缀，浏览器去重键" }
        workspace_id: { type: string }
        stream_seq: { type: integer, format: int64, description: "Workspace 投影序号，单调递增" }
        aggregate:
          type: object
          required: [type, id, version]
          properties:
            type: { type: string, enum: [workspace, agent_profile, work_item, execution_run, approval, artifact, runtime_binding, runner, plan, dispatch, decision, task_coordinator, execution_host, workspace_location, task_comment] }
            id: { type: string }
            version: { type: integer }
        run_seq: { type: integer, format: int64, description: "仅 Run 域事件携带" }
        agent_id: { type: string, description: "Run 事件来源 Agent；缺省或 main 表示主 Agent" }
        type:
          type: string
          description: |
            SSE event 名白名单。与 internal/domain/events.go 的 Event* 常量一一对应，
            由 internal/httpapi 的契约门禁测试双向对账：多、少、改名任一方向漂移都红灯。
          enum:
            # Dashboard
            - dashboard.metrics.updated
            - activity.appended
            - system.health_changed
            # Agent
            - agent_profile.created
            - agent_profile.updated
            - agent_availability.changed
            - agent_presence.updated
            # WorkItem
            - work_item.created
            - work_item.updated
            - work_item.moved
            - work_item.assigned
            - work_item.blocked
            - work_item.unblocked
            - work_item.completed
            - work_item.locked
            - work_item.lock_preempted
            # Dispatch（会话元模型 S1；updated 的发布点随 S3 状态收口接入）
            - dispatch.created
            - dispatch.updated
            # Decision（会话元模型 S2：决策台账写入）
            - decision.created
            # Task Coordinator（系统控制线与失败恢复）
            - coordinator.queued
            - coordinator.started
            - coordinator.message_received
            - coordinator.plan_updated
            - coordinator.attempt_updated
            - coordinator.retry_scheduled
            - coordinator.recovery_started
            - coordinator.blocked
            - coordinator.completed
            - coordinator.state_changed
            # Run
            - run.created
            - run.started
            - run.status_changed
            - run.progress_updated
            - run.plan_updated
            - run.completed
            - run.failed
            - run.cancelled
            - run.lost
            # Session
            - session.decision
            - session.compacted
            # Plan
            - plan.submitted
            - plan.step_executed
            - plan.waiting
            - plan.finished
            - plan.failed
            # Message
            - message.delta
            - message.completed
            # Tool
            - tool.started
            - tool.progress
            - tool.completed
            - tool.failed
            - subagent.updated
            - file_changes.reverted
            # Approval
            - approval.requested
            - approval.resolved
            - approval.expired
            # Artifact / Usage
            - artifact.created
            - artifact.updated
            - usage.updated
            # Runtime
            - runtime.health_changed
            - run.recovery_started
            - run.recovery_completed
            - run.recovery_failed
            # Execution Host / Workspace Location（任务控制面补全 RFC §10）
            - execution_host.updated
            - workspace_location.created
            - workspace_location.updated
            - workspace_location.unavailable
            # Development Context / Task Comment（任务控制面补全 RFC §10）
            - work_item.development_context_updated
            - task_comment.created
        occurred_at: { type: string, format: date-time }
        actor:
          type: object
          properties:
            kind: { type: string, enum: [user, runtime, system] }
            id: { type: string }
        correlation_id: { type: string, description: 触发命令 id }
        data: { type: object, description: 事件负载，按 type 区分 }

    TaskCommentCreatedData:
      type: object
      description: |
        task_comment.created 事件的最小 data（RFC §10）。SSE 不推送 comment body；
        前端按 work item/root 失效重取。actionable = kind IN (requirement,
        review_feedback)；coordinator_status 为评论事务提交时根 Coordinator 的
        durable 状态（waiting_user 的 actionable 评论原子回 queued）。
      required: [record_kind, comment_id, root_work_item_id, work_item_id, revision, kind, actionable]
      properties:
        record_kind: { type: string, const: task }
        comment_id: { type: string, description: "cmt_ 前缀" }
        root_work_item_id: { type: string }
        work_item_id: { type: string }
        revision: { type: integer, format: int64 }
        kind: { type: string, enum: [note, requirement, review_feedback] }
        actionable: { type: boolean }
        coordinator_status: { type: string, description: 评论事务提交时根 Coordinator durable 状态；缺省表示无 Coordinator state }
