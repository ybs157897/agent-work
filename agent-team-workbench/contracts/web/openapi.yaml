openapi: 3.1.0
info:
  title: Agent Team Workbench Web API
  version: 0.1.0
  description: |
    浏览器 ↔ Go Control Plane 协议（协议文档 §5）。
    约定：/api/v1 前缀；资源 ID 带类型前缀（ws_/agent_/wi_/run_/approval_/artifact_）；
    JSON 字段 snake_case；写命令要求 Idempotency-Key；可变资源带 version/ETag；
    错误一律 application/problem+json。
servers:
  - url: /api/v1

security:
  - cookieAuth: []

tags:
  - name: workspace
  - name: agent-profiles
  - name: work-items
  - name: plans
  - name: runs
  - name: approvals
  - name: artifacts
  - name: runtime-bindings
  - name: events
  - name: models

paths:
  /me:
    get:
      tags: [workspace]
      operationId: getCurrentUser
      summary: 当前用户、Workspace 权限与功能标记
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/CurrentUser" } } } }

  /workspaces:
    get:
      tags: [workspace]
      operationId: listWorkspaces
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceList" } } } }

  /workspaces/{workspace_id}:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    patch:
      tags: [workspace]
      operationId: updateWorkspace
      description: 更新名称、时区和策略；Owner/Admin。
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/WorkspacePatch" } } } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/Workspace" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /workspaces/{workspace_id}/bootstrap:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [workspace]
      operationId: bootstrapWorkspace
      summary: 首屏 dashboard、agents、board、health 与 event_cursor 一次返回
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/Bootstrap" } } } }

  /workspaces/{workspace_id}/dashboard:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [workspace]
      operationId: getDashboard
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/Dashboard" } } } }

  /workspaces/{workspace_id}/events:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [events]
      operationId: subscribeEvents
      summary: SSE 事件流；Last-Event-ID 补发；cursor 过期返回 410
      responses:
        "200":
          description: text/event-stream
          content: { text/event-stream: { schema: { type: string } } }
        "410": { $ref: "#/components/responses/CursorExpired" }

  /workspaces/{workspace_id}/agent-profiles:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [agent-profiles]
      operationId: listAgentProfiles
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/AgentProfileList" } } } }
    post:
      tags: [agent-profiles]
      operationId: createAgentProfile
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AgentProfileCreate" } } } }
      responses:
        "201": { content: { application/json: { schema: { $ref: "#/components/schemas/AgentProfile" } } } }

  /agent-profiles/{agent_profile_id}:
    parameters: [{ $ref: "#/components/parameters/AgentProfileId" }]
    get:
      tags: [agent-profiles]
      operationId: getAgentProfile
      parameters:
        - name: include
          in: query
          schema: { type: string, example: "presence,current_run" }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/AgentProfile" } } } }
    patch:
      tags: [agent-profiles]
      operationId: updateAgentProfile
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AgentProfilePatch" } } } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/AgentProfile" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /agent-profiles/{agent_profile_id}/commands/enable:
    parameters: [{ $ref: "#/components/parameters/AgentProfileId" }]
    post:
      tags: [agent-profiles]
      operationId: enableAgentProfile
      description: 允许被调度；不等于立刻运行。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/AgentProfile" } } } }

  /agent-profiles/{agent_profile_id}/commands/disable:
    parameters: [{ $ref: "#/components/parameters/AgentProfileId" }]
    post:
      tags: [agent-profiles]
      operationId: disableAgentProfile
      description: 停止新调度；活动 Run 按策略 interrupt（默认）。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: "#/components/schemas/DisableOptions" } } } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/AgentProfile" } } } }

  /workspaces/{workspace_id}/work-items:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [work-items]
      operationId: listWorkItems
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: priority, in: query, schema: { type: string } }
        - { name: assignee, in: query, schema: { type: string } }
        - name: parent_id
          in: query
          required: false
          schema: { type: string }
          description: 缺省不过滤；值 `none` 只看根任务（无父链接）。
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkItemList" } } } }
    post:
      tags: [work-items]
      operationId: createWorkItem
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/WorkItemCreate" } } } }
      responses:
        "201": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkItem" } } } }

  /work-items/{work_item_id}:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    get:
      tags: [work-items]
      operationId: getWorkItem
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkItem" } } } }
    patch:
      tags: [work-items]
      operationId: updateWorkItem
      description: 普通字段修改；status 不允许任意 PATCH。
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/WorkItemPatch" } } } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkItem" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /work-items/{work_item_id}/commands/assign:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    post:
      tags: [work-items]
      operationId: assignWorkItem
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_profile_id, expected_version]
              properties:
                agent_profile_id: { type: string }
                expected_version: { type: integer }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkItem" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /work-items/{work_item_id}/commands/move:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    post:
      tags: [work-items]
      operationId: moveWorkItem
      description: 看板移动、排序与状态机校验。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, expected_version]
              properties:
                status: { $ref: "#/components/schemas/WorkItemStatus" }
                expected_version: { type: integer }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkItem" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /work-items/{work_item_id}/commands/claim:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    post:
      tags: [work-items]
      operationId: claimWorkItem
      description: |
        M4 认领命令（发布 → 领取）：仅 todo 且当前无 assignee 可认领。
        认领 = 指派 + 按目标 agent WakeOnAssignment 入队 assignment 唤醒；
        同 agent 重复认领幂等返回现状；已有 assignee 或非 todo → 409。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, expected_version]
              properties:
                agent_id: { type: string, description: 认领者 agent profile id }
                expected_version: { type: integer }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkItem" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /work-items/{work_item_id}/commands/return:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    post:
      tags: [work-items]
      operationId: returnWorkItem
      description: |
        M4 手动打回（验收回流人工半环）：in_progress 且 phase=acceptance/review
        时合法 → phase=execution，activity 记录 reason；其余 phase → 409。
        再交付路径：与对应 agent 继续会话创建新 run。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version]
              properties:
                reason: { type: string, description: 打回原因（落 activity） }
                expected_version: { type: integer }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkItem" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /work-items/{work_item_id}/commands/block:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    post:
      tags: [work-items]
      operationId: blockWorkItem
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, message, expected_version]
              properties:
                code: { type: string }
                message: { type: string }
                source: { type: string }
                expected_version: { type: integer }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkItem" } } } }

  /work-items/{work_item_id}/commands/unblock:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    post:
      tags: [work-items]
      operationId: unblockWorkItem
      description: 解除阻塞回到 in_progress；恢复执行由用户显式创建新 Run。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version]
              properties:
                expected_version: { type: integer }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkItem" } } } }

  /work-items/{work_item_id}/tree:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    get:
      tags: [plans]
      operationId: getWorkItemTree
      summary: 以该任务为根的整棵子树（先序；DTO 带 parent_id）
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkItemTree" } } } }

  /work-items/{work_item_id}/plan:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    get:
      tags: [plans]
      operationId: getWorkItemPlan
      summary: 该主任务最新一份 plan（created_at 最新，不限状态）；无 plan 404
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/Plan" } } } }
        "404": { description: 该任务尚无 plan, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /workspaces/{workspace_id}/plans:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    post:
      tags: [plans]
      operationId: createPlan
      description: |
        提交并同步执行一份 plan（dispatch/defer/finish）。同一 work item 唯一
        active/waiting plan：active 拒绝、waiting 同事务 supersede。
        verb 未知 / defer 非法 / 校验失败 → 400 problem+json（plan 不落库）。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PlanSubmit" } } } }
      responses:
        "201": { content: { application/json: { schema: { $ref: "#/components/schemas/Plan" } } } }
        "400": { description: verb 未知 / defer 无出口 / 字段校验失败, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /plans/{plan_id}:
    parameters: [{ $ref: "#/components/parameters/PlanId" }]
    get:
      tags: [plans]
      operationId: getPlan
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/Plan" } } } }

  /work-items/{work_item_id}/runs:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    get:
      tags: [runs]
      operationId: listWorkItemRuns
      summary: 一个任务的全部 Run（对话轮次历史；不可覆盖的执行尝试）
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ExecutionRunList" } } } }
    post:
      tags: [runs]
      operationId: createRun
      description: 创建 ExecutionRun；立即 202，真正开始执行由 SSE 事件确认。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }, { $ref: "#/components/parameters/IfMatch" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RunCreate" } } } }
      responses:
        "202": { content: { application/json: { schema: { $ref: "#/components/schemas/RunAccepted" } } } }

  /runs/{run_id}:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    get:
      tags: [runs]
      operationId: getRun
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ExecutionRun" } } } }

  /runs/{run_id}/events:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    get:
      tags: [runs]
      operationId: listRunEvents
      summary: 回放 Run 事件历史（对话页消息重建；只读投影，按 run_seq 排序）
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/RunEventList" } } } }

  /runs/{run_id}/commands/input:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    post:
      tags: [runs]
      operationId: sendRunInput
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instruction]
              properties:
                instruction: { type: string }
      responses:
        "202": { description: 命令已接受 }

  /runs/{run_id}/commands/interrupt:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    post:
      tags: [runs]
      operationId: interruptRun
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses: { "202": { description: 命令已接受 } }

  /runs/{run_id}/commands/cancel:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    post:
      tags: [runs]
      operationId: cancelRun
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses: { "202": { description: 命令已接受 } }

  /runs/{run_id}/commands/retry:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    post:
      tags: [runs]
      operationId: retryRun
      description: 总是创建新 Run（retry_of=当前 run），不覆盖终态；返回完整 ExecutionRun。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "202": { content: { application/json: { schema: { $ref: "#/components/schemas/ExecutionRun" } } } }

  /runs/{run_id}/commands/resume:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    post:
      tags: [runs]
      operationId: resumeRun
      description: 仅在能力声明 resume 时可用，否则 422。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "202": { description: 命令已接受 }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /runs/{run_id}/approvals:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    get:
      tags: [approvals]
      operationId: listApprovals
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalList" } } } }

  /runs/{run_id}/approvals/{approval_id}/commands/resolve:
    parameters: [{ $ref: "#/components/parameters/RunId" }, { $ref: "#/components/parameters/ApprovalId" }]
    post:
      tags: [approvals]
      operationId: resolveApproval
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approved, rejected] }
                reason: { type: string }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/Approval" } } } }

  /runs/{run_id}/artifacts:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    get:
      tags: [artifacts]
      operationId: listArtifacts
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ArtifactList" } } } }

  /workspaces/{workspace_id}/activities:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [workspace]
      operationId: listActivities
      parameters: [{ $ref: "#/components/parameters/Cursor" }]
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ActivityList" } } } }

  /workspaces/{workspace_id}/runtime-bindings:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [runtime-bindings]
      operationId: listRuntimeBindings
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/RuntimeBindingList" } } } }
    post:
      tags: [runtime-bindings]
      operationId: createRuntimeBinding
      description: 添加 Runtime 与模型配置（provider/model/CredentialRef）；凭据只存引用。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [runtime_label, adapter_id]
              properties:
                runtime_label: { type: string }
                adapter_id: { type: string }
                provider: { type: string }
                model: { type: string }
                credential_ref: { type: string }
      responses:
        "201": { content: { application/json: { schema: { $ref: "#/components/schemas/RuntimeBinding" } } } }

  /runtime-bindings/{runtime_binding_id}:
    parameters: [{ $ref: "#/components/parameters/RuntimeBindingId" }]
    patch:
      tags: [runtime-bindings]
      operationId: patchRuntimeBinding
      description: 修改模型配置（provider/model/credential_ref），乐观锁保护。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version]
              properties:
                provider: { type: string }
                model: { type: string }
                credential_ref: { type: string }
                expected_version: { type: integer }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/RuntimeBinding" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /runtime-bindings/{runtime_binding_id}/commands/probe:
    parameters: [{ $ref: "#/components/parameters/RuntimeBindingId" }]
    post:
      tags: [runtime-bindings]
      operationId: probeRuntimeBinding
      description: 探测版本、认证、协议与能力；不启动业务 Run。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "202": { content: { application/json: { schema: { $ref: "#/components/schemas/ProbeResult" } } } }

  /workspaces/{workspace_id}/agent-config/reload:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    post:
      tags: [agent-profiles]
      operationId: reloadAgentConfig
      summary: 重扫 agents/ 配置目录并导入 DB 投影（文件为真相源）
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/AgentConfigReloadResult" } } } }

  /models:
    get:
      tags: [models]
      operationId: listModels
      summary: 模型注册表列表（models/ 目录为真相源，全局共享不按 Workspace 隔离）
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ModelEntryList" } } } }
    post:
      tags: [models]
      operationId: createModel
      description: 新建模型条目；id 可空（由 display_name 生成 slug）。凭据只传环境变量名，绝不传密钥明文。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ModelUpsert" } } } }
      responses:
        "201": { content: { application/json: { schema: { $ref: "#/components/schemas/ModelEntry" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /models/{model_id}:
    parameters: [{ $ref: "#/components/parameters/ModelId" }]
    put:
      tags: [models]
      operationId: updateModel
      description: 全量替换模型条目（PUT 幂等语义；path id 为权威）。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ModelUpsert" } } } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ModelEntry" } } } }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [models]
      operationId: deleteModel
      description: 删除模型条目（幂等；引用它的 Agent 在下次创建 Run 时将收到 422）。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKeyOptional" }]
      responses:
        "204": { description: 已删除 }

  /health:
    get:
      tags: [workspace]
      operationId: getHealth
      summary: 分层健康投影（System Online 不是固定文案；含 runners 概览）
      security: []
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/HealthStatus" } } } }

  /agent-profiles/{agent_profile_id}/commands/wake:
    parameters: [{ $ref: "#/components/parameters/AgentProfileId" }]
    post:
      tags: [agent-profiles]
      operationId: wakeAgent
      summary: 手动唤醒（on_demand 源）；入队后由调度循环消费（≤一个 tick）并创建 run
      description: |
        agent 未开启 wake_on_demand 时返回 422。coalescing（活跃 run 期间合并）由
        调度循环统一判定；唤醒审计见 agent_wakeup_requests（consumed/coalesced）。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_key]
              properties:
                task_key: { type: string, description: 唤醒锚定的 work item id }
                instruction: { type: string, description: 显式指令；渲染时优先于 prompt_template }
                context:
                  type: object
                  additionalProperties: true
                  description: 附加唤醒上下文（合并进 wake context）
      responses:
        "202":
          content:
            application/json:
              schema:
                type: object
                required: [wakeup_id, status, wake_at]
                properties:
                  wakeup_id: { type: string }
                  status: { type: string, enum: [queued] }
                  wake_at: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /agent-profiles/{agent_profile_id}/task-sessions:
    parameters: [{ $ref: "#/components/parameters/AgentProfileId" }]
    get:
      tags: [agent-profiles]
      operationId: listTaskSessions
      summary: Agent 名下跨 Run 会话锚点（墓碑行不返回；session_params 保留 __ref/__fingerprint 供诊断）
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TaskSession" }

  /agent-profiles/{agent_profile_id}/task-sessions/reset:
    parameters: [{ $ref: "#/components/parameters/AgentProfileId" }]
    post:
      tags: [agent-profiles]
      operationId: resetTaskSession
      summary: 重置会话锚点（写墓碑；下一轮 Run 开新会话且不会被播种兜底复活）
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_key, adapter_id]
              properties:
                task_key: { type: string, description: 通常是 work item ID }
                adapter_id: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [reset] }
        "404": { $ref: "#/components/responses/Conflict" }

  /work-items/{work_item_id}/commands/accept:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    post:
      tags: [work-items]
      operationId: acceptWorkItem
      description: 验收工作项（acceptance 决议；漂移检测后接受当前状态）。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version]
              properties:
                expected_version: { type: integer }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkItem" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /models/provider-credentials:
    get:
      tags: [models]
      operationId: getProviderCredential
      summary: 读取本地保存的 provider API Key（仅本机工作台；需 runtime.manage 权限；模型注册表未启用时 404）
      parameters:
        - name: provider_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_key: { type: string, description: 未配置时为空串 }
        "404": { $ref: "#/components/responses/Conflict" }
    put:
      tags: [models]
      operationId: putProviderCredential
      summary: 保存 provider API Key 到本地凭据存储
      parameters: [{ $ref: "#/components/parameters/IdempotencyKeyOptional" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider_id, api_key]
              properties:
                provider_id: { type: string }
                api_key: { type: string }
      responses:
        "204": { description: 已保存 }
        "404": { $ref: "#/components/responses/Conflict" }

  /runtimes/dsh/catalog:
    get:
      tags: [runtime-bindings]
      operationId: getDshCatalog
      summary: DSH harness 预设目录（agent_presets / permission_presets；本地仓库扫描）
      security: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [agent_presets, permission_presets]
                properties:
                  agent_presets:
                    type: array
                    items: { type: object, additionalProperties: true }
                  permission_presets:
                    type: array
                    items: { type: object, additionalProperties: true }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session

  parameters:
    WorkspaceId: { name: workspace_id, in: path, required: true, schema: { type: string } }
    AgentProfileId: { name: agent_profile_id, in: path, required: true, schema: { type: string } }
    WorkItemId: { name: work_item_id, in: path, required: true, schema: { type: string } }
    RunId: { name: run_id, in: path, required: true, schema: { type: string } }
    PlanId: { name: plan_id, in: path, required: true, schema: { type: string } }
    ApprovalId: { name: approval_id, in: path, required: true, schema: { type: string } }
    RuntimeBindingId: { name: runtime_binding_id, in: path, required: true, schema: { type: string } }
    ModelId: { name: model_id, in: path, required: true, schema: { type: string } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
      description: |
        写命令幂等键。同 key 同请求体：已完成则重放原响应（Idempotent-Replayed: true），
        执行中返回 409 idempotency_in_progress（retryable，稍后重试）；
        同 key 不同请求体返回 409 idempotency_conflict；5xx 后占位释放，可同 key 重试。
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string }
      description: 可选（该操作天然幂等，不依赖此头）。
    IfMatch: { name: If-Match, in: header, required: false, schema: { type: string } }
    Cursor: { name: cursor, in: query, required: false, schema: { type: string } }

  responses:
    Conflict:
      description: 幂等冲突或乐观锁版本冲突
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Unprocessable:
      description: 领域校验失败（状态机非法迁移等）
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    CursorExpired:
      description: SSE cursor 已过保留窗口；客户端需重新 bootstrap
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        instance: { type: string }
        request_id: { type: string }
        retryable: { type: boolean }
        current_version: { type: integer }

    CurrentUser:
      type: object
      properties:
        user_id: { type: string }
        name: { type: string }
        role: { type: string, enum: [owner, admin, operator, approver, viewer] }
        workspace_ids: { type: array, items: { type: string } }
        feature_flags: { type: object, additionalProperties: { type: boolean } }

    WorkspaceList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Workspace" } }

    Workspace:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        timezone: { type: string }
        version: { type: integer }

    WorkspacePatch:
      type: object
      properties:
        name: { type: string }
        timezone: { type: string }
        expected_version: { type: integer }

    Bootstrap:
      type: object
      properties:
        workspace: { $ref: "#/components/schemas/Workspace" }
        dashboard: { $ref: "#/components/schemas/Dashboard" }
        agents: { $ref: "#/components/schemas/AgentProfileList" }
        work_items: { $ref: "#/components/schemas/WorkItemList" }
        health: { $ref: "#/components/schemas/SystemHealth" }
        event_cursor: { type: integer }

    Dashboard:
      type: object
      properties:
        active_agents: { type: integer }
        running_tasks: { type: integer }
        completed_today: { type: integer }
        board_counts:
          type: object
          properties:
            todo: { type: integer }
            in_progress: { type: integer }
            blocked: { type: integer }
            completed: { type: integer }
        recent_activities: { $ref: "#/components/schemas/ActivityList" }

    SystemHealth:
      type: object
      properties:
        control_plane: { type: string, enum: [healthy, degraded, down] }
        runners: { type: array, items: { type: object, properties: { runner_id: { type: string }, status: { type: string } } } }

    AgentProfileList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AgentProfile" } }

    AgentProfileCreate:
      type: object
      required: [name, role]
      properties:
        name: { type: string }
        role: { type: string, enum: [pm, architect, ui, developer, reviewer, custom] }
        skills: { type: array, items: { type: string } }
        runtime_preference: { $ref: "#/components/schemas/RuntimePreference" }
        avatar: { type: string }

    AgentProfilePatch:
      type: object
      properties:
        name: { type: string }
        role: { type: string }
        skills: { type: array, items: { type: string } }
        instructions: { type: string }
        runtime_preference: { $ref: "#/components/schemas/RuntimePreference" }
        model_override: { $ref: "#/components/schemas/ModelRef" }
        policy: { $ref: "#/components/schemas/AgentPolicy" }
        expected_version: { type: integer }

    DisableOptions:
      type: object
      properties:
        active_run_policy: { type: string, enum: [interrupt, continue, cancel], default: interrupt }

    AgentProfile:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string }
        skills: { type: array, items: { type: string } }
        instructions: { type: string }
        availability: { type: string, enum: [enabled, disabled] }
        presence: { type: string, enum: [idle, busy, degraded, offline] }
        current_run_summary:
          type: object
          nullable: true
          properties:
            run_id: { type: string }
            work_item_id: { type: string }
            title: { type: string }
            progress: { type: number }
        runtime_preference: { $ref: "#/components/schemas/RuntimePreference" }
        model_override: { $ref: "#/components/schemas/ModelRef" }
        policy: { $ref: "#/components/schemas/AgentPolicy" }
        version: { type: integer }

    RuntimePreference:
      type: object
      properties:
        preferred: { type: string }
        fallbacks: { type: array, items: { type: string } }
        mode: { type: string, enum: [default, plan] }
        agent_preset: { type: string }

    ModelRef:
      type: object
      properties:
        ref: { type: string }
        provider: { type: string }
        model: { type: string }

    AgentPolicy:
      type: object
      properties:
        tools: { type: array, items: { type: string } }
        approval_policy: { type: string, enum: [auto, approve_high_risk, manual] }
        sandbox: { type: string, enum: [read-only, workspace-write, danger-full-access] }
        permission_preset: { type: string }

    WorkItemList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/WorkItem" } }
        next_cursor: { type: string, nullable: true }

    WorkItemTree:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/WorkItem" } }

    PlanStatus:
      type: string
      enum: [active, waiting, finished, cancelled, failed]
      description: finished/cancelled/failed 为终态；waiting 由同主任务新 plan 提交 supersede 收口（M4 审批放行可 waiting→active 续跑，为唯一回拨边）。

    PlanVerb:
      type: string
      enum: [dispatch, defer, join, finish, consult_knowledge]
      description: M4 词汇表；未知 verb 提交即 400。consult_knowledge 检索结果写 step payload.results，供 dispatch.knowledge_from 引用；join 为带显式等待集的 defer 变体。

    PlanSubmit:
      type: object
      required: [work_item_id, agent_profile_id, steps]
      properties:
        work_item_id: { type: string }
        agent_profile_id: { type: string, description: plan owner（提交者 / lead agent） }
        source_run_id: { type: string, nullable: true }
        guardrails:
          $ref: "#/components/schemas/PlanGuardrails"
        steps:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PlanStepSubmit" }

    PlanGuardrails:
      type: object
      description: M4 预算护栏（提交时固化进 plan）。max_dispatch 提交期整单校验（超限 400 不部分执行）；max_tokens 在子任务静默唤醒点核算（主任务树全部 run 的 input+output token 合计，超限 plan failed + 主任务 blocker）。
      properties:
        max_dispatch: { type: integer, description: dispatch 步数上限 }
        max_tokens: { type: integer, format: int64, description: 主任务树 token 总预算 }

    PlanStepSubmit:
      type: object
      required: [verb]
      properties:
        verb: { $ref: "#/components/schemas/PlanVerb" }
        agent_id: { type: string, description: dispatch 必填（目标执行 agent） }
        title: { type: string, description: dispatch 必填 }
        instruction: { type: string, description: dispatch 必填 }
        acceptance: { type: array, items: { type: string } }
        priority: { $ref: "#/components/schemas/Priority" }
        reason: { type: string, description: defer 挂起原因 }
        wake_at: { type: string, format: date-time, description: defer/join 可选出口；与等待集内活跃子任务至少居其一 }
        children:
          description: join 必填（defer 无此字段）。显式等待集："all" 或既有子任务 id 数组；非 "all" 目标必须是本 plan 主任务的子任务，否则 400。
          oneOf:
            - type: string
              enum: [all]
            - type: array
              items: { type: string }
              minItems: 1
        summary: { type: string, description: finish 收尾说明 }
        evaluation: { type: boolean, description: finish 后追加验收评估 run（instruction 含验收标准与子任务摘要，agent 为 plan owner） }
        corpus: { type: string, description: consult_knowledge 必填；单层目录名（拒绝路径分隔符与 `.`/`..`） }
        terms: { type: array, items: { type: string }, description: consult_knowledge 检索词 }
        limit: { type: integer, description: consult_knowledge 返回条数上限 }
        knowledge_from: { type: integer, description: dispatch 可选；引用更早的 consult_knowledge 步骤（0 基序号），检索条目注入 instruction 附录 }

    Plan:
      type: object
      properties:
        id: { type: string }
        workspace_id: { type: string }
        work_item_id: { type: string }
        agent_profile_id: { type: string }
        source_run_id: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/PlanStatus" }
        superseded_by: { type: string, nullable: true }
        guardrails: { $ref: "#/components/schemas/PlanGuardrails" }
        error: { type: string, nullable: true, description: plan 级失败码（budget_exceeded）；步骤级失败原因在 PlanStep.error }
        steps: { type: array, items: { $ref: "#/components/schemas/PlanStep" } }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PlanStep:
      type: object
      properties:
        seq: { type: integer }
        verb: { $ref: "#/components/schemas/PlanVerb" }
        status: { type: string, enum: [pending, executed, skipped, failed] }
        payload: { type: object, additionalProperties: true }
        result_work_item_id: { type: string, nullable: true }
        result_run_id: { type: string, nullable: true }
        error: { type: string, nullable: true }

    WorkItemCreate:
      type: object
      required: [title]
      properties:
        title: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/WorkItemStatus", default: todo }
        priority: { $ref: "#/components/schemas/Priority", default: medium }
        due_date: { type: string, format: date }
        agent_profile_id: { type: string, nullable: true }

    WorkItemPatch:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        priority: { $ref: "#/components/schemas/Priority" }
        due_date: { type: string, format: date }
        expected_version: { type: integer }

    WorkItemStatus:
      type: string
      enum: [todo, in_progress, blocked, completed, cancelled]

    Priority:
      type: string
      enum: [low, medium, high, urgent]

    WorkItem:
      type: object
      properties:
        id: { type: string }
        workspace_id: { type: string }
        parent_id: { type: string, nullable: true, description: 父任务 id；根任务缺省 }
        title: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/WorkItemStatus" }
        phase: { type: string, enum: [execution, review, acceptance], nullable: true }
        priority: { $ref: "#/components/schemas/Priority" }
        due_date: { type: string, format: date, nullable: true }
        agent_profile_id: { type: string, nullable: true }
        assignee_summary:
          type: object
          nullable: true
          properties:
            name: { type: string }
            avatar: { type: string }
        blocker:
          type: object
          nullable: true
          properties:
            code: { type: string }
            message: { type: string }
            source: { type: string }
            created_at: { type: string, format: date-time }
        runs_count: { type: integer }
        latest_run_id: { type: string, nullable: true }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RunCreate:
      type: object
      required: [agent_profile_id, input]
      properties:
        agent_profile_id: { type: string }
        runtime_preference: { $ref: "#/components/schemas/RuntimePreference" }
        requirements:
          type: object
          additionalProperties: { type: string, enum: [required, preferred, optional] }
        input:
          type: object
          required: [instruction]
          properties:
            instruction: { type: string }
            acceptance_criteria: { type: array, items: { type: string } }

    RunAccepted:
      type: object
      properties:
        run_id: { type: string }
        work_item_id: { type: string }
        status: { type: string }
        version: { type: integer }
        capability_snapshot_id: { type: string, nullable: true }

    ExecutionRun:
      type: object
      properties:
        id: { type: string }
        work_item_id: { type: string }
        agent_profile_id: { type: string }
        status: { $ref: "#/components/schemas/RunStatus" }
        provider: { type: string, nullable: true }
        runtime_label: { type: string, nullable: true }
        progress: { type: number, nullable: true }
        retry_of: { type: string, nullable: true }
        failure:
          type: object
          nullable: true
          properties:
            code: { type: string }
            message: { type: string }
            retryable: { type: boolean }
        usage_in: { type: integer, format: int64, description: 本轮输入 token（adapter 上报；零值省略） }
        usage_out: { type: integer, format: int64, description: 本轮输出 token（adapter 上报；零值省略） }
        usage_cached: { type: integer, format: int64, description: 本轮缓存命中 token（adapter 上报；零值省略） }
        usage_basis: { type: string, enum: [per_run, session_cumulative], description: 用量口径；per_run 为本轮增量，session_cumulative 为会话累计（消费方做差量） }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RunStatus:
      type: string
      enum: [queued, starting, running, waiting_approval, interrupting, cancelling, reconnecting, succeeding, succeeded, interrupted, cancelled, lost, failed]

    ApprovalList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Approval" } }

    Approval:
      type: object
      description: 以实现为准（httpapi approvalDTO）；不输出 requested_by/expires_at。run_id 为空（null）表示 M4 plan_dispatch 审批（不挂 run，经 approval.requested 事件的 data.plan_id 定位）。
      properties:
        id: { type: string }
        run_id: { type: string, nullable: true }
        work_item_id: { type: string }
        kind: { type: string, description: plan_dispatch 表示 M4 审批护栏的 dispatch 人工闸门 }
        risk: { type: string, enum: [low, medium, high] }
        status: { type: string, enum: [pending, approved, rejected, expired] }
        summary: { type: string }
        resolved_at: { type: string, format: date-time, nullable: true }
        resolved_by: { type: string, nullable: true }

    ArtifactList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Artifact" } }

    Artifact:
      type: object
      properties:
        id: { type: string }
        run_id: { type: string }
        logical_path: { type: string }
        mime: { type: string }
        size: { type: integer }
        sha256: { type: string }
        status: { type: string, enum: [draft, accepted] }
        created_at: { type: string, format: date-time }

    ActivityList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Activity" } }
        next_cursor: { type: string, nullable: true }

    Activity:
      type: object
      properties:
        id: { type: string }
        work_item_id: { type: string, nullable: true, description: 归因任务（M4；verdict/blocker 级 activity 非空；activity.appended 事件 data 同键） }
        kind: { type: string }
        message: { type: string }
        occurred_at: { type: string, format: date-time }

    RuntimeBindingList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/RuntimeBinding" } }

    RuntimeBinding:
      type: object
      properties:
        id: { type: string }
        runtime_label: { type: string }
        adapter_id: { type: string }
        adapter_version: { type: string }
        provider_version: { type: string, nullable: true }
        provider: { type: string, description: "模型提供方，如 deepseek / openai" }
        model: { type: string, description: "模型配置，如 deepseek-chat" }
        credential_ref: { type: string, description: "CredentialRef；绝不返回凭据明文" }
        capabilities: { type: object, additionalProperties: { type: string } }
        status: { type: string, enum: [ready, probing, degraded, unavailable] }
        version: { type: integer }

    ProbeResult:
      type: object
      properties:
        runtime_binding_id: { type: string }
        ok: { type: boolean }
        provider_version: { type: string, nullable: true }
        capabilities: { type: object, additionalProperties: { type: string } }
        error: { type: string, nullable: true }

    ExecutionRunList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ExecutionRun" } }

    RunEventList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/RunEvent" } }

    RunEvent:
      type: object
      description: 与实现一致（ListRunEvents 投影；前端 TS 同形）。
      properties:
        run_seq: { type: integer }
        event_type: { type: string, description: "run.created/message.delta/message.completed/tool.*/approval.*/run.status_changed 等" }
        payload: { type: object, additionalProperties: true, nullable: true }
        occurred_at: { type: string, format: date-time }

    AgentConfigReloadResult:
      type: object
      properties:
        created: { type: integer }
        updated: { type: integer }
        skipped: { type: integer }

    ModelEntryList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ModelEntry" } }

    ModelEntry:
      type: object
      description: 模型注册表条目（models/<id>.yaml）；词汇对齐 pi-ai provider profile。
      properties:
        id: { type: string, description: 小写 slug，文件名 }
        display_name: { type: string }
        category: { type: string, description: "UI 展示分类，如 OpenCode Go / Kimi；不参与 runtime 路由" }
        provider: { type: string, description: "provider 路由名，如 deepseek-official / anthropic / 自定义网关" }
        api: { type: string, enum: ["", openai-completions, openai-responses, anthropic-messages], description: 线协议；空 = runtime 默认 }
        model: { type: string }
        api_key_env: { type: string, description: 凭据环境变量名（引用，绝不明文） }
        base_url: { type: string, description: OpenAI 兼容端点 }
        context_window: { type: integer }
        max_tokens: { type: integer }
        notes: { type: string }

    ModelUpsert:
      type: object
      required: [display_name, provider, model]
      properties:
        id: { type: string, description: "POST 可空（由 display_name 生成）；PUT 忽略（path 为权威）" }
        display_name: { type: string }
        category: { type: string, description: "UI 展示分类，如 OpenCode Go / Kimi；不参与 runtime 路由" }
        provider: { type: string }
        api: { type: string, enum: ["", openai-completions, openai-responses, anthropic-messages] }
        model: { type: string }
        api_key_env: { type: string }
        base_url: { type: string }
        context_window: { type: integer }
        max_tokens: { type: integer }
        notes: { type: string }

    TaskSession:
      type: object
      description: 跨 Run 会话锚点（Paperclip agent_task_sessions 对应物）；唯一键 (workspace, agent, adapter, task_key)。
      required: [id, agent_profile_id, adapter_id, task_key, runs_count, input_tokens_cum, created_at, updated_at]
      properties:
        id: { type: string }
        agent_profile_id: { type: string }
        adapter_id: { type: string }
        task_key: { type: string, description: 通常是 work item ID }
        session_ref: { type: string, description: provider 会话句柄（如 codex://thread_x、dsh://session-y） }
        session_params:
          type: object
          additionalProperties: true
          description: adapter 私有参数 + 保留键 __ref/__fingerprint/__from_run_id/__cleared_reason
        display_id: { type: string, description: provider 侧人类可读会话 id }
        runs_count: { type: integer, description: 本代会话已被多少 Run 使用（轮换阈值输入；轮换后清零重起） }
        input_tokens_cum: { type: integer, format: int64, description: 本代累计输入 token（轮换阈值输入） }
        created_at: { type: string, format: date-time, description: 本代会话代际起点（72h 轮换阈值基准） }
        updated_at: { type: string, format: date-time }

    HealthStatus:
      type: object
      required: [health]
      properties:
        health:
          type: object
          properties:
            control_plane: { type: string, enum: [healthy] }
            runners:
              type: array
              items:
                type: object
                additionalProperties: true
