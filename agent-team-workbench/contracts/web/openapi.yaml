openapi: 3.1.0
info:
  title: Agent Team Workbench Web API
  version: 0.2.0
  description: |
    浏览器 ↔ Go Control Plane 协议（协议文档 §5）。
    约定：/api/v1 前缀；资源 ID 带类型前缀（ws_/agent_/wi_/run_/approval_/artifact_/kb_/kbv_/kbs_/kbr_/kss_/kbj_）；
    JSON 字段 snake_case；写命令要求 Idempotency-Key；可变资源带 version/ETag；
    错误一律 application/problem+json。
servers:
  - url: /api/v1

security:
  - cookieAuth: []

tags:
  - name: workspace
  - name: agent-profiles
  - name: work-items
  - name: plans
  - name: runs
  - name: approvals
  - name: artifacts
  - name: runtime-bindings
  - name: execution-hosts
  - name: workspace-locations
  - name: events
  - name: models
  - name: coordinator
  - name: goals
  - name: todos
  - name: handoffs
  - name: governance
  - name: knowledge-librarian
    description: 知识管理员 Agent 的 workspace 管理面与 Run-bound Harness 面
  - name: code-workspaces
    description: 开发 Agent 的瞬态 Java 阅读会话；受限同源代理，无宿主路径或上游凭据

paths:
  /workspaces/{workspace_id}/agent-profiles/{agent_id}/code-workspaces:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { name: agent_id, in: path, required: true, schema: { type: string } }
    post:
      tags: [code-workspaces]
      operationId: openCodeWorkspace
      summary: 为开发 Agent 打开绑定仓库的只读代码会话
      description: |
        仅允许已启用、用户管理的 developer Agent。服务端验证 Workspace、Conversation、Run 归属，
        用可信 HostRegistry 解析实际目录；不接收绝对路径。历史 Run 可用于阅读；无 Run 时使用工作区默认位置。
        这是有过期时间的进程内阅读资源，不创建 Run，不取得 checkout 写锁。
        复用当前工作台用户权限模型，并非新增用户登录或 Agent 工具鉴权协议。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                conversation_id: { type: string }
                run_id: { type: string }
      responses:
        "201":
          description: 已创建阅读会话；浏览器使用 frame_url 打开代码画布
          content: { application/json: { schema: { $ref: "#/components/schemas/CodeWorkspaceSession" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503":
          description: Gateway 尚未构建、启动失败或目标 Host 的阅读通道不可用
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }

  /code-workspaces/{session_id}:
    parameters: [{ $ref: "#/components/parameters/CodeWorkspaceSessionId" }]
    delete:
      tags: [code-workspaces]
      operationId: closeCodeWorkspace
      summary: 释放阅读工作区与 Java 语义连接
      responses:
        "204": { description: 已关闭；重复关闭安全 }
        "403": { $ref: "#/components/responses/Forbidden" }

  /code-workspaces/{session_id}/bootstrap:
    parameters: [{ $ref: "#/components/parameters/CodeWorkspaceSessionId" }]
    get:
      tags: [code-workspaces]
      operationId: bootstrapCodeWorkspace
      summary: 嵌入页面读取固定的上游工作区配置
      responses:
        "200":
          description: 仅含同源代理路径和受限工作区元数据
          content: { application/json: { schema: { $ref: "#/components/schemas/CodeWorkspaceBootstrap" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /code-workspaces/{session_id}/view/{asset_path}:
    parameters:
      - { $ref: "#/components/parameters/CodeWorkspaceSessionId" }
      - { name: asset_path, in: path, required: true, schema: { type: string }, description: 相对静态资源路径；空路径返回嵌入应用入口 }
    get:
      tags: [code-workspaces]
      operationId: readCodeWorkspaceAsset
      summary: 按会话权限提供 Java 阅读界面与相对静态资源
      responses:
        "200": { description: HTML、JavaScript、CSS 或字体资源 }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /code-workspaces/{session_id}/gateway/{gateway_path}:
    parameters:
      - { $ref: "#/components/parameters/CodeWorkspaceSessionId" }
      - { name: gateway_path, in: path, required: true, schema: { type: string }, description: 仅接受此会话已绑定 workspace 的 Gateway 阅读路径 }
    get:
      tags: [code-workspaces]
      operationId: proxyCodeWorkspaceRead
      summary: 受限文件、搜索、工程信息与 Java LSP WebSocket 代理
      description: |
        上游路径限于 /api/v1/workspaces/{固定上游ID} 下的已知阅读端点。
        LSP 使用 WebSocket 升级，仍受工作区 URI jail 和只读方法限制。
        客户端不能创建其他上游工作区、发送写入请求或传入上游服务凭据。
      responses:
        "200": { description: 工作区阅读响应 }
        "101": { description: Java LSP WebSocket 已升级 }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { description: 上游服务退出或不可达，需重新打开会话 }

  /me:
    get:
      tags: [workspace]
      operationId: getCurrentUser
      summary: 当前用户、Workspace 权限与功能标记
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/CurrentUser" } } } }

  /workspaces:
    get:
      tags: [workspace]
      operationId: listWorkspaces
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceList" } } } }
    post:
      tags: [workspace]
      operationId: createWorkspace
      summary: 创建或打开一个绑定到受信本机项目目录的 Workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, project]
              properties:
                name: { type: string }
                timezone: { type: string }
                source_workspace_id: { type: string }
                project:
                  type: object
                  additionalProperties: false
                  required: [execution_host_id, mount_alias, mount_generation, repository_identity]
                  properties:
                    execution_host_id: { type: string }
                    mount_alias: { type: string }
                    mount_generation: { type: string }
                    repository_identity: { type: string }
      responses:
        "200": { description: 已存在的同一项目 Workspace；幂等复用 }
        "201": { description: 已创建 Workspace }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /workspaces/{workspace_id}:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    patch:
      tags: [workspace]
      operationId: updateWorkspace
      description: 更新名称、时区和策略；Owner/Admin。
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/WorkspacePatch" } } } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/Workspace" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
    get:
      tags: [workspace]
      operationId: getWorkspace
      summary: 读取 Workspace 与其绑定项目/setup 状态
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/Workspace" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{workspace_id}/bootstrap:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [workspace]
      operationId: bootstrapWorkspace
      summary: 首屏 dashboard、agents、board、health 与 event_cursor 一次返回
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/Bootstrap" } } } }

  /workspaces/{workspace_id}/dashboard:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [workspace]
      operationId: getDashboard
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/Dashboard" } } } }

  /workspaces/{workspace_id}/knowledge/config:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [knowledge-librarian]
      operationId: getKnowledgeLibrarianConfig
      summary: 读取 Workspace 的知识管理员配置
      description: 系统为每个 Workspace 自动提供唯一的内置 knowledge_librarian 身份；缺失配置会惰性创建为 enabled 默认值，不提供人工选择管理员身份。
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeLibrarianConfig" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [knowledge-librarian]
      operationId: updateKnowledgeLibrarianConfig
      summary: 更新知识管理员的 Enabled/AutoCollect 开关
      description: 管理员身份由系统固定；此处只更新启用和任务结束自动收集开关，运行方式与模型在内置 Agent Profile 上配置。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeLibrarianConfigPatch" }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeLibrarianConfig" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /workspaces/{workspace_id}/knowledge/items:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [knowledge-librarian]
      operationId: listKnowledgeItems
      summary: 使用 keyset 分页列出当前可见的知识条目
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/KnowledgeStatus" }
          description: 默认 effective；candidate/draft 等状态需要管理权限。
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: 可选全文检索词；为空时浏览，命中结果按条目 id keyset 分页并可返回 search_excerpt。
        - name: scope
          in: query
          required: false
          schema: { type: string, maxLength: 512 }
          description: 空值不加项目过滤；非空使用 key=value 或 JSON object。
        - name: kind
          in: query
          required: false
          schema: { type: string }
          description: 按知识类型筛选。
        - name: visibility
          in: query
          required: false
          schema: { $ref: "#/components/schemas/KnowledgeVisibility" }
          description: 按 private/workspace 筛选。
        - name: agent_id
          in: query
          required: false
          schema: { type: string }
          description: 管理员查看某 Agent 的私有视图；不是由调用者自填的所有权声明。
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
          description: 单页条目数；服务端使用 id 游标分页。
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeItemList" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{workspace_id}/knowledge/items/{item_id}:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/KnowledgeItemId" }
    get:
      tags: [knowledge-librarian]
      operationId: getKnowledgeItem
      summary: 读取条目当前版本和来源证据
      parameters:
        - { $ref: "#/components/parameters/KnowledgeAgentView" }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeItemBundle" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{workspace_id}/knowledge/items/{item_id}/versions:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/KnowledgeItemId" }
    get:
      tags: [knowledge-librarian]
      operationId: listKnowledgeVersions
      summary: 列出条目的不可变版本链
      parameters:
        - { $ref: "#/components/parameters/KnowledgeAgentView" }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeVersionList" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{workspace_id}/knowledge/items/{item_id}/versions/{version}:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/KnowledgeItemId" }
      - { $ref: "#/components/parameters/KnowledgeVersionSelector" }
    get:
      tags: [knowledge-librarian]
      operationId: getKnowledgeVersion
      summary: 读取指定数字版本或版本 ID
      parameters:
        - { $ref: "#/components/parameters/KnowledgeAgentView" }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeItemBundle" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{workspace_id}/knowledge/items/{item_id}/relations:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/KnowledgeItemId" }
    get:
      tags: [knowledge-librarian]
      operationId: listKnowledgeRelations
      summary: 读取条目的正向、反向或双向关系
      parameters:
        - name: direction
          in: query
          required: false
          schema: { $ref: "#/components/schemas/KnowledgeRelationDirection" }
          description: 默认 both。
        - { $ref: "#/components/parameters/KnowledgeAgentView" }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeRelationList" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{workspace_id}/knowledge/items/{item_id}/repeal:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/KnowledgeItemId" }
    post:
      tags: [knowledge-librarian]
      operationId: repealKnowledgeItem
      summary: 废止一个知识条目并保留历史版本
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/KnowledgeAgentView" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeRepealRequest" }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeItem" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /workspaces/{workspace_id}/knowledge/submissions:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [knowledge-librarian]
      operationId: listKnowledgeSubmissions
      summary: 列出候选提交收件箱（可能被截断）
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/KnowledgeSubmissionStatus" }
        - { $ref: "#/components/parameters/KnowledgeAgentView" }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeSubmissionList" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [knowledge-librarian]
      operationId: submitKnowledgeCandidate
      summary: 提交一批带来源的候选知识变化
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeSubmitCandidateRequest" }
      responses:
        "201": { content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeSubmission" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /workspaces/{workspace_id}/knowledge/submissions/{submission_id}:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/KnowledgeSubmissionId" }
    get:
      tags: [knowledge-librarian]
      operationId: getKnowledgeSubmission
      summary: 读取一个候选提交及其原始请求
      parameters:
        - { $ref: "#/components/parameters/KnowledgeAgentView" }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeSubmission" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{workspace_id}/knowledge/submissions/{submission_id}/curate:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/KnowledgeSubmissionId" }
    post:
      tags: [knowledge-librarian]
      operationId: curateKnowledgeSubmission
      summary: 启动一次候选整理作业
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/KnowledgeAgentView" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "201": { content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeJob" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /workspaces/{workspace_id}/knowledge/submissions/{submission_id}/publish:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/KnowledgeSubmissionId" }
    post:
      tags: [knowledge-librarian]
      operationId: publishKnowledgeSubmission
      summary: 发布已通过整理门的候选变化
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/KnowledgeAgentView" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeSubmission" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /workspaces/{workspace_id}/knowledge/inquiries:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    post:
      tags: [knowledge-librarian]
      operationId: createKnowledgeInquiry
      summary: 创建一次有界知识调查作业
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/KnowledgeAgentView" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeInquiryRequest" }
      responses:
        "201": { content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeJob" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /workspaces/{workspace_id}/knowledge/jobs:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [knowledge-librarian]
      operationId: listKnowledgeJobs
      summary: 列出当前可见的知识调查和整理作业（可能被截断）
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/KnowledgeJobStatus" }
        - { $ref: "#/components/parameters/KnowledgeAgentView" }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeJobList" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{workspace_id}/knowledge/jobs/{job_id}:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/KnowledgeJobId" }
    get:
      tags: [knowledge-librarian]
      operationId: getKnowledgeJob
      summary: 读取调查作业进度、覆盖和结果
      parameters:
        - { $ref: "#/components/parameters/KnowledgeAgentView" }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeJob" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{workspace_id}/knowledge/jobs/{job_id}/cancel:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/KnowledgeJobId" }
    post:
      tags: [knowledge-librarian]
      operationId: cancelKnowledgeJob
      summary: 取消一项尚未终态的知识作业
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKeyOptional" }
        - { $ref: "#/components/parameters/KnowledgeAgentView" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeJob" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /knowledge-agent/runs/{run_id}/items/{item_id}:
    parameters:
      - { $ref: "#/components/parameters/RunId" }
      - { $ref: "#/components/parameters/KnowledgeItemId" }
    get:
      security:
        - bearerAuth: []
      tags: [knowledge-librarian]
      operationId: readKnowledgeItemFromRun
      summary: Run-bound 读取条目当前版本
      description: 身份由活动 Run 和 Bearer token 推导，调用方不能用 query/body 改写 workspace 或 Agent 身份。
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeItemBundle" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /knowledge-agent/runs/{run_id}/items/{item_id}/versions/{version}:
    parameters:
      - { $ref: "#/components/parameters/RunId" }
      - { $ref: "#/components/parameters/KnowledgeItemId" }
      - { $ref: "#/components/parameters/KnowledgeVersionSelector" }
    get:
      security:
        - bearerAuth: []
      tags: [knowledge-librarian]
      operationId: readKnowledgeVersionFromRun
      summary: Run-bound 读取固定数字版本或版本 ID
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeItemBundle" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /knowledge-agent/runs/{run_id}/submissions:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    post:
      security:
        - bearerAuth: []
      tags: [knowledge-librarian]
      operationId: submitKnowledgeCandidateFromRun
      summary: Run-bound 提交任务后的知识候选
      description: server 从活动 Run 覆盖 workspace、agent、run 和 work_item 身份；请求中的同名字段会被覆盖。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKeyOptional" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeAgentSubmitCandidateRequest" }
      responses:
        "201": { content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeSubmission" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /knowledge-agent/runs/{run_id}/records:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    post:
      security:
        - bearerAuth: []
      tags: [knowledge-librarian]
      operationId: recordKnowledgeFromRun
      summary: Run-bound 提交自然语言知识记录并请求管理员整理
      description: |
        请求身份完全由当前活动 Run 的 Bearer capability 推导；客户端不能指定 workspace_id、agent_id 或 user_id。
        content/text 二选一。服务端创建既有 KnowledgeSubmission 和 curation KnowledgeJob。
        publish_intent=confirmed_requirement 仅表示调用 Agent 已获得用户确认；管理员仍需结构化并通过来源、权限、版本和冲突校验，不能据此声称实现已验证。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKeyOptional" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeAgentRecordRequest" }
      responses:
        "201": { content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeAgentRecordResult" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /knowledge-agent/runs/{run_id}/inquiries:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    post:
      security:
        - bearerAuth: []
      tags: [knowledge-librarian]
      operationId: createKnowledgeInquiryFromRun
      summary: Run-bound 创建知识调查
      description: requester、workspace、source_run 和 agent 由活动 Run 固定；作业取消跟随该 Run 的控制面。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKeyOptional" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeRunInquiryRequest" }
      responses:
        "201": { content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeJob" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /knowledge-agent/runs/{run_id}/jobs/{job_id}:
    parameters:
      - { $ref: "#/components/parameters/RunId" }
      - { $ref: "#/components/parameters/KnowledgeJobId" }
    get:
      security:
        - bearerAuth: []
      tags: [knowledge-librarian]
      operationId: getKnowledgeJobFromRun
      summary: Run-bound 读取调查作业
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeJob" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /knowledge-agent/runs/{run_id}/jobs/{job_id}/cancel:
    parameters:
      - { $ref: "#/components/parameters/RunId" }
      - { $ref: "#/components/parameters/KnowledgeJobId" }
    post:
      security:
        - bearerAuth: []
      tags: [knowledge-librarian]
      operationId: cancelKnowledgeJobFromRun
      summary: Run-bound 取消调查作业
      parameters: [{ $ref: "#/components/parameters/IdempotencyKeyOptional" }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeJob" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /workspaces/{workspace_id}/events:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [events]
      operationId: subscribeEvents
      summary: SSE 事件流；Last-Event-ID 补发；cursor 过期返回 410
      responses:
        "200":
          description: text/event-stream
          content: { text/event-stream: { schema: { type: string } } }
        "410": { $ref: "#/components/responses/CursorExpired" }

  /workspaces/{workspace_id}/coordinator:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [coordinator]
      operationId: getTaskCoordinatorConfig
      summary: 获取 Workspace 唯一系统 Task Coordinator 配置
      description: 只返回 runtime/model/reasoning；系统提示词仅暴露不可变版本，不返回正文。
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/CoordinatorConfig" } } } }
    patch:
      tags: [coordinator]
      operationId: updateTaskCoordinatorConfig
      summary: 更新 Coordinator 可配置底座
      description: 只允许 Codex/Kimi runtime、model、reasoning_effort 与备用配置；instructions/prompt 修改一律拒绝。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CoordinatorConfigPatch" } } } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/CoordinatorConfig" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { description: prompt/runtime/model 校验失败, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /workspaces/{workspace_id}/agent-profiles:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [agent-profiles]
      operationId: listAgentProfiles
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/AgentProfileList" } } } }
    post:
      tags: [agent-profiles]
      operationId: createAgentProfile
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AgentProfileCreate" } } } }
      responses:
        "201": { content: { application/json: { schema: { $ref: "#/components/schemas/AgentProfile" } } } }
        "202":
          description: Agent 已持久化，外部配置同步待恢复循环或 reload 重试
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/AgentProfile"
                  - type: object
                    required: [config_sync_pending]
                    properties:
                      config_sync_pending: { type: boolean, const: true }

  /agent-profiles/{agent_profile_id}:
    parameters: [{ $ref: "#/components/parameters/AgentProfileId" }]
    get:
      tags: [agent-profiles]
      operationId: getAgentProfile
      parameters:
        - name: include
          in: query
          schema: { type: string, example: "presence,current_run" }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/AgentProfile" } } } }
    patch:
      tags: [agent-profiles]
      operationId: updateAgentProfile
      description: 对内置 knowledge_librarian 身份，只允许更新 runtime_preference 和 model_override；名称、角色、技能、提示词与策略由系统固定并会被拒绝。
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AgentProfilePatch" } } } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/AgentProfile" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /agent-profiles/{agent_profile_id}/commands/enable:
    parameters: [{ $ref: "#/components/parameters/AgentProfileId" }]
    post:
      tags: [agent-profiles]
      operationId: enableAgentProfile
      description: 允许被调度；不等于立刻运行。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/AgentProfile" } } } }

  /agent-profiles/{agent_profile_id}/commands/disable:
    parameters: [{ $ref: "#/components/parameters/AgentProfileId" }]
    post:
      tags: [agent-profiles]
      operationId: disableAgentProfile
      description: 停止新调度；活动 Run 按策略 interrupt（默认）。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: "#/components/schemas/DisableOptions" } } } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/AgentProfile" } } } }

  /workspaces/{workspace_id}/work-items:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [work-items]
      operationId: listWorkItems
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: priority, in: query, schema: { type: string } }
        - { name: assignee, in: query, schema: { type: string } }
        - name: record_kind
          in: query
          required: false
          schema: { type: string, enum: [chat, task] }
          description: 缺省为 task；Chat 与 Task 列表不得混读，Chat 调用方必须显式传 chat。
        - name: parent_id
          in: query
          required: false
          schema: { type: string }
          description: 缺省不过滤；值 `none` 只看根任务（无父链接）。
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkItemList" } } } }
    post:
      tags: [work-items]
      operationId: createWorkItem
      description: |
        创建工作项。公开调用省略 record_kind 时按 Task 处理，并由系统 Task
        Coordinator 自动接取根 Task；调用方不得关闭该交接或指定 Worker。
        根 Task 的初始 status 只能省略或为 todo，in_progress/blocked/completed/cancelled
        均返回 422，避免绕过 Coordinator 与人工验收。Chat 必须显式传 record_kind=chat，
        并保留其独立记录语义。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/WorkItemCreate" } } } }
      responses:
        "201": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkItem" } } } }
        "422": { description: record_kind/Task assignment/根 Task 初始状态校验失败, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /work-items/{work_item_id}:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    get:
      tags: [work-items]
      operationId: getWorkItem
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/PublicationPublishResponse" } } } }
    patch:
      tags: [work-items]
      operationId: updateWorkItem
      description: 普通字段修改；status 不允许任意 PATCH。
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/WorkItemPatch" } } } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkItem" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /work-items/{work_item_id}/sources:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    get:
      tags: [work-items]
      operationId: listChatSources
      summary: 列出当前 Chat 的原件元数据
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ChatSourceList" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [work-items]
      operationId: uploadChatSource
      summary: 上传 Chat 原件；服务端保存原件并返回 opaque source 元数据
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                client_key: { type: string }
                file: { type: string, format: binary }
      responses:
        "201": { content: { application/json: { schema: { $ref: "#/components/schemas/ChatSource" } } } }
        "200": { description: 逻辑 client_key 重放；同一 source 元数据, content: { application/json: { schema: { $ref: "#/components/schemas/ChatSource" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }

  /work-items/{work_item_id}/sources/{source_id}:
    parameters:
      - { $ref: "#/components/parameters/WorkItemId" }
      - { name: source_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [work-items]
      operationId: getChatSource
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ChatSource" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /work-items/{work_item_id}/sources/{source_id}/download:
    parameters:
      - { $ref: "#/components/parameters/WorkItemId" }
      - { name: source_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [work-items]
      operationId: downloadChatSource
      summary: 通过同源受控流下载原件；不返回本机路径或 opaque key
      responses:
        "200": { description: 原始附件字节 }
        "404": { $ref: "#/components/responses/NotFound" }

  /work-items/{work_item_id}/commands/assign:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    post:
      tags: [work-items]
      operationId: assignWorkItem
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_profile_id, expected_version]
              properties:
                agent_profile_id: { type: string }
                expected_version: { type: integer }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkItem" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /work-items/{work_item_id}/commands/move:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    post:
      tags: [work-items]
      operationId: moveWorkItem
      description: 看板移动、排序与状态机校验。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, expected_version]
              properties:
                status: { $ref: "#/components/schemas/WorkItemStatus" }
                expected_version: { type: integer }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkItem" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /work-items/{work_item_id}/commands/claim:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    post:
      tags: [work-items]
      operationId: claimWorkItem
      description: |
        M4 认领命令（发布 → 领取）：仅 todo 且当前无 assignee 可认领。
        认领 = 指派 + 按目标 agent WakeOnAssignment 入队 assignment 唤醒；
        同 agent 重复认领幂等返回现状；已有 assignee 或非 todo → 409。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, expected_version]
              properties:
                agent_id: { type: string, description: 认领者 agent profile id }
                expected_version: { type: integer }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkItem" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /work-items/{work_item_id}/commands/return:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    post:
      tags: [work-items]
      operationId: returnWorkItem
      description: |
        手动打回（验收回流人工半环）：in_progress 且 phase=acceptance/review
        时合法 → phase=execution；其余 phase → 409。reason 必填（trim 后为空返回
        422 review_feedback_required），并生成不可变 review_feedback TaskComment：
        coordinated root 在同一事务完成 WorkItem BeginExecution + Coordinator
        waiting_user→queued；coordinated child 拒绝（409 child_review_not_supported），
        历史非 Coordinator Task 保留旧回流行为但不创建 TaskComment。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, expected_version]
              properties:
                reason: { type: string, minLength: 1, description: 打回原因（必填；生成不可变 review_feedback comment 并落 activity） }
                expected_version: { type: integer }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkItem" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /work-items/{work_item_id}/commands/block:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    post:
      tags: [work-items]
      operationId: blockWorkItem
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, message, expected_version]
              properties:
                code: { type: string }
                message: { type: string }
                source: { type: string }
                expected_version: { type: integer }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkItem" } } } }

  /work-items/{work_item_id}/commands/unblock:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    post:
      tags: [work-items]
      operationId: unblockWorkItem
      description: 解除阻塞回到 in_progress；同事务恢复 Goal/Todo 与 Coordinator durable queued，提交后由 Coordinator 自动创建新 Run。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version]
              properties:
                expected_version: { type: integer }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkItem" } } } }

  /work-items/{work_item_id}/tree:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    get:
      tags: [plans]
      operationId: getWorkItemTree
      summary: 以该任务为根的整棵子树（先序；DTO 带 parent_id）
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkItemTree" } } } }

  /work-items/{work_item_id}/plan:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    get:
      tags: [plans]
      operationId: getWorkItemPlan
      summary: 该主任务最新一份 plan（created_at 最新，不限状态）；无 plan 404
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/Plan" } } } }
        "404": { description: 该任务尚无 plan, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /work-items/{work_item_id}/coordinator:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    get:
      tags: [coordinator]
      operationId: getTaskCoordinatorSnapshot
      summary: Task Coordinator 控制线快照
      description: 仅 Task 可见；Chat 记录返回 validation_failed，不泄漏任务控制线。
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/CoordinatorSnapshot" } } } }
        "404": { description: 尚未创建 Coordinator state, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: Chat 不属于任务控制线, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /work-items/{work_item_id}/coordinator/events:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    get:
      tags: [coordinator]
      operationId: listTaskCoordinatorEvents
      summary: Task Coordinator 因果时间线
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/CoordinatorTimelineList" } } } }
        "422": { description: Chat 不属于任务控制线, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /workspaces/{workspace_id}/plans:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    post:
      tags: [plans]
      operationId: createPlan
      description: |
        提交并同步执行一份 plan（dispatch/defer/finish）。同一 work item 唯一
        active/waiting plan：active 拒绝、waiting 同事务 supersede。
        verb 未知 / defer 非法 / 校验失败 → 400 problem+json（plan 不落库）。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PlanSubmit" } } } }
      responses:
        "201": { content: { application/json: { schema: { $ref: "#/components/schemas/Plan" } } } }
        "400": { description: verb 未知 / defer 无出口 / 字段校验失败, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /plans/{plan_id}:
    parameters: [{ $ref: "#/components/parameters/PlanId" }]
    get:
      tags: [plans]
      operationId: getPlan
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/Plan" } } } }

  /work-items/{work_item_id}/runs:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    get:
      tags: [runs]
      operationId: listWorkItemRuns
      summary: 一个任务的全部 Run（对话轮次历史；不可覆盖的执行尝试）
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ExecutionRunList" } } } }
    post:
      tags: [runs]
      operationId: createRun
      description: 创建 ExecutionRun；立即 202，真正开始执行由 SSE 事件确认。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }, { $ref: "#/components/parameters/IfMatch" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RunCreate" } } } }
      responses:
        "202": { content: { application/json: { schema: { $ref: "#/components/schemas/RunAccepted" } } } }

  /work-items/{work_item_id}/analysis:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    get:
      tags: [chat-analysis]
      operationId: getChatAnalysis
      summary: Chat 需求分析的当前持久投影（无分析时为 idle）
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ChatAnalysis" } } } }

  /work-items/{work_item_id}/analysis/answers:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    post:
      tags: [chat-analysis]
      operationId: saveChatAnalysisAnswer
      summary: 保存当前单题回答并推进到下一题
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ChatAnalysisAnswerCreate" } } } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ChatAnalysis" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /work-items/{work_item_id}/analysis/decisions:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    post:
      tags: [chat-analysis]
      operationId: saveChatAnalysisDecision
      summary: 回填一条明确的产品结论
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ChatAnalysisDecisionCreate" } } } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ChatAnalysis" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /work-items/{work_item_id}/analysis/history:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    get:
      tags: [chat-analysis]
      operationId: getChatAnalysisHistory
      summary: 查看有界的分析、回答、产品结论和重开历史
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ChatAnalysisHistory" } } } }

  /work-items/{work_item_id}/analysis/recheck:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    post:
      tags: [chat-analysis]
      operationId: recheckChatAnalysis
      summary: 重新核对当前分析引用的材料和版本
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ChatAnalysisRecheck" } } } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ChatAnalysis" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /work-items/{work_item_id}/analysis/drafts:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    get:
      tags: [task-publication]
      operationId: listPublicationDrafts
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/PublicationDraftList" } } } }
    post:
      tags: [task-publication]
      operationId: createPublicationDraft
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PublicationDraftCreate" } } } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/PublicationDraft" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /work-items/{work_item_id}/analysis/drafts/{draft_id}:
    parameters:
      - { $ref: "#/components/parameters/WorkItemId" }
      - { name: draft_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [task-publication]
      operationId: getPublicationDraft
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/PublicationDraft" } } } }

  /work-items/{work_item_id}/analysis/drafts/{draft_id}/recheck:
    parameters:
      - { $ref: "#/components/parameters/WorkItemId" }
      - { name: draft_id, in: path, required: true, schema: { type: string } }
    post:
      tags: [task-publication]
      operationId: recheckPublicationDraft
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PublicationRecheck" } } } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/PublicationDraft" } } } }

  /work-items/{work_item_id}/analysis/drafts/{draft_id}/publish:
    parameters:
      - { $ref: "#/components/parameters/WorkItemId" }
      - { name: draft_id, in: path, required: true, schema: { type: string } }
    post:
      tags: [task-publication]
      operationId: publishPublicationDraft
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PublicationPublish" } } } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/PublicationPublishResponse" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /work-items/{work_item_id}/dispatches:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    get:
      tags: [work-items]
      operationId: listWorkItemDispatches
      summary: 派发卡片时间线（批次 + 成员 runs 摘要 + 触发消息摘录；新→旧）
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/DispatchCardList" } } } }

  /work-items/{work_item_id}/decisions:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    get:
      tags: [work-items]
      operationId: listWorkItemDecisions
      summary: 决策台账（用户原话引文；创建时间升序；只读投影）
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/DecisionList" } } } }
    post:
      tags: [work-items]
      operationId: recordWorkItemDecision
      description: 决策原话落台账（S2）。quote 必填且 trim 后非空；source_run_id 可选但必须属于该 work item。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DecisionCreate" } } } }
      responses:
        "201": { content: { application/json: { schema: { $ref: "#/components/schemas/DecisionEntry" } } } }
        "422": { description: quote 为空 / source_run_id 不存在或不属于该任务, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { description: 任务不存在, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /runs/{run_id}:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    get:
      tags: [runs]
      operationId: getRun
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ExecutionRun" } } } }

  /runs/{run_id}/events:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    get:
      tags: [runs]
      operationId: listRunEvents
      summary: 回放 Run 事件历史（对话页消息重建；只读投影，按 run_seq 排序）
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/RunEventList" } } } }

  /runs/{run_id}/journal:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    get:
      tags: [runs]
      operationId: getRunJournal
      summary: Run Journal 调试投影（环节时间线 + 原始输出统计 + 治理 receipt 互链；internal 事件投影，不进对话回放/SSE；只读）
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/RunJournal" } } } }
        "404": { description: Run 不存在, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /runs/{run_id}/commands/input:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    post:
      tags: [runs]
      operationId: sendRunInput
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instruction]
              properties:
                instruction: { type: string }
      responses:
        "202": { description: 命令已接受 }

  /runs/{run_id}/commands/interrupt:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    post:
      tags: [runs]
      operationId: interruptRun
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses: { "202": { description: 命令已接受 } }

  /runs/{run_id}/commands/cancel:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    post:
      tags: [runs]
      operationId: cancelRun
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses: { "202": { description: 命令已接受 } }

  /runs/{run_id}/commands/retry:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    post:
      tags: [runs]
      operationId: retryRun
      description: 总是创建新 Run（retry_of=当前 run），不覆盖终态；返回完整 ExecutionRun。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "202": { content: { application/json: { schema: { $ref: "#/components/schemas/ExecutionRun" } } } }

  /runs/{run_id}/commands/resume:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    post:
      tags: [runs]
      operationId: resumeRun
      description: 仅在能力声明 resume 时可用，否则 422。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "202": { description: 命令已接受 }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /runs/{run_id}/approvals:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    get:
      tags: [approvals]
      operationId: listApprovals
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalList" } } } }

  /runs/{run_id}/approvals/{approval_id}/commands/resolve:
    parameters: [{ $ref: "#/components/parameters/RunId" }, { $ref: "#/components/parameters/ApprovalId" }]
    post:
      tags: [approvals]
      operationId: resolveApproval
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approved, rejected] }
                reason: { type: string }
                scope:
                  type: string
                  enum: [once, thread, workspace]
                  default: once
                  description: >-
                    决议作用域。approved 且 scope=thread/workspace 时创建「总是允许」
                    授权：后续同 workspace/agent/kind（thread 另要求同 work item）
                    且摘要前缀命中的审批请求自动代答批准（activity 可追溯）。
                    仅 command/file_change/permissions 支持（其余 kind 返回 422）；
                    拒绝忽略 scope，缺省等价 once。
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/Approval" } } } }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /runs/{run_id}/questions:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    get:
      tags: [questions]
      operationId: listQuestions
      description: 读取当前 Run 尚未完成的原生 AskUserQuestion 交互。
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/QuestionList" } } } }

  /runs/{run_id}/questions/{question_id}/commands/resolve:
    parameters: [{ $ref: "#/components/parameters/RunId" }, { $ref: "#/components/parameters/QuestionId" }]
    post:
      tags: [questions]
      operationId: resolveQuestion
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers: { type: object, additionalProperties: true }
                method: { type: string, enum: [enter, space, number_key, click] }
                note: { type: string }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/Question" } } } }

  /runs/{run_id}/questions/{question_id}/commands/dismiss:
    parameters: [{ $ref: "#/components/parameters/RunId" }, { $ref: "#/components/parameters/QuestionId" }]
    post:
      tags: [questions]
      operationId: dismissQuestion
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/Question" } } } }

  /runs/{run_id}/artifacts:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    get:
      tags: [artifacts]
      operationId: listArtifacts
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ArtifactList" } } } }

  /runs/{run_id}/artifacts/{artifact_id}/commands/accept:
    parameters:
      - { $ref: "#/components/parameters/RunId" }
      - { $ref: "#/components/parameters/ArtifactId" }
    post:
      tags: [artifacts]
      operationId: acceptArtifact
      summary: 接受一个 Run 产物作为验收证据
      description: 仅 reviewer 可执行；Artifact 必须属于 path 中的 Run，accepted 之后不可回退。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/Artifact" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /runs/{run_id}/changes:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    get:
      tags: [runs]
      operationId: getRunChanges
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/RunChanges" } } } }

  /runs/{run_id}/changes/diff:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    get:
      tags: [runs]
      operationId: getRunChangeDiff
      parameters: [{ name: path, in: query, required: true, schema: { type: string } }]
      responses: { "200": { content: { application/json: { schema: { type: object, required: [path, diff], properties: { path: { type: string }, diff: { type: string }, truncated: { type: boolean }, binary: { type: boolean } } } } } } }

  /runs/{run_id}/commands/revert-changes:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    post:
      tags: [runs]
      operationId: revertRunChanges
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotency_key]
              properties: { idempotency_key: { type: string } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/RunChanges" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /workspaces/{workspace_id}/activities:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [workspace]
      operationId: listActivities
      parameters: [{ $ref: "#/components/parameters/Cursor" }]
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ActivityList" } } } }

  /workspaces/{workspace_id}/search:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [workspace]
      operationId: searchWorkspace
      summary: FTS 检索（片段摘要/决策台账/产物标题；snippet 带 [] 高亮标记）
      description: 索引为派生存储（定点重写），q 为空或纯符号返回空 items；不发 SSE 事件。
      parameters:
        - { name: q, in: query, required: true, schema: { type: string }, description: 检索词（空格分词 AND 语义） }
        - { name: record_kind, in: query, required: false, schema: { type: string, enum: [task] }, description: 缺省或 task；Chat 记录不属于任务搜索面 }
        - { name: work_item_id, in: query, schema: { type: string }, description: 可选，限定单任务 }
        - { name: kind, in: query, schema: { type: string, enum: [segment_summary, decision, artifact] } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/SearchList" } } } }

  /workspaces/{workspace_id}/runtime-bindings:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [runtime-bindings]
      operationId: listRuntimeBindings
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/RuntimeBindingList" } } } }
    post:
      tags: [runtime-bindings]
      operationId: createRuntimeBinding
      description: 添加 Runtime 与模型配置（provider/model/CredentialRef）；凭据只存引用。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [runtime_label, adapter_id]
              properties:
                runtime_label: { type: string }
                adapter_id: { type: string }
                provider: { type: string }
                model: { type: string }
                credential_ref: { type: string }
      responses:
        "201": { content: { application/json: { schema: { $ref: "#/components/schemas/RuntimeBinding" } } } }

  /runtime-bindings/{runtime_binding_id}:
    parameters: [{ $ref: "#/components/parameters/RuntimeBindingId" }]
    patch:
      tags: [runtime-bindings]
      operationId: patchRuntimeBinding
      description: 修改模型配置（provider/model/credential_ref），乐观锁保护。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version]
              properties:
                provider: { type: string }
                model: { type: string }
                credential_ref: { type: string }
                expected_version: { type: integer }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/RuntimeBinding" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /runtime-bindings/{runtime_binding_id}/commands/probe:
    parameters: [{ $ref: "#/components/parameters/RuntimeBindingId" }]
    post:
      tags: [runtime-bindings]
      operationId: probeRuntimeBinding
      description: 探测版本、认证、协议与能力；不启动业务 Run。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "202": { content: { application/json: { schema: { $ref: "#/components/schemas/ProbeResult" } } } }

  /workspaces/{workspace_id}/agent-config/reload:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    post:
      tags: [agent-profiles]
      operationId: reloadAgentConfig
      summary: 重扫 agents/ 配置目录并导入 DB 投影（文件为真相源）
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/AgentConfigReloadResult" } } } }

  /models:
    get:
      tags: [models]
      operationId: listModels
      summary: 模型注册表列表（models/ 目录为真相源，全局共享不按 Workspace 隔离）
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ModelEntryList" } } } }
    post:
      tags: [models]
      operationId: createModel
      description: 新建模型条目；id 可空（由 display_name 生成 slug）。凭据只传环境变量名，绝不传密钥明文。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ModelUpsert" } } } }
      responses:
        "201": { content: { application/json: { schema: { $ref: "#/components/schemas/ModelEntry" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /models/{model_id}:
    parameters: [{ $ref: "#/components/parameters/ModelId" }]
    put:
      tags: [models]
      operationId: updateModel
      description: 全量替换模型条目（PUT 幂等语义；path id 为权威）。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ModelUpsert" } } } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ModelEntry" } } } }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [models]
      operationId: deleteModel
      description: 删除模型条目（幂等；引用它的 Agent 在下次创建 Run 时将收到 422）。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKeyOptional" }]
      responses:
        "204": { description: 已删除 }

  /health:
    get:
      tags: [workspace]
      operationId: getHealth
      summary: 分层健康投影（System Online 不是固定文案；含 runners 概览）
      security: []
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/HealthStatus" } } } }

  /agent-profiles/{agent_profile_id}/commands/wake:
    parameters: [{ $ref: "#/components/parameters/AgentProfileId" }]
    post:
      tags: [agent-profiles]
      operationId: wakeAgent
      summary: 手动唤醒（on_demand 源）；入队后由调度循环消费（≤一个 tick）并创建 run
      description: |
        agent 未开启 wake_on_demand 时返回 422。coalescing（活跃 run 期间合并）由
        调度循环统一判定；唤醒审计见 agent_wakeup_requests（consumed/coalesced）。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_key]
              properties:
                task_key: { type: string, description: 唤醒锚定的 work item id }
                instruction: { type: string, description: 显式指令；渲染时优先于 prompt_template }
                context:
                  type: object
                  additionalProperties: true
                  description: 附加唤醒上下文（合并进 wake context）
      responses:
        "202":
          content:
            application/json:
              schema:
                type: object
                required: [wakeup_id, status, wake_at]
                properties:
                  wakeup_id: { type: string }
                  status: { type: string, enum: [queued] }
                  wake_at: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /agent-profiles/{agent_profile_id}/task-sessions:
    parameters: [{ $ref: "#/components/parameters/AgentProfileId" }]
    get:
      tags: [agent-profiles]
      operationId: listTaskSessions
      summary: Agent 名下跨 Run 会话锚点（墓碑行不返回；session_params 保留 __ref/__fingerprint 供诊断）
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TaskSession" }

  /agent-profiles/{agent_profile_id}/task-sessions/reset:
    parameters: [{ $ref: "#/components/parameters/AgentProfileId" }]
    post:
      tags: [agent-profiles]
      operationId: resetTaskSession
      summary: 重置会话锚点（写墓碑；下一轮 Run 开新会话且不会被播种兜底复活）
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_key, adapter_id]
              properties:
                task_key: { type: string, description: 通常是 work item ID }
                adapter_id: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [reset] }
        "404": { $ref: "#/components/responses/Conflict" }

  /work-items/{work_item_id}/commands/accept:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    post:
      tags: [work-items]
      operationId: acceptWorkItem
      description: |
        验收根 Task（acceptance 决议；漂移检测后接受当前状态）。存在
        Coordinator 控制线时只有根 WorkItem 可验收并完成该控制线；协调子任务
        直接返回 422，不能单独完成根任务。无 Coordinator 的历史 Task 保留原有验收语义。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version]
              properties:
                expected_version: { type: integer }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkItem" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /models/provider-credentials:
    get:
      tags: [models]
      operationId: getProviderCredential
      summary: 读取 provider API Key 配置状态（写后不可读；需 runtime.manage 权限；模型注册表未启用时 404）
      parameters:
        - name: provider_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                description: |
                  凭据状态投影。写后不可读：任何分支都绝不返回 api_key 明文。
                  未配置：{"configured": false}；
                  已配置：{"configured": true, "masked_hint": "<末4位提示>", "length": <明文总长度>}。
                required: [configured]
                properties:
                  configured: { type: boolean }
                  masked_hint: { type: string, description: 仅已配置时携带；掩码提示（明文末 4 位） }
                  length: { type: integer, description: 仅已配置时携带；明文总长度 }
        "404": { $ref: "#/components/responses/Conflict" }
    put:
      tags: [models]
      operationId: putProviderCredential
      summary: 保存 provider API Key 到本地凭据存储
      parameters: [{ $ref: "#/components/parameters/IdempotencyKeyOptional" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider_id, api_key]
              properties:
                provider_id: { type: string }
                api_key: { type: string }
      responses:
        "204": { description: 已保存 }
        "404": { $ref: "#/components/responses/Conflict" }

  /runtimes/dsh/catalog:
    get:
      tags: [runtime-bindings]
      operationId: getDshCatalog
      summary: DSH harness 预设目录（agent_presets / permission_presets；本地仓库扫描）
      security: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [agent_presets, permission_presets]
                properties:
                  agent_presets:
                    type: array
                    items: { type: object, additionalProperties: true }
                  permission_presets:
                    type: array
                    items: { type: object, additionalProperties: true }

  # ── 任务控制面补全（task-control-surface RFC §9）──────────────────────
  # 执行上下文（ExecutionHost / WorkspaceLocation / DevelopmentContext /
  # ExecutionContextSnapshot）、任务反馈（TaskComment）与验收读模型
  #（Review Queue / Delivery Brief）。实现接线前 guard 测试保持红灯。

  /execution-hosts:
    get:
      tags: [execution-hosts]
      operationId: listExecutionHosts
      summary: 执行宿主列表（稳定 Host identity；含本机 host_local）
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ExecutionHostList" } } } }
    post:
      tags: [execution-hosts]
      operationId: createExecutionHost
      description: |
        Workspace admin 创建稳定远程 Host identity，一次性返回 enrollment credential；
        服务端只保存 credential ref/hash，绝不回显明文。`host_local` 由 Control Plane
        启动时确保存在，不可通过 API 创建。Runner bearer credential 的 subject 固定
        绑定该 host_id。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind]
              additionalProperties: false
              properties:
                name: { type: string }
                kind: { type: string, enum: [remote], description: 只允许 remote；local 由系统内置 }
      responses:
        "201": { content: { application/json: { schema: { $ref: "#/components/schemas/ExecutionHostEnrollment" } } } }

  /execution-hosts/{host_id}/commands/rotate-credential:
    parameters: [{ $ref: "#/components/parameters/ExecutionHostId" }]
    post:
      tags: [execution-hosts]
      operationId: rotateExecutionHostCredential
      description: 轮换 Runner enrollment credential；旧凭据与旧 connection epoch 立即失效。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ExecutionHostEnrollment" } } } }
        "404": { $ref: "#/components/responses/Conflict" }

  /execution-hosts/{host_id}/mounts:
    parameters: [{ $ref: "#/components/parameters/ExecutionHostId" }]
    get:
      tags: [execution-hosts]
      operationId: listExecutionHostMounts
      summary: Host 本地受信 registry 的广告投影
      description: 只含 alias/repository_identity/generation/checkouts；Host 本地绝对路径不是业务字段，永不返回。
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/HostMountList" } } } }
        "404": { $ref: "#/components/responses/Conflict" }

  /workspaces/{workspace_id}/locations:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [workspace-locations]
      operationId: listWorkspaceLocations
      summary: Workspace 的受信代码位置（含默认位置）
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceLocationList" } } } }
    post:
      tags: [workspace-locations]
      operationId: createWorkspaceLocation
      description: |
        把 Workspace 绑定到 Host 已广告且 repository identity 匹配的 mount。
        只接受 execution_host_id / mount_alias / repository_identity / is_default；
        不接受 path / cwd / root_path（schema additionalProperties: false，携带越权
        字段返回 403 workspace_path_forbidden）。mount 未广告 → 422
        workspace_mount_not_advertised；广告 generation 与预期不符 → 409
        workspace_mount_generation_changed；多默认冲突 → 409
        workspace_location_ambiguous。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceLocationCreate" }
      responses:
        "201": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceLocation" } } } }
        "403": { description: 请求含越权 path/cwd 字段, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /workspace-locations/{location_id}:
    parameters: [{ $ref: "#/components/parameters/WorkspaceLocationId" }]
    patch:
      tags: [workspace-locations]
      operationId: updateWorkspaceLocation
      description: |
        显式命令修改 identity/default；status 随 Host/Mount 健康投影自动变化，
        不经此命令。必须携带 expected_version 与预期 mount_generation；广告
        generation 已变化返回 409 workspace_mount_generation_changed。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceLocationPatch" }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceLocation" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /workspace-locations/{location_id}/commands/probe:
    parameters: [{ $ref: "#/components/parameters/WorkspaceLocationId" }]
    post:
      tags: [workspace-locations]
      operationId: probeWorkspaceLocation
      description: 触发 Host/Mount 可用性探测并刷新 status 投影；不创建 Run。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "202": { content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceLocationProbeResult" } } } }
        "404": { $ref: "#/components/responses/Conflict" }

  /work-items/{work_item_id}/development-context:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    get:
      tags: [work-items]
      operationId: getDevelopmentContext
      summary: WorkItem 的有效开发选择（逻辑 context，不是已解析 cwd）
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/DevelopmentContext" } } } }
        "404": { $ref: "#/components/responses/Conflict" }

  /work-items/{work_item_id}/commands/set-development-context:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    post:
      tags: [work-items]
      operationId: setDevelopmentContext
      description: |
        修改开发上下文并开启新 context generation；已有 Run/snapshot 不回写。
        根 Task 必须显式拥有 context；子 Task 第一版不能改变
        workspace_location_id，只能在根 Location 内覆盖 branch/worktree。
        存在非终态 Run → 409 development_context_busy；waiting_user 修改会触发
        Task BeginExecution + Coordinator queued；completed/cancelled 不可修改。
        不接受 path/cwd/absolute_path（403 workspace_path_forbidden）。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetDevelopmentContextCommand" }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/DevelopmentContext" } } } }
        "403": { description: 请求含越权 path/cwd 字段, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /runs/{run_id}/execution-context:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    get:
      tags: [runs]
      operationId: getRunExecutionContext
      summary: Run 创建时冻结的不可变 ExecutionContextSnapshot（只读）
      description: 返回逻辑 Snapshot 与 Host/Mount 状态；绝对 cwd 仅在本机 admin 视图按策略展示，不进入普通 DTO。
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ExecutionContextSnapshot" } } } }
        "404": { $ref: "#/components/responses/Conflict" }

  /work-items/{work_item_id}/comments:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    get:
      tags: [work-items]
      operationId: listWorkItemComments
      summary: 根 Task 维度的 append-only 评论流（revision 正序分页）
      parameters:
        - name: after_revision
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: 返回 revision 大于该值的评论；非法值返回 400 comment_cursor_invalid
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/TaskCommentList" } } } }
        "400": { description: after_revision 非法, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
    post:
      tags: [work-items]
      operationId: createTaskComment
      description: |
        追加任务反馈评论；kind 只接受 note|requirement（review_feedback 只能由
        return 命令生成）。note 不触发 Coordinator；requirement 是 actionable，
        waiting_user 到达时原子回 execution/queued。HTTP Idempotency-Key 防同一
        请求重复执行并重放原 comment/revision；client_key 防业务意图重复，同 key
        不同 body 返回 409 idempotency_conflict。历史非 Coordinator Task 返回
        409 comment_coordinator_required。本 API 取代并删除旧
        POST /work-items/{id}/coordinator/messages。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskCommentCreate" }
      responses:
        "201": { content: { application/json: { schema: { $ref: "#/components/schemas/TaskComment" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { description: body 超过 16 KiB（comment_body_too_large）, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { $ref: "#/components/responses/Unprocessable" }

  # Native governance read/command surface. Every route below is backed by a
  # canonical application Service; the web client consumes these read models
  # without recomputing governance state.
  /workspaces/{workspace_id}/governance/metrics:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [governance]
      operationId: getGovernanceMetrics
      summary: 获取 Workspace 治理指标
      description: 从 canonical workspace event stream 与 Goal/receipt/quota/Run 权威事实重算治理指标；不依赖进程内计数器。
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/GovernanceMetrics" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /workspaces/{workspace_id}/goals:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [goals]
      operationId: listGoals
      summary: 列出 Workspace 的治理 Goal
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/GoalList" } } } }

  /workspaces/{workspace_id}/goals/{goal_id}:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/GoalId" }
    get:
      tags: [goals]
      operationId: getGoal
      summary: 获取治理 Goal
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/Goal" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{workspace_id}/goals/{goal_id}/commands/start:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/GoalId" }
    post:
      tags: [goals]
      operationId: startGoal
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/GovernanceVersionCommand" } } } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/Goal" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /workspaces/{workspace_id}/goals/{goal_id}/commands/pause:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/GoalId" }
    post:
      tags: [goals]
      operationId: pauseGoal
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/GovernanceVersionCommand" } } } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/Goal" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /workspaces/{workspace_id}/goals/{goal_id}/commands/resume:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/GoalId" }
    post:
      tags: [goals]
      operationId: resumeGoal
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/GovernanceVersionCommand" } } } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/Goal" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /workspaces/{workspace_id}/goals/{goal_id}/commands/cancel:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/GoalId" }
    post:
      tags: [goals]
      operationId: cancelGoal
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/GovernanceVersionCommand" } } } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/Goal" } } } }
        "202":
          description: Goal 已提交取消；外部 Run/配额清理由 durable recovery checkpoint 继续处理，同一 Idempotency-Key 可安全重放。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoalCancellationAccepted" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /workspaces/{workspace_id}/goals/{goal_id}/todos:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/GoalId" }
    get:
      tags: [goals]
      operationId: listGoalTodos
      summary: 列出 Goal 的治理 Todo
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/TodoList" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{workspace_id}/todos/{todo_id}:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/TodoId" }
    get:
      tags: [todos]
      operationId: getTodo
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/Todo" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{workspace_id}/todos/{todo_id}/commands/claim:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/TodoId" }
    post:
      tags: [todos]
      operationId: claimTodo
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TodoClaimCommand" } } } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/Todo" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /workspaces/{workspace_id}/todos/{todo_id}/commands/release:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/TodoId" }
    post:
      tags: [todos]
      operationId: releaseTodo
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TodoReleaseCommand" } } } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/Todo" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /workspaces/{workspace_id}/todos/{todo_id}/commands/resolve-user-action:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/TodoId" }
    post:
      tags: [todos]
      operationId: resolveTodoUserAction
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TodoUserActionCommand" } } } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/Todo" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /workspaces/{workspace_id}/goals/{goal_id}/quota:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/GoalId" }
    get:
      tags: [goals]
      operationId: getGoalQuota
      summary: 获取 Goal 配额策略、已用、冻结与 unresolved 摘要
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/GoalQuota" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{workspace_id}/goals/{goal_id}/quota/reconciliations:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/GoalId" }
    get:
      tags: [goals]
      operationId: listQuotaGapReconciliations
      summary: 列出 Goal 的不可变 usage 缺口对账裁决
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/QuotaGapResolutionList" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [goals]
      operationId: reconcileQuotaGap
      summary: 以已通过或已接受的权威证据追加 usage 缺口对账
      description: v1 仅支持 reconciled，不提供 waiver；原 spend、Run canonical usage 与 reservation 均不修改。
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuotaGapReconciliationCreate" }
      responses:
        "201": { content: { application/json: { schema: { $ref: "#/components/schemas/QuotaGapResolution" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /workspaces/{workspace_id}/goals/{goal_id}/todos/{todo_id}/turns/{turn_seq}:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/GoalId" }
      - { $ref: "#/components/parameters/TodoId" }
      - { $ref: "#/components/parameters/TurnSeq" }
    get:
      tags: [goals]
      operationId: getTurnReceipt
      summary: 获取一个治理 Turn 的不可变 Receipt Header/Phase
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/TurnReceipt" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{workspace_id}/goals/{goal_id}/todos/{todo_id}/turns/{turn_seq}/quota:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/GoalId" }
      - { $ref: "#/components/parameters/TodoId" }
      - { $ref: "#/components/parameters/TurnSeq" }
    get:
      tags: [goals]
      operationId: getTurnQuota
      summary: 获取一个治理 Turn 的 reservation/spend
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/QuotaTurn" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{workspace_id}/work-items/{work_item_id}/goal:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/WorkItemId" }
    get:
      tags: [goals]
      operationId: getGoalForWorkItem
      summary: 获取任务所属根 Goal
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/Goal" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /workspaces/{workspace_id}/goals/{goal_id}/handoffs:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/GoalId" }
    get:
      tags: [handoffs]
      operationId: listGoalHandoffs
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/HandoffList" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{workspace_id}/todos/{todo_id}/handoffs:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/TodoId" }
    get:
      tags: [handoffs]
      operationId: listTodoHandoffs
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/HandoffList" } } } }
        "404": { $ref: "#/components/responses/NotFound" }


  /workspaces/{workspace_id}/handoffs/{handoff_id}:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/HandoffId" }
    get:
      tags: [handoffs]
      operationId: getHandoff
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/Handoff" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{workspace_id}/goals/{goal_id}/todos/{todo_id}/handoffs:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/GoalId" }
      - { $ref: "#/components/parameters/TodoId" }
    post:
      tags: [handoffs]
      operationId: createHandoff
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/HandoffCreate" } } } }
      responses:
        "201": { content: { application/json: { schema: { $ref: "#/components/schemas/Handoff" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /workspaces/{workspace_id}/handoffs/{handoff_id}/commands/accept:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/HandoffId" }
    post:
      tags: [handoffs]
      operationId: acceptHandoff
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/HandoffAcceptCommand" } } } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/Handoff" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /workspaces/{workspace_id}/handoffs/{handoff_id}/commands/reject:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/HandoffId" }
    post:
      tags: [handoffs]
      operationId: rejectHandoff
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/HandoffRejectCommand" } } } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/Handoff" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /workspaces/{workspace_id}/handoffs/{handoff_id}/commands/cancel:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/HandoffId" }
    post:
      tags: [handoffs]
      operationId: cancelHandoff
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/Handoff" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /workspaces/{workspace_id}/goals/{goal_id}/evidence:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/GoalId" }
    get:
      tags: [goals]
      operationId: listGoalEvidence
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/GovernanceEvidenceList" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{workspace_id}/goals/{goal_id}/todos/{todo_id}/evidence/delivery-brief-snapshots:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/GoalId" }
      - { $ref: "#/components/parameters/TodoId" }
    post:
      tags: [governance]
      operationId: captureDeliveryBriefSnapshot
      summary: 捕获不可变 Delivery Brief 证据快照
      description: 捕获当前确定性 Delivery Brief；响应含受限 Artifact 元数据，因此需要审批权限。快照只追加不可更新。
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliveryBriefSnapshotCreate" }
      responses:
        "201": { content: { application/json: { schema: { $ref: "#/components/schemas/DeliveryBriefSnapshot" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /workspaces/{workspace_id}/delivery-brief-snapshots/{snapshot_id}:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/DeliveryBriefSnapshotId" }
    get:
      tags: [governance]
      operationId: getDeliveryBriefSnapshot
      summary: 获取不可变 Delivery Brief 证据快照
      description: 读取已封存的确定性 Brief 快照；响应可能包含受限 Artifact 元数据，需要审批权限。
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/DeliveryBriefSnapshot" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{workspace_id}/goals/{goal_id}/projection:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/GoalId" }
    get:
      tags: [goals]
      operationId: getGovernanceProjection
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/GovernanceGoalProjection" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{workspace_id}/goals/{goal_id}/projection/repairs:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/GoalId" }
    get:
      tags: [goals]
      operationId: listProjectionRepairs
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ProjectionRepairList" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{workspace_id}/goals/{goal_id}/projection/commands/repair:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/GoalId" }
    post:
      tags: [goals]
      operationId: repairGovernanceProjection
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectionRepairCommand" } } } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ProjectionRepairResult" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /workspaces/{workspace_id}/review-queue:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [workspace]
      operationId: listReviewQueue
      summary: 服务端权威 Review Queue 投影
      description: |
        唯一派生条件：record_kind=task、status=in_progress、phase IN (review,
        acceptance)；排序固定 pending_since ASC, priority DESC, id ASC。
        total_count 是 badge 权威值，不得以当前页长度计算。
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, maximum: 200 }
        - name: priority
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Priority" }
        - name: phase
          in: query
          required: false
          schema: { type: string, enum: [review, acceptance] }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ReviewQueue" } } } }

  /work-items/{work_item_id}/delivery-brief:
    parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
    get:
      tags: [work-items]
      operationId: getDeliveryBrief
      summary: 确定性验收交付简报（服务端聚合，无 LLM 摘要）
      description: |
        整个 Brief 在同一数据库 read transaction 内聚合；freshness.as_of_event_seq
        取同一 snapshot 内 Workspace MAX(stream_seq)。来源读取失败返回可用部分并列出
        missing_sources（state=partial）；Task/Chat 边界或权限失败整体 fail closed。
        attempts/runs/evidence/files/artifacts/comments/risks 有服务端上限，
        超限返回 truncation=true 与完整总数，不静默截断。
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/DeliveryBrief" } } } }
        "404": { $ref: "#/components/responses/Conflict" }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: run-scoped-knowledge-token
      description: 仅由活动 Run 注入的知识访问凭据；Run 终态后立即失效

  parameters:
    CodeWorkspaceSessionId: { name: session_id, in: path, required: true, schema: { type: string }, description: 随机的短期阅读会话标识 }
    WorkspaceId: { name: workspace_id, in: path, required: true, schema: { type: string } }
    AgentProfileId: { name: agent_profile_id, in: path, required: true, schema: { type: string } }
    WorkItemId: { name: work_item_id, in: path, required: true, schema: { type: string } }
    RunId: { name: run_id, in: path, required: true, schema: { type: string } }
    PlanId: { name: plan_id, in: path, required: true, schema: { type: string } }
    GoalId: { name: goal_id, in: path, required: true, schema: { type: string, pattern: "^goal_" } }
    TodoId: { name: todo_id, in: path, required: true, schema: { type: string, pattern: "^todo_" } }
    TurnSeq: { name: turn_seq, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    HandoffId: { name: handoff_id, in: path, required: true, schema: { type: string, pattern: "^handoff_" } }
    DeliveryBriefSnapshotId: { name: snapshot_id, in: path, required: true, schema: { type: string, pattern: "^brief_" } }
    ArtifactId: { name: artifact_id, in: path, required: true, schema: { type: string, pattern: "^artifact_" } }
    ApprovalId: { name: approval_id, in: path, required: true, schema: { type: string } }
    QuestionId: { name: question_id, in: path, required: true, schema: { type: string, pattern: "^question_" } }
    RuntimeBindingId: { name: runtime_binding_id, in: path, required: true, schema: { type: string } }
    ModelId: { name: model_id, in: path, required: true, schema: { type: string } }
    ExecutionHostId: { name: host_id, in: path, required: true, schema: { type: string } }
    WorkspaceLocationId: { name: location_id, in: path, required: true, schema: { type: string } }
    KnowledgeItemId:
      name: item_id
      in: path
      required: true
      schema: { type: string, pattern: "^kb_" }
    KnowledgeVersionSelector:
      name: version
      in: path
      required: true
      schema: { type: string, pattern: "^(kbv_|[1-9][0-9]*$)" }
      description: 数字版本或 kbv_ 前缀的固定版本 ID
    KnowledgeSubmissionId:
      name: submission_id
      in: path
      required: true
      schema: { type: string, pattern: "^kss_" }
    KnowledgeJobId:
      name: job_id
      in: path
      required: true
      schema: { type: string, pattern: "^kbj_" }
    KnowledgeAgentView:
      name: agent_id
      in: query
      required: false
      schema: { type: string }
      description: 仅管理身份可指定 Agent 私有视图；不授予额外权限，缺省为共享或管理员默认视图。
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
      description: |
        写命令幂等键。同 key 同请求体：已完成则重放原响应（Idempotent-Replayed: true），
        执行中返回 409 idempotency_in_progress（retryable，稍后重试）；
        同 key 不同请求体返回 409 idempotency_conflict；5xx 后占位释放，可同 key 重试。
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string }
      description: 可选（该操作天然幂等，不依赖此头）。
    IfMatch: { name: If-Match, in: header, required: false, schema: { type: string } }
    Cursor: { name: cursor, in: query, required: false, schema: { type: string } }

  responses:
    Conflict:
      description: 幂等冲突或乐观锁版本冲突
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Unprocessable:
      description: 领域校验失败（状态机非法迁移等）
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    CursorExpired:
      description: SSE cursor 已过保留窗口；客户端需重新 bootstrap
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Unauthorized:
      description: 缺少或无效的会话凭据，或 Run-bound token 缺失、无效、已过期
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Forbidden:
      description: 当前身份没有该知识资源或管理动作的权限
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    NotFound:
      description: 资源不在当前 Workspace、Agent 或 Run-bound 可见范围
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    BadRequest:
      description: 请求体、Idempotency-Key 或 query 参数格式不合法
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }

  schemas:
    CodeWorkspaceSession:
      type: object
      required: [id, frame_url, repository_identity, read_only, expires_at]
      properties:
        id: { type: string }
        frame_url: { type: string, description: 当前服务内的相对 iframe URL }
        repository_identity: { type: string }
        branch: { type: string }
        worktree_ref: { type: string }
        read_only: { type: boolean, const: true }
        expires_at: { type: string, format: date-time }

    CodeWorkspaceBootstrap:
      type: object
      required: [gateway_base_url, workspace, read_only, embedded]
      properties:
        gateway_base_url: { type: string, description: 当前会话的同源 Gateway 代理前缀 }
        read_only: { type: boolean, const: true }
        embedded: { type: boolean, const: true }
        workspace:
          type: object
          required: [id, status]
          properties:
            id: { type: string }
            status: { type: string }
            root_display: { type: string, description: 逻辑仓库显示名称，不是宿主绝对路径 }
            lsp_enabled: { type: boolean }
            lsp_status: { type: string }

    KnowledgeStatus:
      type: string
      enum: [candidate, draft, effective, superseded, repealed]

    KnowledgeVisibility:
      type: string
      enum: [private, workspace]

    KnowledgeSourceKind:
      type: string
      enum: [run, artifact, work_item, document, code, test, user, agent]

    KnowledgeRelationKind:
      type: string
      enum: [related_to, depends_on, impacts, triggers, calls, subscribes_to, shares_state, constrained_by, conflicts_with, supersedes]

    KnowledgeRelationDirection:
      type: string
      enum: [both, out, in]

    KnowledgeSubmissionStatus:
      type: string
      enum: [received, processing, accepted, merged, rejected, needs_review]

    KnowledgeCoverageStatus:
      type: string
      enum: [complete, partial, missing, conflict]

    KnowledgeJobMode:
      type: string
      enum: [inquiry, curation]

    KnowledgeJobStatus:
      type: string
      enum: [queued, running, waiting_retry, completed, incomplete, conflict, cancelled, failed]

    KnowledgeScope:
      type: object
      description: 适用范围元数据；通常包含 project/repository/branch/feature/condition 等键。
      additionalProperties: true

    KnowledgeLibrarianConfig:
      type: object
      additionalProperties: false
      required: [workspace_id, librarian_agent_id, enabled, auto_collect, version, created_at, updated_at]
      properties:
        workspace_id: { type: string }
        librarian_agent_id: { type: string }
        enabled: { type: boolean }
        auto_collect: { type: boolean }
        version: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    KnowledgeLibrarianConfigPatch:
      type: object
      additionalProperties: false
      description: 内置知识管理员身份不可替换；只允许更新 enabled、auto_collect 和 expected_version。
      required: [expected_version]
