        workspace_ids: { type: array, items: { type: string } }
        feature_flags: { type: object, additionalProperties: { type: boolean } }

    WorkspaceList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Workspace" } }

    Workspace:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        timezone: { type: string }
        version: { type: integer }
        project: { $ref: "#/components/schemas/WorkspaceProject" }
        setup: { $ref: "#/components/schemas/WorkspaceSetup" }

    WorkspaceProject:
      type: object
      properties:
        execution_host_id: { type: string }
        mount_alias: { type: string }
        mount_generation: { type: string }
        repository_identity: { type: string }
        canonical_key: { type: string }
        location_id: { type: string }
        status: { type: string, enum: [pending, ready, unavailable, setup_failed] }
        error: { type: string }
        source_workspace_id: { type: string }
        version: { type: integer }

    WorkspaceSetup:
      type: object
      properties:
        status: { type: string, enum: [pending, ready, failed] }
        source_workspace_id: { type: string }
        agent_count: { type: integer }

    WorkspacePatch:
      type: object
      properties:
        name: { type: string }
        timezone: { type: string }
        expected_version: { type: integer }

    Bootstrap:
      type: object
      properties:
        workspace: { $ref: "#/components/schemas/Workspace" }
        dashboard: { $ref: "#/components/schemas/Dashboard" }
        agents: { $ref: "#/components/schemas/AgentProfileList" }
        work_items: { $ref: "#/components/schemas/WorkItemList" }
        health: { $ref: "#/components/schemas/SystemHealth" }
        event_cursor: { type: integer }

    Dashboard:
      type: object
      properties:
        active_agents: { type: integer }
        running_tasks: { type: integer }
        completed_today: { type: integer }
        board_counts:
          type: object
          properties:
            todo: { type: integer }
            in_progress: { type: integer }
            blocked: { type: integer }
            completed: { type: integer }
        recent_activities: { $ref: "#/components/schemas/ActivityList" }

    SystemHealth:
      type: object
      properties:
        control_plane: { type: string, enum: [healthy, degraded, down] }
        runners: { type: array, items: { type: object, properties: { runner_id: { type: string }, status: { type: string } } } }

    AgentProfileList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AgentProfile" } }

    AgentProfileCreate:
      type: object
      required: [name, role]
      properties:
        name: { type: string }
        role: { type: string, enum: [pm, architect, ui, developer, reviewer, custom] }
        skills: { type: array, items: { type: string } }
        runtime_preference: { $ref: "#/components/schemas/RuntimePreference" }
        avatar: { type: string }

    AgentProfilePatch:
      type: object
      description: 普通 Agent 可更新全部适用字段；kind=knowledge_librarian 时只允许 runtime_preference、model_override 和 expected_version，系统身份与提示词不可修改。
      properties:
        name: { type: string, description: 普通 Agent 字段；knowledge_librarian 固定身份拒绝修改。 }
        role: { type: string, description: 普通 Agent 字段；knowledge_librarian 固定身份拒绝修改。 }
        skills: { type: array, items: { type: string }, description: 普通 Agent 字段；knowledge_librarian 固定身份拒绝修改。 }
        instructions: { type: string, description: 普通 Agent 字段；knowledge_librarian 固定提示词拒绝修改。 }
        runtime_preference: { $ref: "#/components/schemas/RuntimePreference" }
        model_override: { $ref: "#/components/schemas/ModelRef" }
        policy: { allOf: [{ $ref: "#/components/schemas/AgentPolicy" }], description: 普通 Agent 字段；knowledge_librarian 固定策略拒绝修改。 }
        expected_version: { type: integer }

    DisableOptions:
      type: object
      properties:
        active_run_policy: { type: string, enum: [interrupt, continue, cancel], default: interrupt }

    AgentProfile:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [user, task_coordinator, knowledge_librarian] }
        is_system: { type: boolean }
        name: { type: string }
        role: { type: string }
        skills: { type: array, items: { type: string } }
        instructions: { type: string }
        availability: { type: string, enum: [enabled, disabled] }
        presence: { type: string, enum: [idle, busy, degraded, offline] }
        current_run_summary:
          type: object
          nullable: true
          properties:
            run_id: { type: string }
            work_item_id: { type: string }
            title: { type: string }
            progress: { type: number }
        runtime_preference: { $ref: "#/components/schemas/RuntimePreference" }
        model_override: { $ref: "#/components/schemas/ModelRef" }
        policy: { $ref: "#/components/schemas/AgentPolicy" }
        instructions_editable: { type: boolean }
        version: { type: integer }

    CoordinatorConfig:
      type: object
      required: [workspace_id, kind, runtime_label, model_ref, reasoning_effort, prompt_version, prompt_locked, instructions_editable, version]
      properties:
        workspace_id: { type: string }
        kind: { type: string, enum: [task_coordinator] }
        runtime_label: { type: string, enum: [codex_local, kimi_local, mock] }
        model_ref: { type: string }
        reasoning_effort: { type: string, enum: [minimal, low, medium, high, xhigh] }
        fallback_runtime_label: { type: string, enum: [codex_local, kimi_local, mock] }
        fallback_model_ref: { type: string }
        prompt_version: { type: string, enum: [task-coordinator.v1] }
        prompt_locked: { type: boolean, enum: [true] }
        instructions_editable: { type: boolean, enum: [false] }
        version: { type: integer }

    CoordinatorConfigPatch:
      type: object
      required: [expected_version]
      properties:
        runtime_label: { type: string, enum: [codex_local, kimi_local] }
        model_ref: { type: string }
        reasoning_effort: { type: string, enum: [minimal, low, medium, high, xhigh] }
        fallback_runtime_label: { type: string, enum: [codex_local, kimi_local] }
        fallback_model_ref: { type: string }
        expected_version: { type: integer }
        instructions: { type: string, description: 始终拒绝；提示词由系统内置 }
        prompt: { type: string, description: 始终拒绝；提示词由系统内置 }

    CoordinatorFailure:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        retryable: { type: boolean }

    CoordinatorAgentRef:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string }
        runtime: { type: string }

    CoordinatorAttempt:
      type: object
      properties:
        id: { type: string }
        run_id: { type: string }
        agent: { $ref: "#/components/schemas/CoordinatorAgentRef" }
        status: { type: string }
        attempt: { type: integer }
        max_attempts: { type: integer }
        retry_of: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        failure: { $ref: "#/components/schemas/CoordinatorFailure" }
        next_action: { type: string }
        next_action_at: { type: string, format: date-time }

    CoordinatorTimelineEntry:
      type: object
      properties:
        id: { type: string }
        stage: { type: string, enum: [plan, dispatch, attempt, failure, retry, reassign, settlement, result, acceptance] }
        kind: { type: string }
        title: { type: string }
        message: { type: string }
        status: { type: string }
        occurred_at: { type: string, format: date-time }
        agent: { $ref: "#/components/schemas/CoordinatorAgentRef" }
        attempt: { type: integer }
        run_id: { type: string }
        retry_of: { type: string }
        failure: { $ref: "#/components/schemas/CoordinatorFailure" }
        next_action_at: { type: string, format: date-time }

    CoordinatorSnapshot:
      type: object
      required: [root_work_item_id, work_item_id, status, attempts, timeline, updated_at, version]
      properties:
        root_work_item_id: { type: string }
        work_item_id: { type: string }
        status: { type: string }
        stage: { type: string }
        progress: { type: number, nullable: true }
        completed_steps: { type: integer }
        total_steps: { type: integer }
        current_agent: { $ref: "#/components/schemas/CoordinatorAgentRef" }
        next_action: { type: string }
        next_action_at: { type: string, format: date-time }
        blocker: { $ref: "#/components/schemas/Blocker" }
        runtime_label: { type: string }
        model_ref: { type: string }
        reasoning_effort: { type: string }
        prompt_version: { type: string }
        prompt_locked: { type: boolean, enum: [true] }
        attempts: { type: array, items: { $ref: "#/components/schemas/CoordinatorAttempt" } }
        timeline: { type: array, items: { $ref: "#/components/schemas/CoordinatorTimelineEntry" } }
        updated_at: { type: string, format: date-time }
        version: { type: integer }

    CoordinatorTimelineList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/CoordinatorTimelineEntry" } }

    RuntimePreference:
      type: object
      properties:
        preferred: { type: string }
        fallbacks: { type: array, items: { type: string } }
        mode: { type: string, enum: [default, plan] }
        agent_preset: { type: string }

    ModelRef:
      type: object
      properties:
        ref: { type: string }
        provider: { type: string }
        model: { type: string }

    AgentPolicy:
      type: object
      properties:
        tools: { type: array, items: { type: string } }
        approval_policy: { type: string, enum: [auto, approve_high_risk, manual] }
        sandbox: { type: string, enum: [read-only, workspace-write, danger-full-access] }
        permission_preset: { type: string }

    WorkItemList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/WorkItem" } }
        next_cursor: { type: string, nullable: true }

    WorkItemTree:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/WorkItem" } }

    PlanStatus:
      type: string
      enum: [active, waiting, finished, cancelled, failed]
      description: finished/cancelled/failed 为终态；waiting 由同主任务新 plan 提交 supersede 收口（M4 审批放行可 waiting→active 续跑，为唯一回拨边）。

    PlanVerb:
      type: string
      enum: [dispatch, defer, join, finish, consult_knowledge]
      description: M4 词汇表；未知 verb 提交即 400。consult_knowledge 检索结果写 step payload.results，供 dispatch.knowledge_from 引用；join 为带显式等待集的 defer 变体。

    PlanSubmit:
      type: object
      required: [work_item_id, agent_profile_id, steps]
      properties:
        work_item_id: { type: string }
        agent_profile_id: { type: string, description: plan owner（提交者 / lead agent） }
        source_run_id: { type: string, nullable: true }
        guardrails:
          $ref: "#/components/schemas/PlanGuardrails"
        steps:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PlanStepSubmit" }

    PlanGuardrails:
      type: object
      description: M4 预算护栏（提交时固化进 plan）。max_dispatch 提交期整单校验（超限 400 不部分执行）；max_tokens 在子任务静默唤醒点核算（主任务树全部 run 的 input+output token 合计，超限 plan failed + 主任务 blocker）。
      properties:
        max_dispatch: { type: integer, description: dispatch 步数上限 }
        max_tokens: { type: integer, format: int64, description: 主任务树 token 总预算 }

    PlanStepSubmit:
      type: object
      required: [verb]
      properties:
        verb: { $ref: "#/components/schemas/PlanVerb" }
        agent_id: { type: string, description: dispatch 必填（目标执行 agent） }
        title: { type: string, description: dispatch 必填 }
        instruction: { type: string, description: dispatch 必填 }
        acceptance: { type: array, items: { type: string } }
        priority: { $ref: "#/components/schemas/Priority" }
        reason: { type: string, description: defer 挂起原因 }
        wake_at: { type: string, format: date-time, description: defer/join 可选出口；与等待集内活跃子任务至少居其一 }
        children:
          description: join 必填（defer 无此字段）。显式等待集："all" 或既有子任务 id 数组；非 "all" 目标必须是本 plan 主任务的子任务，否则 400。
          oneOf:
            - type: string
              enum: [all]
            - type: array
              items: { type: string }
              minItems: 1
        summary: { type: string, description: finish 收尾说明 }
        evaluation: { type: boolean, description: finish 后追加验收评估 run（instruction 含验收标准与子任务摘要，agent 为 plan owner） }
        corpus: { type: string, description: consult_knowledge 必填；单层目录名（拒绝路径分隔符与 `.`/`..`） }
        terms: { type: array, items: { type: string }, description: consult_knowledge 检索词 }
        limit: { type: integer, description: consult_knowledge 返回条数上限 }
        knowledge_from: { type: integer, description: dispatch 可选；引用更早的 consult_knowledge 步骤（0 基序号），检索条目注入 instruction 附录 }

    Plan:
      type: object
      properties:
        id: { type: string }
        workspace_id: { type: string }
        work_item_id: { type: string }
        agent_profile_id: { type: string }
        source_run_id: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/PlanStatus" }
        superseded_by: { type: string, nullable: true }
        guardrails: { $ref: "#/components/schemas/PlanGuardrails" }
        error: { type: string, nullable: true, description: plan 级失败码（budget_exceeded）；步骤级失败原因在 PlanStep.error }
        steps: { type: array, items: { $ref: "#/components/schemas/PlanStep" } }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PlanStep:
      type: object
      properties:
        seq: { type: integer }
        verb: { $ref: "#/components/schemas/PlanVerb" }
        status: { type: string, enum: [pending, executed, skipped, failed] }
        payload: { type: object, additionalProperties: true }
        result_work_item_id: { type: string, nullable: true }
        result_run_id: { type: string, nullable: true }
        error: { type: string, nullable: true }

    WorkItemCreate:
      type: object
      required: [title]
      properties:
        title: { type: string }
        record_kind: { type: string, enum: [chat, task], default: task, description: 新记录类型；公开创建省略时按 task 处理，Chat 必须显式传 chat }
        description: { type: string }
        status: { $ref: "#/components/schemas/WorkItemStatus", default: todo, description: 根 Task 只能省略或为 todo；其他初始状态返回 422。Chat 保留独立记录的旧语义 }
        priority: { $ref: "#/components/schemas/Priority", default: medium }
        due_date: { type: string, format: date }
        agent_profile_id: { type: string, nullable: true, description: Chat 可选；公开 Task（含省略 record_kind）禁止传入，返回 422，由系统 Coordinator 选择 Worker }
        parent_id: { type: string, nullable: true, description: 同类型父记录 id }
        client_key: { type: string, description: 实体级幂等键 }
        acceptance_criteria:
          type: array
          maxItems: 64
          items: { type: string, minLength: 1, maxLength: 2000 }
          description: 根 Task 必填且至少一条；子 Task 可省略。持久化在 WorkItem 与 Coordinator state 中。
      allOf:
        - if:
            allOf:
              - anyOf:
                  - not: { required: [parent_id] }
                  - allOf:
                      - required: [parent_id]
                      - properties:
                          parent_id: { type: [string, "null"], enum: [null, ""] }
              - anyOf:
                  - not: { required: [record_kind] }
                  - properties: { record_kind: { const: task } }
          then:
            required: [acceptance_criteria]
            properties:
              acceptance_criteria: { minItems: 1 }

    WorkItemPatch:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        priority: { $ref: "#/components/schemas/Priority" }
        due_date: { type: string, format: date }
        expected_version: { type: integer }

    WorkItemStatus:
      type: string
      enum: [todo, in_progress, blocked, completed, cancelled]

    Priority:
      type: string
      enum: [low, medium, high, urgent]

    WorkItemReview:
      type: object
      description: 任务验收只读可用性；ready 不包含当前用户权限，按钮能力包含当前会话权限。
      required: [ready, can_accept, can_return]
      properties:
        ready: { type: boolean, description: 根任务阶段与 Coordinator waiting_user 已到人审阶段 }
        can_accept: { type: boolean, description: 当前会话可提交总任务验收 }
        can_return: { type: boolean, description: 当前会话可提交总任务打回 }
        accept_reason: { type: string, description: 验收不可用或当前会话无验收权限时的说明 }
        return_reason: { type: string, description: 打回不可用或当前会话无打回权限时的说明 }

    WorkItem:
      type: object
      properties:
        id: { type: string }
        workspace_id: { type: string }
        record_kind: { type: string, enum: [chat, task], description: 不可变记录类型 }
        parent_id: { type: string, nullable: true, description: 父任务 id；根任务缺省 }
        title: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/WorkItemStatus" }
        phase: { type: string, enum: [execution, review, acceptance], nullable: true }
        priority: { $ref: "#/components/schemas/Priority" }
        due_date: { type: string, format: date, nullable: true }
        agent_profile_id: { type: string, nullable: true }
        assignee_summary:
          type: object
          nullable: true
          properties:
            name: { type: string }
            avatar: { type: string }
        blocker:
          type: object
          nullable: true
          properties:
            code: { type: string }
            message: { type: string }
            source: { type: string }
            created_at: { type: string, format: date-time }
        review: { $ref: "#/components/schemas/WorkItemReview" }
        runs_count: { type: integer }
        latest_run_id: { type: string, nullable: true }
        rolling_digest: { type: string, description: 任务台账滚动摘要（S2 确定性生成，无 LLM；仅详情响应携带，列表省略） }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DecisionCreate:
      type: object
      required: [quote]
      properties:
        quote: { type: string, description: 用户原话（必填，trim 后非空；禁止 LLM 转述进 quote） }
        source_run_id: { type: string, description: 可选钉出来源轮次；必须属于该 work item }
        source_ref: { type: string, description: 可选链回片段内位置（消息序号等） }

    DecisionEntry:
      type: object
      description: 决策台账行（S2）：任务级共享记忆的用户原话引文。
      properties:
        id: { type: string, description: "dec_ 前缀" }
        work_item_id: { type: string }
        quote: { type: string }
        source_run_id: { type: string, description: 缺省时未钉来源 }
        source_ref: { type: string }
        created_at: { type: string, format: date-time }

    DecisionList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DecisionEntry" } }

    SearchList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SearchItem" } }

    SearchItem:
      type: object
      description: 检索命中项（S4）；索引为派生存储，定点重写幂等，不发 SSE 事件。
      properties:
        kind: { type: string, enum: [segment_summary, decision, artifact] }
        work_item_id: { type: string }
        source_id: { type: string, description: 决策 id / work item id（segment_summary）/ artifact id }
        title: { type: string, description: 任务标题 / quote 前 80 字 / logical_path }
        snippet: { type: string, description: "正文命中摘录，[] 包裹命中词、… 省略号" }

    RunCreate:
      type: object
      required: [agent_profile_id, input]
      properties:
        agent_profile_id: { type: string }
        output_contract: { type: string, enum: [languagegui/v1, chat-analysis/v1] }
        runtime_preference: { $ref: "#/components/schemas/RuntimePreference" }
        requirements:
          type: object
          additionalProperties: { type: string, enum: [required, preferred, optional] }
        input:
          type: object
          required: [instruction]
          properties:
            instruction: { type: string }
            acceptance_criteria: { type: array, items: { type: string } }
            source_refs:
              type: array
              items: { $ref: "#/components/schemas/ChatSourceRef" }

    ChatSourceRef:
      type: object
      required: [source_id, sha256]
      properties:
        source_id: { type: string }
        sha256: { type: string, minLength: 64, maxLength: 64, pattern: "^[0-9a-fA-F]{64}$" }

    ChatSource:
      type: object
      properties:
        id: { type: string }
        workspace_id: { type: string }
        chat_id: { type: string }
        agent_id: { type: string }
        client_key: { type: string }
        filename: { type: string }
        mime: { type: string }
        size: { type: integer, format: int64 }
        sha256: { type: string, minLength: 64, maxLength: 64, pattern: "^[0-9a-fA-F]{64}$" }
        status: { type: string, enum: [saved, handed_to_agent, read, failed] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        handed_at: { type: string, format: date-time, nullable: true }

    ChatSourceList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ChatSource" } }

    RunAccepted:
      type: object
      properties:
        run_id: { type: string }
        work_item_id: { type: string }
        status: { type: string }
        version: { type: integer }
        capability_snapshot_id: { type: string, nullable: true }

    ChatAnalysis:
      type: object
      required: [workspace_id, chat_id, agent_id, version, revision, status, pending_count, answered_count, deferred_count, answers]
      properties:
        workspace_id: { type: string }
        chat_id: { type: string }
        agent_id: { type: string }
        version: { type: integer, minimum: 0 }
        revision: { type: integer, format: int64, minimum: 0 }
        status: { type: string, enum: [idle, analyzing, needs_answer, ready, failed, stale] }
        run_id: { type: string, nullable: true }
        error: { type: string, nullable: true }
        document: { $ref: "#/components/schemas/ChatAnalysisDocument", nullable: true }
        current_question: { $ref: "#/components/schemas/ChatAnalysisQuestion", nullable: true }
        pending_count: { type: integer, minimum: 0 }
        answered_count: { type: integer, minimum: 0 }
        deferred_count: { type: integer, minimum: 0 }
        answers: { type: array, items: { $ref: "#/components/schemas/ChatAnalysisAnswer" } }

    ChatAnalysisDocument:
      type: object
      required: [version, summary, sources, items, questions]
      properties:
        version: { type: string, enum: [chat-analysis/v1] }
        summary: { type: string }
        sources: { type: array, items: { $ref: "#/components/schemas/ChatAnalysisSource" } }
        items: { type: array, items: { $ref: "#/components/schemas/ChatAnalysisItem" } }
        questions: { type: array, items: { $ref: "#/components/schemas/ChatAnalysisQuestion" } }

    ChatAnalysisSource:
      type: object
      required: [id, kind, ref, sha256, read_status]
      properties:
        id: { type: string }
        kind: { type: string, enum: [attachment, conversation, code, knowledge] }
        ref: { type: string }
        sha256: { type: string, minLength: 64, maxLength: 64, pattern: "^[0-9a-fA-F]{64}$" }
        version: { type: integer, minimum: 1 }
        locator: { type: string }
        coverage: { type: string }
        limitations: { type: string }
        quote: { type: string }
        read_status: { type: string, enum: [read, partial, failed] }

    ChatAnalysisItem:
      type: object
      required: [id, kind, title, detail, source_ids, basis]
      properties:
        id: { type: string }
        kind: { type: string, enum: [requirement, normal, exception, conflict, unknown] }
        title: { type: string }
        detail: { type: string }
        source_ids: { type: array, items: { type: string } }
        basis: { type: string, enum: [observed, proposed, unverified] }
        impact: { type: string }
        recommendation: { type: string }

    ChatAnalysisQuestion:
      type: object
      required: [id, prompt, selection, item_ids]
      properties:
        id: { type: string }
        prompt: { type: string }
        selection: { type: string, enum: [single, multiple, text] }
        options: { type: array, items: { $ref: "#/components/schemas/ChatAnalysisOption" } }
        item_ids: { type: array, items: { type: string } }

    ChatAnalysisOption:
      type: object
      required: [id, label]
      properties:
        id: { type: string }
        label: { type: string }

    ChatAnalysisAnswer:
      type: object
      required: [id, client_key, revision, question_id, question_fingerprint, disposition, created_at]
      properties:
        id: { type: string }
        client_key: { type: string, description: 与提交体一致的实体幂等键，供响应丢失后的草稿确认 }
        revision: { type: integer, format: int64, minimum: 1 }
        question_id: { type: string }
        question_fingerprint: { type: string }
        selected_option_ids: { type: array, items: { type: string } }
        text: { type: string }
        disposition: { type: string, enum: [answered, deferred] }
        inherited_from_answer_id: { type: string, description: 选择性继承时指向旧 revision 的原始回答 }
        lineage_reason: { type: string, description: 继承或重问的服务端原因 }
        created_at: { type: string, format: date-time }

    ChatAnalysisAnswerCreate:
      type: object
      required: [expected_version, revision, question_id, disposition, client_key]
      additionalProperties: false
      properties:
        expected_version: { type: integer, minimum: 1 }
        revision: { type: integer, format: int64, minimum: 1 }
        question_id: { type: string }
        selected_option_ids: { type: array, items: { type: string } }
        text: { type: string }
        disposition: { type: string, enum: [answered, deferred] }
        client_key: { type: string }

    ChatAnalysisDecisionCreate:
      type: object
      required: [expected_version, revision, item_id, outcome, conclusion, basis, product_version, client_key]
      additionalProperties: false
      properties:
        expected_version: { type: integer, minimum: 1 }
        revision: { type: integer, format: int64, minimum: 1 }
        item_id: { type: string }
        outcome: { type: string, enum: [confirmed, rejected, needs_clarification] }
        conclusion: { type: string, minLength: 1, maxLength: 8000 }
        basis: { type: string, minLength: 1, maxLength: 4000 }
        product_version: { type: string, minLength: 1, maxLength: 500 }
        client_key: { type: string, minLength: 1, maxLength: 240 }

    ChatAnalysisRecheck:
      type: object
      additionalProperties: false
      properties:
        expected_version: { type: integer, minimum: 1 }

    ChatAnalysisHistory:
      type: object
      required: [revisions, answers, decisions, reopens]
      properties:
        revisions: { type: array, items: { $ref: "#/components/schemas/ChatAnalysisRevision" } }
        answers: { type: array, items: { $ref: "#/components/schemas/ChatAnalysisAnswer" } }
        decisions: { type: array, items: { $ref: "#/components/schemas/ChatAnalysisDecision" } }
        reopens: { type: array, items: { $ref: "#/components/schemas/ChatAnalysisReopen" } }

    ChatAnalysisRevision:
      type: object
      required: [revision, run_id, document_digest, created_at]
      properties:
        revision: { type: integer, format: int64, minimum: 1 }
        run_id: { type: string }
        document_digest: { type: string, minLength: 64, maxLength: 64 }
        document: { $ref: "#/components/schemas/ChatAnalysisDocument" }
        created_at: { type: string, format: date-time }

    ChatAnalysisDecision:
      type: object
      required: [id, workspace_id, chat_id, agent_id, revision, item_id, outcome, conclusion, basis, product_version, item_fingerprint, actor_id, client_key, created_at]
      properties:
        id: { type: string }
        workspace_id: { type: string }
        chat_id: { type: string }
        agent_id: { type: string }
        revision: { type: integer, format: int64, minimum: 1 }
        item_id: { type: string }
        outcome: { type: string, enum: [confirmed, rejected, needs_clarification] }
        conclusion: { type: string }
        basis: { type: string }
        product_version: { type: string }
        item_fingerprint: { type: string }
        source_dependencies:
          type: array
          items: { type: object, additionalProperties: true }
        actor_id: { type: string }
        client_key: { type: string }
        created_at: { type: string, format: date-time }

    ChatAnalysisReopen:
      type: object
      required: [id, item_id, from_revision, to_revision, reason, created_at]
      properties:
        id: { type: string }
        item_id: { type: string }
        from_revision: { type: integer, format: int64, minimum: 1 }
        to_revision: { type: integer, format: int64, minimum: 1 }
        reason: { type: string }
        created_at: { type: string, format: date-time }

    PublicationDraftCreate:
      type: object
      required: [expected_version, revision, item_ids, title, client_key]
      additionalProperties: false
      properties:
        expected_version: { type: integer, minimum: 1 }
        revision: { type: integer, format: int64, minimum: 1 }
        item_ids: { type: array, minItems: 1, items: { type: string } }
        title: { type: string, minLength: 1, maxLength: 500 }
        client_key: { type: string, minLength: 1, maxLength: 240 }

    PublicationRecheck:
      type: object
      additionalProperties: false
      properties:
        expected_version: { type: integer, minimum: 1 }

    PublicationPublish:
      type: object
      required: [expected_version, client_key]
      additionalProperties: false
      properties:
        expected_version: { type: integer, minimum: 1 }
        client_key: { type: string, minLength: 1, maxLength: 240 }

    PublicationDraft:
      type: object
      required: [draft_id, workspace_id, chat_id, agent_id, analysis_revision, item_ids, confirmation_ids, source_dependencies, title, description, acceptance_criteria, context_snapshot_id, project_baseline, fingerprint, status, client_key, version]
      properties:
        draft_id: { type: string }
        workspace_id: { type: string }
        chat_id: { type: string }
        agent_id: { type: string }
        analysis_revision: { type: integer, format: int64, minimum: 1 }
        item_ids: { type: array, items: { type: string } }
        confirmation_ids: { type: array, items: { type: string } }
        source_dependencies: { type: array, items: { type: object, additionalProperties: true } }
        title: { type: string }
        description: { type: string }
        acceptance_criteria: { type: array, items: { type: string } }
        context_snapshot_id: { type: string }
        project_baseline: { type: object, additionalProperties: true }
        fingerprint: { type: string }
        status: { type: string, enum: [ready, stale, published] }
        task_id: { type: string, nullable: true }
        client_key: { type: string }
        version: { type: integer }

    PublicationDraftList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PublicationDraft" } }

    PublicationPublishResponse:
      type: object
      required: [draft, task]
      properties:
        draft: { $ref: "#/components/schemas/PublicationDraft" }
        task: { $ref: "#/components/schemas/WorkItem" }

    ExecutionRun:
      type: object
      properties:
        id: { type: string }
        work_item_id: { type: string }
        agent_profile_id: { type: string }
        status: { $ref: "#/components/schemas/RunStatus" }
        provider: { type: string, nullable: true }
        runtime_label: { type: string, nullable: true }
        output_contract: { type: string, enum: [languagegui/v1, chat-analysis/v1], nullable: true }
        progress: { type: number, nullable: true }
        retry_of: { type: string, nullable: true }
        failure:
          type: object
          nullable: true
          properties:
            code: { type: string }
            message: { type: string }
            retryable: { type: boolean }
        usage_in: { type: integer, format: int64, description: 本轮输入 token（adapter 上报；零值省略） }
        usage_out: { type: integer, format: int64, description: 本轮输出 token（adapter 上报；零值省略） }
        usage_cached: { type: integer, format: int64, description: 本轮缓存命中 token（adapter 上报；零值省略） }
        usage_basis: { type: string, enum: [per_run, session_cumulative], description: 用量口径；per_run 为本轮增量，session_cumulative 为会话累计（消费方做差量） }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RunStatus:
      type: string
      enum: [queued, starting, running, waiting_approval, interrupting, cancelling, reconnecting, succeeding, succeeded, interrupted, cancelled, lost, failed]

    ApprovalList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Approval" } }

    Approval:
      type: object
      description: 以实现为准（httpapi approvalDTO）；不输出 requested_by/expires_at。run_id 为空（null）表示 M4 plan_dispatch 审批（不挂 run，经 approval.requested 事件的 data.plan_id 定位）。
      properties:
        id: { type: string }
        run_id: { type: string, nullable: true }
        work_item_id: { type: string }
        kind: { type: string, description: plan_dispatch 表示 M4 审批护栏的 dispatch 人工闸门 }
        risk: { type: string, enum: [low, medium, high] }
        status: { type: string, enum: [pending, approved, rejected, expired] }
        summary: { type: string }
        resolved_at: { type: string, format: date-time, nullable: true }
        resolved_by: { type: string, nullable: true }

    QuestionList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Question" } }

    Question:
      type: object
      required: [id, run_id, work_item_id, session_ref, provider_id, questions, status, created_at]
      properties:
        id: { type: string, pattern: "^question_" }
        run_id: { type: string }
        work_item_id: { type: string }
        session_ref: { type: string }
        provider_id: { type: string }
        agent_id: { type: string }
        turn_id: { type: integer, format: int64 }
        tool_call_id: { type: string }
        questions: { type: array, minItems: 1, maxItems: 4, items: { type: object, additionalProperties: true } }
        status: { type: string, enum: [pending, answered, dismissed, expired] }
        response: { type: object, nullable: true, additionalProperties: true }
        created_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }

    ArtifactList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Artifact" } }

    Artifact:
      type: object
      properties:
        id: { type: string }
        run_id: { type: string }
        logical_path: { type: string }
        mime: { type: string }
        size: { type: integer }
        sha256: { type: string }
        status: { type: string, enum: [draft, accepted] }
        created_at: { type: string, format: date-time }

    ActivityList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Activity" } }
        next_cursor: { type: string, nullable: true }

    Activity:
      type: object
      properties:
        id: { type: string }
        work_item_id: { type: string, nullable: true, description: 归因任务（M4；verdict/blocker 级 activity 非空；activity.appended 事件 data 同键） }
        kind: { type: string }
        message: { type: string }
        occurred_at: { type: string, format: date-time }

    RuntimeBindingList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/RuntimeBinding" } }

    RuntimeBinding:
      type: object
      properties:
        id: { type: string }
        runtime_label: { type: string }
        adapter_id: { type: string }
        adapter_version: { type: string }
        provider_version: { type: string, nullable: true }
        provider: { type: string, description: "模型提供方，如 deepseek / openai" }
        model: { type: string, description: "模型配置，如 deepseek-chat" }
        credential_ref: { type: string, description: "CredentialRef；绝不返回凭据明文" }
        capabilities: { type: object, additionalProperties: { type: string } }
        status: { type: string, enum: [ready, probing, degraded, unavailable] }
        version: { type: integer }

    ProbeResult:
      type: object
      properties:
        runtime_binding_id: { type: string }
        ok: { type: boolean }
        provider_version: { type: string, nullable: true }
        capabilities: { type: object, additionalProperties: { type: string } }
        error: { type: string, nullable: true }

    ExecutionRunList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ExecutionRun" } }

    DispatchCardList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DispatchCard" } }

    DispatchCard:
      type: object
      description: 派发卡片（会话元模型 S1）：一次发送形成的执行批次 + 成员会话组摘要。
      properties:
        id: { type: string, description: "disp_ 前缀" }
        work_item_id: { type: string }
        trigger: { type: string, enum: [user_message, lead_plan, wakeup] }
        lead_run_id: { type: string, description: 接诊 run / plan source run；@直达批次省略 }
        status: { type: string, enum: [running, collecting, completed, degraded, cancelled] }
        trigger_message:
          type: object
          description: 触发消息摘录（接诊/lead_plan 取 lead run 指令；@直达取最早成员 run）
          properties:
            run_id: { type: string }
            excerpt: { type: string }
        runs:
          type: array
          description: 成员 runs（会话组；created_at 升序）
          items:
            type: object
            properties:
              id: { type: string }
              work_item_id: { type: string }
              agent_profile_id: { type: string }
              agent_name: { type: string }
              role: { type: string, enum: [worker, coordinator, evaluation] }
              status: { type: string }
              summary: { type: string, description: 一行摘要（S1 为 run 指令摘录，确定性生成） }
        created_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true }

    RunChanges:
      type: object
      required: [file_count, additions, deletions, files, state, can_revert, version]
      properties:
        file_count: { type: integer }
        additions: { type: integer }
        deletions: { type: integer }
        files: { type: array, items: { $ref: "#/components/schemas/RunChangeFile" } }
        state: { type: string, enum: [ready, unavailable, reverted] }
        can_revert: { type: boolean }
        reason: { type: string }
        version: { type: integer }
    RunChangeFile:
      type: object
      required: [path, kind, additions, deletions, write_count, last_turn_index]
      properties:
        path: { type: string }
        kind: { type: string, enum: [added, modified, deleted, renamed] }
        additions: { type: integer }
        deletions: { type: integer }
        write_count: { type: integer }
        last_turn_index: { type: integer }
        binary: { type: boolean }

    RunEventList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/RunEvent" } }

    RunEvent:
      type: object
      description: 与实现一致（ListRunEvents 投影；前端 TS 同形）。
      properties:
        run_seq: { type: integer }
        event_type: { type: string, description: "run.created/message.delta/message.completed/tool.*/approval.*/run.status_changed 等" }
        payload: { type: object, additionalProperties: true, nullable: true }
        occurred_at: { type: string, format: date-time }

    RunJournal:
      type: object
      description: 环节日志调试投影（internal 事件投影）。未闭合 phase（closed_at/outcome/duration_ms 均为 null）即崩溃/卡死故障点。
      required: [run_id, generated_at, phases, log, governance, decisions]
      properties:
        run_id: { type: string }
        generated_at: { type: string, format: date-time }
        phases: { type: array, items: { $ref: "#/components/schemas/RunJournalPhase" } }
        log: { $ref: "#/components/schemas/RunJournalLog" }
        governance: { $ref: "#/components/schemas/RunJournalGovernance" }
        decisions: { type: array, items: { $ref: "#/components/schemas/RunJournalDecision" } }

    RunJournalPhase:
      type: object
      description: 一对 phase_entered/phase_closed 的配对投影（按 phase+attempt 依 run_seq 配对）。
      required: [phase, attempt, entered_at, closed_at, outcome, duration_ms, failure, detail]
      properties:
        phase: { type: string, description: "dispatch/spawn/handshake/first_event/streaming/settle/post" }
        attempt: { type: integer, description: 从 1 起；自愈/重跑同一环节时递增 }
        entered_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true, description: null=未闭合（故障点） }
        outcome: { type: string, nullable: true, description: "ok|failed|skipped；null=未闭合" }
        duration_ms: { type: integer, nullable: true }
        failure: { $ref: "#/components/schemas/RunJournalPhaseFailure" }
        detail: { type: object, additionalProperties: true, nullable: true, description: 闭合取 closed 载荷、未闭合取 entered 载荷中除保留键外的证据键；无证据为 null }

    RunJournalPhaseFailure:
      type: object
      description: 与 run 终态 failure 家族对齐（同一套分类码读两条链）。
      required: [code, message, retryable]
      properties:
        code: { type: string }
        message: { type: string }
        family: { type: string }
        retryable: { type: boolean }

    RunJournalLog:
      type: object
      description: run.log_chunk 统计（64KB 环形截断的可见性）。
      required: [chunks, truncated]
      properties:
        chunks: { type: integer }
        truncated: { type: boolean }

    RunJournalGovernance:
      type: object
      description: run 所属治理回合（turn_receipt_phases.run_ids[] 含本 run 的最新 turn 的 receipt header 摘要）；无治理引用为 null。
      required: [goal_id, todo_id, turn_seq, digest]
      properties:
        goal_id: { type: string }
        todo_id: { type: string }
        turn_seq: { type: integer }
        digest: { type: string, description: receipt header canonical_digest }

    RunJournalDecision:
      type: object
      description: run.decision 决策因果链投影（非治理域决策；治理决策由 receipt phase1 承担）。
      required: [kind, reason, occurred_at, inputs]
      properties:
        kind: { type: string }
        reason: { type: string }
        occurred_at: { type: string, format: date-time }
        link_run_id: { type: string, description: 跨 run 因果（原 run → 新 run）；无则省略 }
        inputs: { type: object, additionalProperties: true, nullable: true, description: 决策载荷除 kind/reason/link_run_id 外的关键输入证据；无输入为 null }

    AgentConfigReloadResult:
      type: object
      properties:
        created: { type: integer }
        updated: { type: integer }
        skipped: { type: integer }

    ModelEntryList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ModelEntry" } }

    ModelEntry:
      type: object
      description: 模型注册表条目（models/<id>.yaml）；词汇对齐 pi-ai provider profile。
      properties:
        id: { type: string, description: 小写 slug，文件名 }
        display_name: { type: string }
        category: { type: string, description: "UI 展示分类，如 OpenCode Go / Kimi；不参与 runtime 路由" }
        provider: { type: string, description: "provider 路由名，如 deepseek-official / anthropic / 自定义网关" }
        api: { type: string, enum: ["", openai-completions, openai-responses, anthropic-messages], description: 线协议；空 = runtime 默认 }
        model: { type: string }
        api_key_env: { type: string, description: 凭据环境变量名（引用，绝不明文） }
        base_url: { type: string, description: OpenAI 兼容端点 }
        context_window: { type: integer }
        max_tokens: { type: integer }
        notes: { type: string }

    ModelUpsert:
      type: object
      required: [display_name, provider, model]
      properties:
        id: { type: string, description: "POST 可空（由 display_name 生成）；PUT 忽略（path 为权威）" }
        display_name: { type: string }
        category: { type: string, description: "UI 展示分类，如 OpenCode Go / Kimi；不参与 runtime 路由" }
        provider: { type: string }
        api: { type: string, enum: ["", openai-completions, openai-responses, anthropic-messages] }
        model: { type: string }
        api_key_env: { type: string }
        base_url: { type: string }
        context_window: { type: integer }
        max_tokens: { type: integer }
        notes: { type: string }

    TaskSession:
      type: object
      description: 跨 Run 会话锚点（Paperclip agent_task_sessions 对应物）；唯一键 (workspace, agent, adapter, task_key)。
      required: [id, agent_profile_id, adapter_id, task_key, runs_count, input_tokens_cum, created_at, updated_at]
      properties:
        id: { type: string }
        agent_profile_id: { type: string }
        adapter_id: { type: string }
        task_key: { type: string, description: 通常是 work item ID }
        session_ref: { type: string, description: "provider 会话句柄（如 codex://thread_x、dsh://session-y）" }
        session_params:
          type: object
          additionalProperties: true
          description: adapter 私有参数 + 保留键 __ref/__fingerprint/__from_run_id/__cleared_reason
        display_id: { type: string, description: provider 侧人类可读会话 id }
        runs_count: { type: integer, description: 本代会话已被多少 Run 使用（轮换阈值输入；轮换后清零重起） }
        input_tokens_cum: { type: integer, format: int64, description: 本代累计输入 token（轮换阈值输入） }
        segment_seq: { type: integer, description: 参与线片段序号——同一 task_key 下第 N 段会话（轮换代际 +1，缺省 1） }
        created_at: { type: string, format: date-time, description: 本代会话代际起点（72h 轮换阈值基准） }
        updated_at: { type: string, format: date-time }

    HealthStatus:
      type: object
      required: [health]
      properties:
        health:
          type: object
          properties:
            control_plane: { type: string, enum: [healthy] }
            runners:
              type: array
              items:
                type: object
                additionalProperties: true

    # ── 任务控制面补全（task-control-surface RFC §4/§9）──────────────────

    ExecutionHost:
      type: object
      description: 稳定宿主身份；不等于一次 Runner 连接或进程。status 是连接/健康投影，不是 Run 状态。
      required: [id, name, kind, status, version]
      properties:
        id: { type: string, description: "host_ 前缀；host_local 为受保护本机 Host" }
        name: { type: string }
        kind: { type: string, enum: [local, remote] }
        status: { type: string, enum: [ready, degraded, offline] }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ExecutionHostList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ExecutionHost" } }

    ExecutionHostEnrollment:
      type: object
      description: Host 创建/凭据轮换响应；credential 明文只在本次响应出现，服务端只保存 ref/hash。
      required: [host, enrollment_credential]
      properties:
        host: { $ref: "#/components/schemas/ExecutionHost" }
        enrollment_credential: { type: string, description: Runner bearer credential；subject 固定绑定 host_id }

    HostMount:
      type: object
      description: Host 本地受信 registry 的广告投影；绝对路径只存在 Host 本地配置。
      required: [execution_host_id, alias, repository_identity, registry_generation, status]
      properties:
        execution_host_id: { type: string }
        alias: { type: string }
        repository_identity: { type: string, description: 跨 Host 稳定逻辑 ID }
        display_label: { type: string }
        default_branch: { type: string }
        supported_ref_kinds: { type: array, items: { type: string, enum: [root, branch, worktree] } }
        checkouts:
          type: array
          description: opaque checkout refs（Host 本地受信发现生成）
          items:
            type: object
            required: [ref, kind, branch, head]
            properties:
              ref: { type: string }
              kind: { type: string, enum: [root, branch, worktree] }
              branch: { type: string, nullable: true }
              head: { type: string }
        registry_generation: { type: string }
        status: { type: string, enum: [ready, unavailable] }
        last_seen_at: { type: string, format: date-time }

    HostMountList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/HostMount" } }

    WorkspaceLocation:
      type: object
      description: 把业务 Workspace 绑定到一个 HostMount；Workspace 不等于路径。
      required: [id, workspace_id, execution_host_id, mount_alias, mount_generation, repository_identity, status, version]
      properties:
        id: { type: string, description: "wsloc_ 前缀" }
        workspace_id: { type: string }
        execution_host_id: { type: string }
        mount_alias: { type: string }
        mount_generation: { type: string }
        repository_identity: { type: string }
        is_default: { type: boolean, description: 每 Workspace 至多一个默认 Location }
        status: { type: string, enum: [ready, degraded, unavailable], description: 随 Host/Mount 健康变化；identity/version 只由显式命令修改 }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WorkspaceLocationList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/WorkspaceLocation" } }

    WorkspaceLocationCreate:
      type: object
      required: [execution_host_id, mount_alias, repository_identity]
      additionalProperties: false
      description: |
        不接受 path / cwd / root_path / absolute_path（additionalProperties: false，
        携带返回 403 workspace_path_forbidden）。创建必须携带预期 mount_generation。
      properties:
        execution_host_id: { type: string }
        mount_alias: { type: string }
        repository_identity: { type: string }
        mount_generation: { type: string, description: 预期广告 generation；不符返回 409 workspace_mount_generation_changed }
        is_default: { type: boolean, default: false }

    WorkspaceLocationPatch:
      type: object
      required: [expected_version]
      additionalProperties: false
      properties:
        repository_identity: { type: string }
        mount_generation: { type: string, description: 预期广告 generation }
        is_default: { type: boolean }
        expected_version: { type: integer }

    WorkspaceLocationProbeResult:
      type: object
      required: [location_id, status, checked_at]
      properties:
        location_id: { type: string }
        status: { type: string, enum: [ready, degraded, unavailable] }
        detail: { type: string, nullable: true }
        checked_at: { type: string, format: date-time }

    DevelopmentContext:
      type: object
      description: WorkItem 的逻辑开发选择，不是已解析 cwd；无 path/cwd/absolute_path 字段。
      required: [work_item_id, ref_kind, version]
      properties:
        work_item_id: { type: string }
        context_owner_id: { type: string, description: 默认根 Task }
        workspace_location_id: { type: string }
        ref_kind: { type: string, enum: [root, branch, worktree] }
        branch_name: { type: string, nullable: true }
        checkout_ref: { type: string, nullable: true }
        worktree_ref: { type: string, nullable: true, description: Host-local opaque ref }
        base_revision: { type: string, nullable: true }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SetDevelopmentContextCommand:
      type: object
      required: [ref_kind, expected_version]
      additionalProperties: false
      description: |
        root：branch/worktree 为空；branch：branch_name 与 checkout_ref 非空且
        checkout 必须唯一命中（0/多命中返回 409 workspace_branch_not_unique）；
        worktree：worktree_ref 非空且必须来自目标 Host registry 对该 repository
        的发现结果。非法组合返回 422 development_context_invalid。
      properties:
        workspace_location_id: { type: string, description: 子 Task 第一版不允许改变（禁止跨 Host/Location） }
        ref_kind: { type: string, enum: [root, branch, worktree] }
        branch_name: { type: string }
        checkout_ref: { type: string }
        worktree_ref: { type: string }
        base_revision: { type: string }
        expected_version: { type: integer }

    ExecutionContextSnapshot:
      type: object
      description: Run 创建时冻结的不可变快照；INSERT 后禁止 UPDATE/DELETE，Run 与 Snapshot 一对一。
      required: [id, run_id, schema_version, workspace_id, workspace_location_id, location_version, mount_generation, execution_host_id, mount_alias, repository_identity, ref_kind, context_generation, source, snapshot_digest, created_at]
      properties:
        id: { type: string, description: "ctxsnap_ 前缀" }
        run_id: { type: string }
        schema_version: { type: string, const: execution-context/v1 }
        workspace_id: { type: string }
        workspace_location_id: { type: string }
        location_version: { type: integer }
        mount_generation: { type: string }
        execution_host_id: { type: string }
        mount_alias: { type: string }
        repository_identity: { type: string }
        ref_kind: { type: string, enum: [root, branch, worktree] }
        branch_name: { type: string, nullable: true }
        checkout_ref: { type: string, nullable: true }
        worktree_ref: { type: string, nullable: true }
        base_revision: { type: string, nullable: true }
        context_generation: { type: integer }
        source: { type: string, enum: [current, inherited, retry, evaluation, recovery] }
        source_snapshot_id: { type: string, nullable: true }
        snapshot_digest:
          type: string
          description: |
            固定算法 sha256("execution-context/v1\n" + RFC8785CanonicalJSON(identity_fields))；
            identity_fields 只含执行身份字段。覆盖 mount_generation，alias 被重指向时
            旧 Location/Snapshot 不能静默继续。
        host_mount_status:
          type: object
          description: Host/Mount 当前健康投影（只读；不含绝对 cwd）
          properties:
            execution_host_status: { type: string, enum: [ready, degraded, offline] }
            mount_status: { type: string, enum: [ready, unavailable] }
        created_at: { type: string, format: date-time }

    TaskComment:
      type: object
      description: append-only 任务反馈评论；无 update/delete，revision 在根 Task 维度分配。
      required: [id, workspace_id, root_work_item_id, work_item_id, revision, kind, body, actor_kind, actor_id, created_at]
      properties:
        id: { type: string, description: "cmt_ 前缀" }
        workspace_id: { type: string }
        root_work_item_id: { type: string }
        work_item_id: { type: string, description: 评论落点的子 Task；根 Task 评论时等于 root }
        revision: { type: integer, format: int64, description: 根 Task 维度单调，UNIQUE(root_work_item_id, revision) }
        kind: { type: string, enum: [note, requirement, review_feedback] }
        body: { type: string, description: 1..16384 字节（trim 后）；进入模型前是不可信数据 }
        actor_kind: { type: string, enum: [user, system, runtime] }
        actor_id: { type: string }
        source_run_id: { type: string, nullable: true }
        source_ref: { type: string, nullable: true }
        client_key: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    TaskCommentCreate:
      type: object
      required: [kind, body]
      additionalProperties: false
      description: 只接受 note|requirement；review_feedback 只能由 return 命令生成（422 comment_kind_invalid）。
      properties:
        kind: { type: string, enum: [note, requirement] }
        body: { type: string, minLength: 1, maxLength: 16384 }
        source_run_id: { type: string, description: 可选；必须属于该 Task 树（422 comment_source_run_mismatch） }
        source_ref: { type: string }
        client_key: { type: string, description: 唯一域 (root_work_item_id, client_key)；同 key 不同 body 返回 409 idempotency_conflict }
        expected_work_item_version: { type: integer, description: note 可省略；requirement 推荐必填，防止基于终态/旧 phase 追加 }

    TaskCommentList:
      type: object
      required: [items, latest_revision]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/TaskComment" } }
        next_revision: { type: integer, format: int64, nullable: true, description: 下一页 after_revision 游标，等于本页最大 revision；comment cursor 与 Workspace SSE stream_seq 严格分离 }
        latest_revision: { type: integer, format: int64 }

    ReviewQueue:
      type: object
      description: 服务端权威投影；total_count 是 badge 权威值。
      required: [items, total_count, generated_at]
      properties:
        items:
          type: array
          items:
            type: object
            required: [work_item, pending_since, source_watermark]
            properties:
              work_item: { $ref: "#/components/schemas/WorkItem" }
              pending_since: { type: string, format: date-time, description: = phase_entered_at；review→execution→review 必须得到新时间 }
              coordinator:
                type: object
                nullable: true
                properties:
                  status: { type: string }
                  stage: { type: string }
                  updated_at: { type: string, format: date-time }
                  version: { type: integer }
              latest_run_id: { type: string, nullable: true }
              source_watermark: { $ref: "#/components/schemas/SourceWatermark" }
        total_count: { type: integer, description: 当前查询条件下的全量匹配数（badge 权威值；不得以当前页长度或前端已加载数量计算） }
        next_cursor: { type: string, nullable: true }
        generated_at: { type: string, format: date-time }

    SourceWatermark:
      type: object
      description: 各来源读模型版本水位（同一 read snapshot 内读取）。
      required: [as_of_event_seq]
      properties:
        as_of_event_seq: { type: integer, format: int64, description: 同一 snapshot 内 Workspace MAX(stream_seq) }
        work_item_version: { type: integer }
        coordinator_version: { type: integer }
        latest_run_version: { type: integer }
        comment_revision: { type: integer, format: int64 }

    DeliveryBriefConclusion:
      type: object
      required: [coordinator_status, version]
      properties:
        coordinator_status: { type: string }
        stage: { type: string }
        summary: { type: string }
        next_action: { type: string }
        version: { type: integer }

    AttemptSummary:
      type: object
      required: [attempt, role, run_id, status]
      properties:
        attempt: { type: integer }
        role: { type: string, enum: [coordinator, worker, evaluation] }
        run_id: { type: string }
        agent_id: { type: string }
        agent_name: { type: string }
        status: { type: string }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        retry_of: { type: string, nullable: true }
        failure:
          type: object
          nullable: true
          properties:
            code: { type: string }
            message: { type: string }
            retryable: { type: boolean }

    EvidenceItem:
      type: object
      required: [id, source_kind, source_id, status, trust, occurred_at]
      properties:
        id: { type: string }
        source_kind: { type: string, enum: [coordinator_event, run_status, evaluation_verdict, tool_result, artifact, change_set] }
        source_id: { type: string }
        label: { type: string }
        status: { type: string, enum: [passed, failed, warning, unknown] }
        trust: { type: string, enum: [control_plane, runtime_reported, model_reported], description: 普通 Markdown 只算 model_reported；白名单结构化 run event 才是 tool_result }
        occurred_at: { type: string, format: date-time }

    RunEvidence:
      type: object
      required: [run, evidence, truncated]
      properties:
        run: { $ref: "#/components/schemas/ExecutionRun" }
        summary: { type: string }
        evidence:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/EvidenceItem" }
        truncated: { type: boolean }

    BriefChangeSet:
      type: object
      description: 按 Run 分组的既有 run file-change read model；不把多个 Run 混成一个 diff。
      required: [run_id, files, total_files, total_added, total_deleted, truncated]
      properties:
        run_id: { type: string }
        files:
          type: array
          maxItems: 200
          items:
            type: object
            required: [path, added, deleted, status]
            properties:
              path: { type: string }
              added: { type: integer }
              deleted: { type: integer }
              status: { type: string, enum: [added, modified, deleted, renamed] }
        total_files: { type: integer }
        total_added: { type: integer }
        total_deleted: { type: integer }
        truncated: { type: boolean }

    RiskItem:
      type: object
      required: [source_kind, source_id, code, message, severity]
      properties:
        source_kind: { type: string, description: blocker / run_failure / coordinator_error / review_finding }
        source_id: { type: string }
        code: { type: string }
        message: { type: string }
        severity: { type: string, enum: [low, medium, high] }

    DeliveryBriefFreshness:
      type: object
      required: [generated_at, as_of_event_seq, state]
      properties:
        generated_at: { type: string, format: date-time }
        as_of_event_seq: { type: integer, format: int64 }
        source_versions: { type: object, additionalProperties: { type: integer }, description: 各来源 read model 版本水位 }
        state: { type: string, enum: [current, partial], description: 任一非权限来源读取失败为 partial 并列出 missing_sources }
        missing_sources: { type: array, items: { type: string } }

    DeliveryBriefTruncation:
      type: object
      description: 各段落是否超上限截断（attempts 50 / runs 100 / files 200 / artifacts 100 / comments 200）；超限同时返回完整总数。
      required: [attempts, runs, files, artifacts, comments]
      properties:
        attempts: { type: boolean }
        runs: { type: boolean }
        files: { type: boolean }
        artifacts: { type: boolean }
        comments: { type: boolean }

    DeliveryBrief:
      type: object
      description: 确定性服务端聚合；不能复用 rolling_digest 代替完整证据。
      required: [work_item, acceptance_criteria, conclusion, attempts, runs, artifacts, risks, comments, freshness, truncation]
      properties:
        work_item: { $ref: "#/components/schemas/WorkItem" }
        acceptance_criteria: { type: array, items: { type: string } }
        conclusion: { $ref: "#/components/schemas/DeliveryBriefConclusion" }
        attempts:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/AttemptSummary" }
        runs:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/RunEvidence" }
        changes: { $ref: "#/components/schemas/BriefChangeSet", nullable: true }
        artifacts:
          type: array
          maxItems: 100
          description: ArtifactRepo 按 classification 权限过滤后的产物
          items: { $ref: "#/components/schemas/Artifact" }
        blocker:
          type: object
          nullable: true
          properties:
            code: { type: string }
            message: { type: string }
            source: { type: string }
            run_id: { type: string, nullable: true }
            created_at: { type: string, format: date-time }
        risks:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/RiskItem" }
        comments:
          type: array
          maxItems: 200
          description: requirement/review_feedback 评论，按 root revision 排序
          items: { $ref: "#/components/schemas/TaskComment" }
        freshness: { $ref: "#/components/schemas/DeliveryBriefFreshness" }
        truncation: { $ref: "#/components/schemas/DeliveryBriefTruncation" }

    PlanDecisionV2:
      x-lifecycle: live
      description: Planner 到 Control Plane 的唯一 production wire envelope；canonical shape 只在外部 JSON Schema 维护。
      $ref: "../control/plan-decision-v2.schema.json"

    PlannerControlCapability:
      x-lifecycle: live
      type: string
      description: |
        structured_transport 只表示机器可分帧传输；schema_constrained_output
        表示 Provider 原生按给定 schema 约束生成；control_tool_call 表示可调用
        typed control tool。三者不得互相推断，也不得由 adapter/provider 名称推断。
      enum: [structured_transport, schema_constrained_output, control_tool_call]

    GovernanceErrorCode:
      x-lifecycle: live
      type: string
      enum:
        - plan_json_syntax
        - plan_schema_validation
        - plan_semantic_validation
        - plan_authority_denied
        - plan_quota_denied
        - cost_price_unavailable
        - usage_unresolved

    GoalStatus:
      x-lifecycle: live
      type: string
      enum: [draft, active, waiting, blocked, completed, cancelled]

    Goal:
      x-lifecycle: live
      type: object
      additionalProperties: false
      description: |
        长期意图 aggregate；首版与一个 root Task WorkItem 一对一。它不复制
        Plan/Run 列表，执行证据通过既有实体引用读取。
      required:
        - id
        - workspace_id
        - root_work_item_id
        - objective
        - acceptance_contract
        - status
        - phase
        - current_todo_id
        - quota_policies
        - completion_evidence_summary
        - version
        - created_at
        - updated_at
      properties:
        id: { type: string, pattern: "^goal_[0-9A-HJKMNP-TV-Z]{26}$" }
        workspace_id: { type: string, pattern: "^ws_" }
        root_work_item_id: { type: string, pattern: "^wi_" }
        objective: { type: string, minLength: 1, maxLength: 20000 }
        acceptance_contract:
          type: array
          minItems: 1
          maxItems: 64
          items: { type: string, minLength: 1, maxLength: 2000 }
        status: { $ref: "#/components/schemas/GoalStatus" }
        phase:
          type: string
          minLength: 1
          maxLength: 128
          description: 服务端阶段投影标签；不是第二套状态机。
        current_todo_id:
          type: [string, "null"]
          pattern: "^todo_[0-9A-HJKMNP-TV-Z]{26}$"
        quota_policies:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/QuotaPolicy" }
        completion_evidence_summary:
          type: array
          maxItems: 128
          items: { $ref: "#/components/schemas/GovernanceEvidenceItem" }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    GoalList:
      x-lifecycle: live
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Goal" }

    GoalCancellationAccepted:
      x-lifecycle: live
      type: object
      additionalProperties: false
      description: |
        取消事务已经提交，但提交后 Run/配额清理仍需恢复循环重放。客户端不得
        把该响应当成事务失败；使用同一 Idempotency-Key 重试会得到同一响应。
      required: [goal, recovery_pending, recovery_checkpoint]
      properties:
        goal: { $ref: "#/components/schemas/Goal" }
        recovery_pending: { type: boolean, const: true }
        recovery_checkpoint:
          type: object
          additionalProperties: false
          required: [kind, root_work_item_id]
          properties:
            kind: { type: string, enum: [goal_cancelled_cleanup] }
            root_work_item_id: { type: string, pattern: "^wi_" }

    GoalGovernanceMetrics:
      x-lifecycle: live
      type: object
      additionalProperties: false
      readOnly: true
      description: 单个已存在 Goal 的确定性 Turn/Run/已提交 token 与 cost spend 汇总。
      required:
        - goal_id
        - turn_count
        - run_count
        - input_tokens_total
        - input_uncached_tokens
        - cache_read_tokens
        - cache_write_tokens
        - output_tokens
        - cost_microusd
      properties:
        goal_id: { type: string, pattern: "^goal_" }
        turn_count: { type: integer, format: int64, minimum: 0 }
        run_count: { type: integer, format: int64, minimum: 0 }
        input_tokens_total: { type: integer, format: int64, minimum: 0 }
        input_uncached_tokens: { type: integer, format: int64, minimum: 0 }
        cache_read_tokens: { type: integer, format: int64, minimum: 0 }
        cache_write_tokens: { type: integer, format: int64, minimum: 0 }
        output_tokens: { type: integer, format: int64, minimum: 0 }
        cost_microusd: { type: integer, format: int64, minimum: 0 }

    GovernanceMetrics:
      x-lifecycle: live
      type: object
      additionalProperties: false
      readOnly: true
      description: 从 Workspace canonical event stream 与 Goal/receipt/quota/Run 权威事实重算的治理指标读模型。
      required:
        - workspace_id
        - source_event_seq
        - plan_decode_success
        - plan_decode_errors
        - repair_attempts
        - repair_successes
        - repair_blockers
        - receipt_replays
        - receipt_conflicts
        - projection_divergences
        - evidence_finish_rejections
        - user_unblocks
        - projection_updates
        - handoffs
        - evidence_items
        - goal_summaries
      properties:
        workspace_id: { type: string, pattern: "^ws_" }
        source_event_seq: { type: integer, format: int64, minimum: 0 }
        plan_decode_success: { type: integer, format: int64, minimum: 0 }
        plan_decode_errors:
