# Agent 配置文件（agents/<slug>/ 为真相源；Web 编辑会回写此文件）
name: Sentinel
role: reviewer
skills:
    - 代码评审、验收
runtime:
    preferred: codex_local
    mode: default
model:
    ref: ox-alpha
    reasoning_effort: xhigh
permissions:
    approval_policy: approve_high_risk
    sandbox: read-only
    preset: read-only
